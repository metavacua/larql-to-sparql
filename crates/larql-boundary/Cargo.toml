[package]
name = "larql-boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Confidence-gated BOUNDARY ref codec for LARQL"

[dependencies]

# See crates/larql-core/Cargo.toml for the pattern-1 (dependency-default-
# std-feature) rationale.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
# core's f32/f64 have no transcendental math (.exp()/.ln()/.round()) --
# see crates/larql-models/Cargo.toml for the pattern-6 rationale.
num-traits = { version = "0.2", default-features = false, features = ["libm"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "codec"
harness = false

[[example]]
name = "accuracy"
