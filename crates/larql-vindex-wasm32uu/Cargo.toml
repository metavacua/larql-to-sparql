[package]
name = "larql-vindex-wasm32uu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Browser/Node.js WASM bindings for vindex gate-KNN — standalone, no OS deps"
keywords = ["wasm", "vindex", "knowledge-graph", "webassembly"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = { workspace = true }
# f16 decode for gate_vectors.bin (no std::io, pure arithmetic)
half         = { version = "2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm]
split-candidate = true
