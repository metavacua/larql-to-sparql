[package]
name = "larql-compute"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Compute backend trait + CPU implementation for LARQL. GPU backends ship as sibling crates (larql-compute-metal, future larql-compute-vulkan / larql-compute-cuda)."
keywords = ["matmul", "cpu", "blas", "quantization", "trait"]
categories = ["science"]

[dependencies]
# Matrix types — blas feature added per-platform below where a backend exists
ndarray = "0.16"
# MoE expert parallelism: top-k experts run independently per token.
rayon = "1.10"
# Wire-format constants (Q4_K_BLOCK_ELEMS, etc.) for padding decisions.
# Tests/benches depend on it too — keep both lists in sync.
larql-models = { path = "../larql-models" }
# RotorQuant K/V cache compression — Phase 1 of the long-context arc.
# Pulled in only with the `cuda` feature; the CPU build doesn't link
# RotorQuant since the device-resident KV cache (`Qwen35KvSlabDev`)
# only exists on CUDA. The crate's `cuda` feature exposes
# `copy_f16_to_quantized_device` / `dequantize_to_f32_device` —
# the f16↔compressed device-side wrappers we'll wire into the qwen35
# attention path.
larql-rotorquant = { path = "../larql-rotorquant", optional = true, default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"], default-features = false }
openblas-src = { version = "0.10", features = ["system"] }
# cudarc — high-level CUDA bindings. Pinned to 0.19.x (first version
# whose `cuda-version-from-build-system` feature autodetects the host
# toolkit, supporting CUDA 11.04 through 13.02). `dep:cudarc` is wired
# through the `cuda` feature so the dep is only pulled in when
# explicitly requested.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "cublas",
    "driver",
    # nvrtc — runtime PTX compilation for the softmax kernel
    # (cuda-fused-attention onward). Built kernels are cached under
    # cuda::cache::cache_dir().
    "nvrtc",
    # CUDA toolkit ABI to bind against. Override this in your fork if
    # your install differs — `cuda-12050` matches CUDA 12.5.x (Ubuntu
    # 24.04's `nvidia-cuda-toolkit` ships this), `cuda-13010` matches
    # CUDA 13.1.x. Mismatch surfaces as
    # `DlSym { source: "...: undefined symbol: cublasGetEmulationStrategy" }`
    # at first dispatch — pick the variant matching libcublas.so on
    # your `LD_LIBRARY_PATH`.
    "cuda-12050",
    # Dynamic loading: dlopen the CUDA runtime at startup. Avoids hard
    # build-time linkage so the same binary runs in CPU-only contexts
    # (returns CudaInitError::DriverMissing) and on hosts with the
    # toolkit installed.
    "dynamic-loading",
    # f16 — exposes `Gemm<half::f16>` / `Gemm<half::bf16>` for the
    # `cuda-prefill-tensor-cores` change. cuBLAS routes f16 inputs +
    # f32 accumulator through Tensor Cores on Ada/Ampere/Hopper.
    "f16",
] }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6de050946cd1013335a33cf2c5144888a32efab3", package = "cuda-device", optional = true }
# half — fp16 / bf16 numeric types. Used by `cuda-prefill-tensor-cores`
# to pass f16 GEMM inputs through cuBLAS hgemm. Re-exported by cudarc
# under the `f16` feature, but we depend on it directly so non-CUDA
# builds don't pay for it.
half = { version = "2", optional = true, features = ["num-traits"] }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "6de050946cd1013335a33cf2c5144888a32efab3", package = "cuda-host", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `metal` + `objc` moved to `larql-compute-metal` per ADR-019. This crate
# is CPU-only; Metal GPU dependencies live in the sibling crate.
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

# Windows: no BLAS *backend*. The system OpenBLAS has a memory-pool
# race that even `OPENBLAS_NUM_THREADS=1` + `OMP_NUM_THREADS=1` +
# `RUST_TEST_THREADS=1` doesn't fully eliminate (`BLAS : Bad memory
# unallocation!` warning, ~0.6 K-buffer drift on successive matmuls
# producing intermittent failures across
# larql-kv::{vindex_compare, markov_residual} self-equality tests).
# The CI env-var fix (#124) reduced the rate but didn't close it.
#
# Dropping ndarray's `blas` feature on Windows routes matmul through
# the pure-Rust path — slower on Windows production inference but
# deterministic. `blas-src` is kept as a featureless dep so the
# `extern crate blas_src;` declarations across this crate's tests /
# examples / benches still compile (the crate is essentially empty
# without a backend feature, so nothing links to OpenBLAS).
# Mac (Accelerate) and Linux (OpenBLAS, which works correctly there)
# are unchanged.
[target.'cfg(target_os = "windows")'.dependencies]
ndarray = "0.16"
blas-src = { version = "0.10", default-features = false }


[features]
default = []
# cuda — CUDA backend (Linux), dormant/opt-in. Slated for extraction into a
# `larql-compute-cuda` sibling crate (mirrors larql-compute-metal); kept gated
# here until that extraction lands on a CUDA/CI-capable branch.
cuda = ["dep:cudarc", "dep:half", "dep:larql-rotorquant", "larql-rotorquant/cuda"]
# Experimental cuda-oxide custom-kernel pilot.
cuda-oxide = ["dep:cudarc", "dep:cuda-device", "dep:cuda-host"]
# Opt-in gate for the slow integration suites. Plain
# `cargo test -p larql-compute` skips them so the dev loop stays under
# ~10 s; CI / release runs flip this on to get coverage.
heavy_tests = []
# Synthetic `KvIndex` fixtures for downstream test crates. Off by
# default so production builds never compile the fixture code. Enable
# from a consumer's `[dev-dependencies]` entry, e.g.
# `larql-compute = { path = "../larql-compute", features = ["test-utils"] }`.
# Pulls in `larql-models/test-utils` for the Q4K-friendly `ModelWeights`
# fixtures the index builder consumes.
test-utils = ["larql-models/test-utils"]

[build-dependencies]
cc = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
memmap2 = "0.9"
# Enable `larql-models`' `test-utils` feature so the moved-down
# forward-pass tests in this crate can construct `ModelWeights` via
# `larql_models::test_fixtures::make_test_weights`.
larql-models = { path = "../larql-models", features = ["test-utils"] }

[[bench]]
name = "linalg"
harness = false

[[bench]]
name = "q4k_q8k_matvec"
harness = false

# No external `cfg(cargo-clippy)` macros reach this crate after the
# `metal-rs` / `objc` deps moved to larql-compute-metal, so no
# crate-wide cfg-allowlist is needed.
