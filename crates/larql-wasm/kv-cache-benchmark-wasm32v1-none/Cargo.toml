[package]
name = "kv-cache-benchmark-wasm32v1-none"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "KV cache benchmark: Standard KV vs TurboQuant vs Markov RS vs Graph Walk"

[features]
default = []
real-model = ["larql-vindex", "larql-models", "ndarray", "tokenizers", "zip"]

[lib]
name = "kv_cache_benchmark_wasm32v1_none"

[dependencies]
serde.workspace = true

# Always available: needed for the criterion bench (accuracy metrics, engine_kind).
larql-inference = { path = "../larql-inference-wasm32v1-none", package = "larql-inference-wasm32v1-none" }
larql-kv = { path = "../larql-kv-wasm32v1-none", package = "larql-kv-wasm32v1-none" }
larql-compute = { path = "../larql-compute-wasm32v1-none", package = "larql-compute-wasm32v1-none" }

# Optional: full real-model integration (real weights, vindex, tokenizer).
larql-vindex = { path = "../larql-vindex-wasm32v1-none", package = "larql-vindex-wasm32v1-none", optional = true }
larql-models = { path = "../larql-models-wasm32v1-none", package = "larql-models-wasm32v1-none", optional = true }
# `zip` for reading the .npz container in apollo11_store (uncompressed archives).

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thiserror = "2"
serde_json = { workspace = true }
rand = "0.8"
rand_distr = "0.4"
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.21", optional = true }
zip = { version = "2", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
larql-wasm-math = { workspace = true }
thiserror = { version = "2", default-features = false }
hashbrown = { workspace = true }
libm = { workspace = true }
