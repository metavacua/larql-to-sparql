[package]
name = "larql-python-wasm32v1-none"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for LARQL knowledge graph engine and vindex"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
larql-core = { path = "larql-core-wasm32v1-none" }
larql-inference = { path = "larql-inference-wasm32v1-none" }
larql-models = { path = "larql-models-wasm32v1-none" }
larql-vindex = { path = "larql-vindex-wasm32v1-none" }
larql-lql = { path = "larql-lql-wasm32v1-none" }
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
ndarray = "0.16"
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
