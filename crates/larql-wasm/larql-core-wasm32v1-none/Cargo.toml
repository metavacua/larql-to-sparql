[package]
name = "larql-core-wasm32v1-none"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core graph engine for LARQL — knowledge graphs extracted from neural network weights"
keywords = ["knowledge-graph", "llm", "interpretability", "graph"]
categories = ["data-structures", "science"]

[dependencies]
serde_json = { workspace = true }

# HTTP provider — optional so pure graph usage has zero network deps

# Binary serialization via MessagePack
rmp-serde = { version = "1", optional = true }

[features]
default = []
http = ["dep:reqwest"]
msgpack = ["dep:rmp-serde"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
larql-wasm-math = { workspace = true }
thiserror = { version = "2", default-features = false }
libm = { workspace = true }
hashbrown = { workspace = true }
