[package]
name = "larql-router-wasm32v1-none"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Layer-sharding router for distributed larql-server deployments"

[lib]
name = "larql_router"

[dependencies]
larql-router-protocol = { path = "../larql-router-protocol-wasm32v1-none", package = "larql-router-protocol-wasm32v1-none" }

serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
futures = "0.3"
futures-core = "0.3"
serde_json = { workspace = true }
