[package]
name = "larql-cli-wasm32v1-none"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for LARQL knowledge graph extraction and querying"

[lib]
name = "larql_cli_wasm32v1_none"

[[bin]]
name = "larql"
path = "src/main.rs"

[dependencies]
larql-core = { path = "../larql-core-wasm32v1-none", package = "larql-core-wasm32v1-none" }
larql-compute = { path = "../larql-compute-wasm32v1-none", package = "larql-compute-wasm32v1-none" }
larql-inference = { path = "../larql-inference-wasm32v1-none", package = "larql-inference-wasm32v1-none" }
larql-kv = { path = "../larql-kv-wasm32v1-none", package = "larql-kv-wasm32v1-none" }
larql-models = { path = "../larql-models-wasm32v1-none", package = "larql-models-wasm32v1-none" }
larql-lql = { path = "../larql-lql-wasm32v1-none", package = "larql-lql-wasm32v1-none" }
larql-vindex = { path = "../larql-vindex-wasm32v1-none", package = "larql-vindex-wasm32v1-none" }
serde = { workspace = true, features = ["derive"] }

[features]
default = []
metal = [
    "larql-compute/metal",
    "larql-inference/metal",
    "larql-kv/metal",
    "larql-vindex/metal",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
tokenizers = "0.21"
safetensors = "0.7"
memmap2 = "0.9"
ndarray = "0.16"
minijinja = "2"
libc = "0.2"
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
larql-wasm-math = { workspace = true }
thiserror = { version = "2", default-features = false }
hashbrown = { workspace = true }
libm = { workspace = true }
