[package]
name = "larql-cli-wasm32v1-none"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for LARQL knowledge graph extraction and querying"

[dependencies]
larql-core = { path = "../larql-core-wasm32v1-none", package = "larql-core-wasm32v1-none" }
larql-compute = { path = "../larql-compute-wasm32v1-none", package = "larql-compute-wasm32v1-none" }
larql-inference = { path = "../larql-inference-wasm32v1-none", package = "larql-inference-wasm32v1-none" }
larql-kv = { path = "../larql-kv-wasm32v1-none", package = "larql-kv-wasm32v1-none" }
larql-models = { path = "../larql-models-wasm32v1-none", package = "larql-models-wasm32v1-none" }
larql-lql = { path = "../larql-lql-wasm32v1-none", package = "larql-lql-wasm32v1-none" }
larql-vindex = { path = "../larql-vindex-wasm32v1-none", package = "larql-vindex-wasm32v1-none" }
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
tokenizers = "0.21"
safetensors = "0.7"
memmap2 = "0.9"
ndarray = "0.16"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
minijinja = "2"
libc = "0.2"

[features]
default = ["metal"]
metal = [
    "larql-compute/metal",
    "larql-inference/metal",
    "larql-kv/metal",
    "larql-vindex/metal",
]

