[package]
name = "larql-geometric"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Geometric LM PoCs: complex-linear, hyperbolic, walk, and Lambek attention"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]
browser = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
wgpu = { version = "0.20", default-features = false, features = ["wgsl", "webgpu"], optional = true }
pollster = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndarray = "0.15"

[dev-dependencies]
approx = "0.5"

[[bench]]
name = "complexity"
harness = false
