[package]
name = "larql-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Transformer inference engine — forward pass, attention, FFN, layer norm from safetensors weights"
keywords = ["transformer", "inference", "llm", "interpretability"]
categories = ["science"]

[dependencies]
# `test-utils` feature gives `larql_models::test_fixtures::make_test_weights`,
# which inference's `pub mod test_utils;` re-exports for downstream test
# crates (larql-kv tests, larql-compute tests, etc.). The feature gates
# ~80 LOC of synthetic ModelWeights builder code; production callers
# don't reach it, and link-time dead-code elimination drops it from
# binaries that don't use it.
larql-models = { path = "../larql-models", features = ["test-utils"] }
larql-compute = { path = "../larql-compute" }
# Apple-only sibling backend.  Optional + activated by the local
# `gpu` feature; non-Mac builds skip the dep graph entirely.
larql-compute-metal = { path = "../larql-compute-metal", optional = true }
# default-features = false: larql-core's default features ("http",
# "msgpack") pull in reqwest/rmp-serde. Refinement of pattern 7/8: a
# workspace sibling's *default features*, if left enabled at even ONE
# call site anywhere in the resolved graph, apply everywhere that
# dependency is used -- Cargo unifies features across the whole build,
# not per edge. larql-vindex already restricts this correctly; this
# crate's un-restricted declaration was silently re-poisoning the
# wasm32 build for every crate depending on both (confirmed via
# `cargo tree --target wasm32v1-none -i js-sys`, a metadata-only
# inspection, not a build/check/test -- traced larql-kv's persistent
# E0463 cascade to exactly this edge). No source in this crate
# references larql_core's http/msgpack-gated APIs (confirmed via grep).
larql-core = { path = "../larql-core", default-features = false }
larql-vindex = { path = "../larql-vindex" }
larql-execution = { path = "../larql-execution" }
# larql-router-protocol is already self-gating (its own Cargo.toml/
# lib.rs wholesale-exclude everything on wasm32), so it's fine to keep
# as a plain path dependency -- unlike every crates.io dependency below,
# it won't pull tonic/tokio/prost into the wasm32 build at all.
larql-router-protocol = { path = "../larql-router-protocol" }

# See crates/larql-core/Cargo.toml for the pattern-1 (dependency-default-
# std-feature) rationale. rand/rand_distr/half/ndarray have a genuine
# no_std mode; everything else below is inherently native (filesystem,
# networking, OS threads, a WASM *runtime* embedding another WASM
# runtime makes no sense on wasm32v1-none itself) -- pattern 9, no
# wasm32 entry at all, same shape as larql-vindex's equivalent split.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { version = "2", default-features = false }
rand = "0.8"
rand_distr = "0.4"

# Model weights
safetensors = "0.7"
memmap2 = "0.9"

# System
libc = "0.2"

# Matrix ops (BLAS-accelerated on supported platforms; pure-Rust ndarray on Android)
ndarray = "0.16"

# Parallelism for the walk loop (per-feature work is embarrassingly parallel).
rayon = "1.10"

# Tokenizer
tokenizers = "0.21"

# Used by `residual_diff::capture` to drive the backend-side per-layer
# dump hooks into a private dir per call. dev-only would force every
# crate consumer to pull tempfile in just to use the in-memory diff API.
tempfile = "3"

# Chat-template rendering (HF `tokenizer_config.json::chat_template` is Jinja).
# `minijinja-contrib` ships `pycompat::unknown_method_callback` which gives us
# Python-style method calls (`.get()`, `.items()`, `.startswith()`, …) that
# Gemma 4 / Qwen / Llama-3 chat templates rely on.
minijinja = { version = "2", features = ["loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Remote FFN backend (RemoteWalkBackend → POST /v1/walk-ffn)
reqwest = { version = "0.12", features = ["blocking", "json"] }
half = "2"

# gRPC expert client (RemoteMoeBackend → ExpertService via tonic)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
tonic = { version = "0.13", features = ["tls-ring", "tls-webpki-roots"] }
prost = "0.13"
async-stream = "0.3"
futures = "0.3"

# WASM expert registry
wasmtime = { version = "36.0.7", default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = "36.0.7"
anyhow = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
rand = { version = "0.8", default-features = false }
rand_distr = { version = "0.4", default-features = false }
half = { version = "2", default-features = false }
ndarray = { version = "0.16", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"], default-features = false }
openblas-src = { version = "0.10", features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

# Windows: no BLAS backend. See `larql-compute/Cargo.toml` for the
# rationale. `blas-src` kept featureless so existing `extern crate
# blas_src;` declarations still compile.
[target.'cfg(target_os = "windows")'.dependencies]
ndarray = "0.16"
blas-src = { version = "0.10", default-features = false }

[features]
default = []
# Umbrella for GPU-backend support. Today this pulls in the
# `larql-compute-metal` sibling crate; future Vulkan/CUDA backends compose
# under the same flag without forcing a per-call-site feature matrix.
# Cascades `larql-vindex/gpu` so its GPU-specific paths (bench harness,
# hybrid decode glue) compile alongside ours.
gpu = ["dep:larql-compute-metal", "larql-vindex/gpu"]

[[example]]
name = "cpu_gpu_diag"
required-features = ["gpu"]

[[example]]
name = "decode_vs_prefill"
required-features = ["gpu"]

[[example]]
name = "stage_bisect"
required-features = ["gpu"]

[dev-dependencies]
assert_approx_eq = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
larql-kv = { path = "../larql-kv" }

[[bench]]
name = "wire_codec"
harness = false
