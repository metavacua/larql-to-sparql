# Single-output build fixture for the stage-driver tests.
#
# Deliberately minimal: one output keeps the driver's expected mock call
# sequence short enough to read, so a test failure points at the stage
# ordering rather than at fixture bookkeeping. Multi-output behaviour is
# covered by `gemma-3-4b-it.yaml` through the individual stage modules.
apiVersion: vindex.chukai.io/v1
kind: VindexBuild
metadata:
  name: tiny-model
spec:
  source:
    hf_repo: chrishayuk/tiny-model
    revision: 9b5b1a2f7c3e0d1a4b8f2c6e9d0a3b5c7e1f4a82
    licence: mit
  extractor:
    tool: larql
    version: "0.14.2"
    level: inference
    dtype: f16
  outputs:
    - preset: full
  verify:
    reconstruction:
      layers_sampled: 1
      seed: 1
      max_abs_diff: 0.0
      min_cosine: 1.0
    logit_match:
      prompt_set: verify/tiny-smoke.jsonl
      top1_agreement_min: 0.99
      bits_per_char_drift_max: 0.005
    from_hub: true
  publish:
    hub:
      owner: chrishayuk
      repo_template: "{model_slug}-vindex{slice_suffix}"
      repo_type: dataset
      visibility: private-until-verified
  budget:
    executor: auto
    max_wall_minutes: 30
    max_usd: 1
    requires:
      disk_gib: 8
      ram_gib: 8
      net_down_mbps: 100
