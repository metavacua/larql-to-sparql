[package]
name = "larql-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Model architecture definitions for LARQL — traits, config parsing, tensor key mappings"
keywords = ["transformer", "model-config", "llm", "architecture"]
categories = ["data-structures"]

[dependencies]
ndarray = "0.16"
rayon = "1.10"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Model weight loading
safetensors = "0.7"
memmap2 = "0.9"
bytemuck = "1"

[features]
default = []
# Synthetic `ModelWeights` builders for downstream test crates. Off by
# default so production builds never compile the fixture code. Enable
# from a consumer's `[dev-dependencies]` entry, e.g.
# `larql-models = { path = "../larql-models", features = ["test-utils"] }`.
test-utils = []

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
# Used by `q4k_q8k_kernel` bench to generate synthetic Q4_K / Q8_K
# fixtures so the per-row dot exercises a realistic numerical range.
rand = "0.8"
rand_chacha = "0.3"

[[bench]]
name = "models"
harness = false

[[bench]]
name = "q4k_q8k_kernel"
harness = false

[lints]
workspace = true
