[package]
name = "larql-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model architecture definitions for LARQL — traits, config parsing, tensor key mappings"
keywords = ["transformer", "model-config", "llm", "architecture"]
categories = ["data-structures"]

[dependencies]
larql-vindex-spec = { path = "../larql-vindex-spec" }
ndarray = "0.16"

# Model weight loading
safetensors = "0.7"
memmap2 = "0.9"

# See crates/larql-core/Cargo.toml for the pattern-1 (dependency-default-
# std-feature) rationale.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }

[features]
default = []
# Synthetic `ModelWeights` builders for downstream test crates. Off by
# default so production builds never compile the fixture code. Enable
# from a consumer's `[dev-dependencies]` entry, e.g.
# `larql-models = { path = "../larql-models", features = ["test-utils"] }`.
test-utils = []

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "models"
harness = false
