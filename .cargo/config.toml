# Cargo configuration for cross-platform builds.
#
# [build] is intentionally absent: Cargo's default `jobs` setting (number
# of logical CPUs) is the correct one. Earlier revisions of this file set
# `jobs = 0` as a no-op placeholder, but Cargo rejects 0 (`error: jobs
# may not be 0`) and the line silently broke every cargo invocation in CI.

[alias]
xtask = "run --package xtask --"

# Android cross-compilation configuration.
# NDK r23+ removed unversioned wrapper scripts; use the API-21 versioned
# clang and LLVM archiver that NDK r27 (used in CI) actually ships.
[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
ar = "llvm-ar"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"
ar = "llvm-ar"

# wasm32 test runner — dispatches `cargo test --target wasm32-unknown-unknown`
# through wasm-bindgen-test-runner (Node.js mode by default).
# Firefox/browser mode: set WASM_BINDGEN_TEST_BROWSER=firefox at invocation time.
#
# getrandom 0.3 requires both the `wasm_js` Cargo feature AND this cfg flag to
# select the JS backend; the feature alone triggers compile_error! at backends.rs.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# wasm32-wasip1 test runner — dispatches `cargo test --target wasm32-wasip1`
# through wasmtime in WASI Preview 1 mode. Install wasmtime before use:
#   curl https://wasmtime.dev/install.sh -sSf | bash
# Used by the wasip1-test CI job in .github/workflows/wasm-check.yml.
[target.wasm32-wasip1]
runner = "wasmtime --"
