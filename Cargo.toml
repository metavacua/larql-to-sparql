[workspace]
resolver = "2"
members = [
    # larql-specific
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-compute-metal",
    "crates/larql-core",
    "crates/larql-vindex",
    "crates/larql-vindex-spec",
    "crates/larql-execution",
    "crates/larql-factory",
    "crates/larql-inference",
    "crates/larql-kv",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-demos",
    "crates/larql-server",
    "crates/larql-router",
    "crates/larql-router-protocol",
    "crates/larql-python",
    # boundary codec (Phase 1-3 of BOUNDARY_REF_PROTOCOL)
    "crates/larql-boundary",
    # portable (extract to sibling repos later, names stable)
    "crates/model-compute",
]
default-members = [
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-compute-metal",
    "crates/larql-core",
    "crates/larql-vindex",
    "crates/larql-vindex-spec",
    "crates/larql-factory",
    "crates/larql-inference",
    "crates/larql-kv",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-demos",
    "crates/larql-server",
    "crates/larql-router",
    "crates/larql-router-protocol",
    "crates/larql-boundary",
    "crates/model-compute",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = []
license = "Apache-2.0"
repository = "https://github.com/chrishayuk/chuk-larql-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Mechanical unsafe-isolation gate for the wasm32v1-none/forbid-unsafe gating
# campaign (docs/superpowers/specs/2026-08-12-ci-gating-tree-discovery-design.md
# S6). Both are restriction lints (off by default in clippy itself), confirmed
# via a real run against larql-cli to fire on exactly the 2 already-known real
# unsafe blocks (walk_cmd.rs:10, trajectory_trace_cmd.rs:707) and nowhere else
# -- not a speculative addition. "warn", not "deny": promoting to "deny" is a
# separate, deliberate follow-up once the one-time safety-comment text is
# actually written for those 2 files (neither lint carries a MachineApplicable
# suggestion). Opt-in is per-crate via [lints] workspace = true, added only to
# crates a real run has actually verified against -- not applied workspace-wide
# speculatively, matching this campaign's standing "never pre-gate ahead of a
# real result" rule.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# Temporary: enable line tables in release builds so samply / flamegraph
# can resolve symbol names. Cheap (no full debug info; just symbols
# + line numbers). Remove once profiling is done.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"

# Distribution builds only (ADR-0026 release binaries) — full strip, no
# line tables. Kept separate from [profile.release] so local profiling
# builds are unaffected; CI's release.yml is the only user.
[profile.release-dist]
inherits = "release"
debug = false
strip = true
