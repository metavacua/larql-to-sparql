# Runs `cargo clippy --fix --target wasm32v1-none` on a GitHub-hosted
# runner instead of the local dev machine, then immediately verifies the
# result against the REAL native oracle before anything is ever applied
# locally.
#
# Why this exists: earlier in the gating/larql-cli-wasm-and-safe campaign,
# a local `cargo clippy --fix --target wasm32v1-none` run silently deleted
# or narrowed several imports/bindings that were "unused" only from
# wasm32v1-none's perspective, but load-bearing on native. Decision made
# in response: keep using `--fix` (it's faster than hand-applying every
# suggestion), but its output is incomplete -- not "probably fine" --
# until an immediate native verification confirms it. This workflow makes
# that immediate-verification contract structural (a `needs:` edge)
# instead of relying on the operator remembering to do it in a follow-up
# round. Full history of the regression this responds to, and of this
# file's own design iterations (diff-derived discovery, a hand-copied
# crate list, source-grepping for existing wasm32 code -- all tried and
# replaced): `.superpowers/sdd/2026-08-10-larql-cli-wasm-and-safe-gating/progress.md`.
#
# This workflow NEVER commits or pushes anything. `fix`/`fix-root` first
# run a plain `cargo clippy` (no --fix) per crate/features combination --
# `--fix`/`fmt` only run at all if that check actually found something.
# Each produces a downloadable patch (and a log of whatever `--fix`
# couldn't resolve, or a "nothing to fix" note) per combination;
# `verify-native`/`verify-native-root` are the actual gate on whether each
# patch is safe. A green `verify-native*` leg means: download that leg's
# patch, read it, and only then `git apply` + commit locally. A red one
# means the patch stays an artifact -- the affected items need hand-fixing
# (the correct default is `#[cfg(not(target_arch = "..."))]`, never
# deletion, unless justified in place with specific evidence).
#
# Crate list is derived, not maintained: `discover` (below) computes it
# from `cargo metadata`'s real dependency graph, rooted at `ROOTS` (today
# just `larql-cli`; extend this array when a new entry point -- e.g.
# larql-server, larql-python, or some other binary/library subtree --
# needs its own wasm32 gating pass). Two tiers come out of that
# computation, matching larql-cli-gating.yml's own established structure
# (verified to produce the identical 12+1 crate split that file already
# hand-encodes):
#   - `deps`: every workspace-internal crate reachable from a root,
#     excluding the roots themselves. Checked in one flat, parallel wave
#     (`fix`/`verify-native`).
#   - `roots`: the entry-point crates. Checked only after the deps wave's
#     `verify-native` completes (`fix-root`/`verify-native-root`), because
#     a root depends on (nearly) everything in `deps` -- checking it
#     first would conflate the root's own issues with cascading failures
#     from unfixed dependencies.
# `larql-compute-metal` is excluded from both tiers even though it's a
# real dependency of `larql-cli` -- not a scope opinion, a structural one:
# Metal doesn't exist off macOS, and this workflow only has a
# ubuntu-latest runner (matching larql-cli-gating.yml's own precedent of
# giving it a dedicated macOS-only job).
#
# One known gap, not solved here: `needs: verify-native` on the root tier
# only enforces ORDERING (deps run first), not CLEANLINESS -- every clippy
# step in this file uses `continue-on-error: true`, so a dep with
# unfixable findings still exits its job green (empty patch, "nothing to
# verify" notice), not red. `fix-root` therefore still runs even when a
# dependency is currently wasm32-red, unlike larql-cli-gating.yml where a
# red dependency job actually blocks the root job via GitHub's normal
# skip-on-fail. Solving that needs matrix-output aggregation (checking
# whether ANY deps-tier leg found real findings) that doesn't exist yet --
# left as a known limitation, not a silent one.
#
# Triggered by `pull_request` (branches: [main], no path filter --
# deliberately: this tool re-derives the crate list from the manifest and
# checks it on every push regardless of what changed), plus
# `workflow_dispatch: {}` for a manual re-run, matching every other
# workflow in this repo. `workflow_dispatch` needs the workflow file to
# exist on the default branch to be dispatchable at all (confirmed
# against GitHub's docs/issue tracker) -- `pull_request` doesn't share
# that requirement, so this workflow is usable from this branch's own PR
# immediately either way, and nothing in `discover`'s logic depends on
# pull_request-specific event context, so workflow_dispatch works
# identically.
#
# All matrix/crate values are routed through `env:`-mapped shell variables
# ($CRATE/$TARGET/$FEATURES, always double-quoted) in every `run:` step
# rather than interpolating `${{ ... }}` directly into a shell script --
# the same discipline this file has used since a semgrep scan caught the
# equivalent mistake in an earlier version of this file.
#
# `fix`/`verify-native` and `fix-root`/`verify-native-root` duplicate each
# other's step bodies almost entirely -- deliberately, matching
# larql-cli-gating.yml's own precedent of duplicating near-identical steps
# across its five jobs rather than factoring them out. A `workflow_call`
# refactor to de-duplicate both this file's two tiers AND
# larql-cli-gating.yml's five jobs is real future work, tracked as part of
# task #33 (consolidated tiered CI workflow) -- not attempted here.

name: clippy-fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The manifest IS the source of truth -- see the header comment above.
  # `cargo metadata` (full resolve, not --no-deps: this job needs the
  # actual dependency graph, not just the member list) never touches the
  # network beyond the registry index needed to resolve Cargo.lock --
  # `--locked` makes that failure loud (a stale lockfile errors) rather
  # than silently re-resolving. Still metadata-only, same class as
  # `cargo tree`, not a build.
  discover:
    name: discover crate tiers from the dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deps: ${{ steps.list.outputs.deps }}
      roots: ${{ steps.list.outputs.roots }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute deps/roots tiers from the resolved dependency graph
        id: list
        shell: bash
        run: |
          set -euo pipefail

          result=$(python3 - <<'PYEOF'
          import json, subprocess, sys

          # The one deliberate parameter in this whole file: today just
          # larql-cli. A future entry point (larql-server, larql-python,
          # or any other binary/library subtree that needs its own
          # wasm32v1-none gating pass) is a one-line addition here, not a
          # workflow redesign -- see the header comment above.
          ROOTS = ["larql-cli"]
          EXCLUDE = {"larql-compute-metal"}

          raw = subprocess.run(
              ["cargo", "metadata", "--format-version", "1", "--locked"],
              capture_output=True, text=True, check=True,
          ).stdout
          d = json.loads(raw)

          id_to_name = {p["id"]: p["name"] for p in d["packages"]}
          name_to_id = {v: k for k, v in id_to_name.items()}
          ws_members = set(d["workspace_members"])
          nodes = {n["id"]: n for n in d["resolve"]["nodes"]}

          missing_roots = [r for r in ROOTS if r not in name_to_id or name_to_id[r] not in ws_members]
          if missing_roots:
              print(f"::error::ROOTS names not found among workspace members: {missing_roots}", file=sys.stderr)
              sys.exit(1)

          def transitive_workspace_deps(root_id):
              seen = set()
              stack = [root_id]
              while stack:
                  cur = stack.pop()
                  if cur in seen:
                      continue
                  seen.add(cur)
                  for dep in nodes[cur]["deps"]:
                      dep_id = dep["pkg"]
                      if dep_id in ws_members:
                          stack.append(dep_id)
              return seen

          root_ids = {name_to_id[r] for r in ROOTS}
          closure = set()
          for rid in root_ids:
              closure |= transitive_workspace_deps(rid)

          deps = sorted(id_to_name[i] for i in closure if i not in root_ids and id_to_name[i] not in EXCLUDE)
          roots = sorted(id_to_name[i] for i in root_ids if id_to_name[i] not in EXCLUDE)

          # Fail loudly, not silently, on either coming back empty -- an
          # empty list here must never be mistaken for "nothing to check"
          # (that would silently disable this workflow the same way an
          # earlier diff-based design silently missed already-red
          # crates).
          if not deps:
              print("::error::Computed an empty dependency-tier crate list", file=sys.stderr)
              sys.exit(1)
          if not roots:
              print("::error::Computed an empty root-tier crate list", file=sys.stderr)
              sys.exit(1)

          print(json.dumps({"deps": deps, "roots": roots}))
          PYEOF
          )

          deps=$(echo "$result" | jq -c '.deps')
          roots=$(echo "$result" | jq -c '.roots')
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
          echo "::notice::deps tier: $deps"
          echo "::notice::roots tier: $roots"

  # Unlike every other branch-scoped workflow in this repo (larql-lql.yml
  # and 15 siblings -- see scripts/verify_gating_skip.py), no job below
  # skips on `github.head_ref == 'gating/larql-cli-wasm-and-safe'`. That
  # guard exists elsewhere to avoid double-running CI already covered by
  # larql-cli-gating.yml within that branch's PR; this workflow is the
  # opposite case -- it exists specifically to run during that campaign,
  # so adding the guard here would silently disable the tool on the one
  # branch it was built for. Deliberate omission, not an oversight.
  fix:
    name: fix / ${{ matrix.crate }} / ${{ matrix.target }} / ${{ matrix.features }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.deps) }}
        target: [wasm32v1-none]
        features: [default, no-default-features]
    env:
      CRATE: ${{ matrix.crate }}
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      # No OpenBLAS install: this campaign's targets (wasm32v1-none so
      # far) never link a host BLAS -- every such dependency in this
      # workspace is gated behind cfg(target_os = "linux"/"macos"/
      # "windows"), and a bare-metal target's target_os is "none". A
      # future target that DOES need host tooling installed here is a
      # workflow edit, not a matrix-only change -- add the install step
      # then, conditioned on `matrix.target` if it's only needed for some
      # targets.
      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fix-${{ matrix.crate }}-${{ matrix.target }}-

      # The actual gate this section exists for: --fix only runs when
      # there's something to fix. `continue-on-error` + reading
      # `steps.check.outcome` (NOT `.conclusion`, which continue-on-error
      # would force to 'success') is how a step's real pass/fail survives
      # to control a later step's `if:` without killing the job.
      - name: cargo clippy (check only, no --fix) -- gates whether a fix pass runs at all
        id: check
        continue-on-error: true
        shell: bash
        run: |
          if [ "$FEATURES" = "no-default-features" ]; then
            cargo clippy --target "$TARGET" -p "$CRATE" --no-default-features -- -D warnings
          else
            cargo clippy --target "$TARGET" -p "$CRATE" -- -D warnings
          fi

      # Never fails the job -- whatever --fix manages (fully, partially,
      # or not at all) still produces a diff worth capturing below. A
      # fresh checkout is always clean, so --allow-dirty is deliberately
      # NOT passed: if this step ever complains the tree is dirty, that's
      # a real anomaly worth seeing, not something to suppress.
      - name: cargo clippy --fix --target ${{ matrix.target }}
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$FEATURES" = "no-default-features" ]; then
            cargo clippy --fix --target "$TARGET" -p "$CRATE" --no-default-features -- -D warnings
          else
            cargo clippy --fix --target "$TARGET" -p "$CRATE" -- -D warnings
          fi

      # --fix's machine-applied edits aren't guaranteed rustfmt-clean, and
      # verify-native's first gate is `cargo fmt --check` -- format here so
      # a purely cosmetic drift never turns an otherwise-safe patch red and
      # muddies the one signal this workflow exists to give cleanly. Same
      # gate as --fix above: nothing to format when there was nothing to
      # fix.
      - name: cargo fmt (make --fix's output rustfmt-clean before capturing it)
        if: steps.check.outcome == 'failure'
        run: cargo fmt -p "$CRATE"

      # Unconditional and always safe: when the check above passed clean,
      # --fix never touched the tree, so this naturally captures an empty
      # patch -- the same "nothing to verify" state verify-native already
      # handles for a --fix that ran but found nothing to change.
      - name: Capture the diff, whatever --fix (+ fmt) produced (or didn't)
        run: git diff -- crates/ > clippy-fix.patch

      # Informational only: whatever's left after --fix is exactly the
      # set of findings that need a human/agent judgment call (gate vs.
      # genuinely-dead-with-evidence), not something this job decides.
      # Only meaningful when the check step found something to begin with.
      - name: Re-check for remaining, non-auto-fixable findings
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$FEATURES" = "no-default-features" ]; then
            cargo clippy --target "$TARGET" -p "$CRATE" --no-default-features -- -D warnings 2>&1 | tee clippy-remaining.log
          else
            cargo clippy --target "$TARGET" -p "$CRATE" -- -D warnings 2>&1 | tee clippy-remaining.log
          fi

      # The mirror image of the step above: when check passed clean, this
      # is the only source of clippy-remaining.log, which
      # actions/upload-artifact below requires to exist either way.
      - name: Record a clean result when there was nothing to fix
        if: steps.check.outcome == 'success'
        run: echo "cargo clippy reported no findings for $CRATE ($TARGET, $FEATURES) -- nothing to fix." > clippy-remaining.log

      - name: Upload the proposed patch + remaining-findings log
        uses: actions/upload-artifact@v7
        with:
          name: clippy-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.features }}
          path: |
            clippy-fix.patch
            clippy-remaining.log
          retention-days: 14
          if-no-files-found: error

  # The actual gate for the deps tier. Applies fix's proposed patch on a
  # fresh checkout and runs the same native oracle used everywhere else in
  # this campaign (cargo check --all-targets, clippy --no-deps -D
  # warnings, cargo test) -- no wasm32 target anywhere in this job. Green
  # here is what makes the patch safe to download and apply for real; red
  # here means the patch stays an artifact, not a commit.
  verify-native:
    name: verify-native / ${{ matrix.crate }} / ${{ matrix.target }} / ${{ matrix.features }}
    # Both discover and fix, not just fix: needs.<job>.outputs is only
    # readable for jobs listed directly in this job's own needs: array,
    # even though fix already (transitively) depends on discover itself.
    # Matrix pulls from the SAME discover output fix used -- one source,
    # not a second hand-copied list that could silently drift out of sync
    # with fix's.
    needs: [discover, fix]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.deps) }}
        target: [wasm32v1-none]
        features: [default, no-default-features]
    env:
      CRATE: ${{ matrix.crate }}
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Single named-artifact download extracts flat to the working
      # directory by default on v8 too (same as v4) -- confirmed against
      # actions/download-artifact's own docs before bumping this version;
      # git apply below relies on that.
      - uses: actions/download-artifact@v8
        with:
          name: clippy-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.features }}

      - name: Nothing to verify if --fix produced no changes
        shell: bash
        run: |
          if [ ! -s clippy-fix.patch ]; then
            echo "::notice::--fix produced an empty patch for $CRATE ($TARGET, $FEATURES) -- nothing to verify. Check clippy-remaining.log in the fix job's artifact for what's still unresolved."
            exit 0
          fi
          echo "HAS_PATCH=1" >> "$GITHUB_ENV"

      - name: Apply the proposed patch
        if: env.HAS_PATCH == '1'
        run: |
          git apply --check clippy-fix.patch
          git apply clippy-fix.patch

      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_PATCH == '1'
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS (Linux)
        if: env.HAS_PATCH == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Cache cargo registry + build artefacts
        if: env.HAS_PATCH == '1'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-verify-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-verify-${{ matrix.crate }}-

      - name: Format check
        if: env.HAS_PATCH == '1'
        run: cargo fmt -p "$CRATE" -- --check

      - name: Check all targets (native)
        if: env.HAS_PATCH == '1'
        run: cargo check -p "$CRATE" --all-targets

      # --no-deps keeps lints scoped to the crate itself, matching the
      # per-crate native workflows' own clippy step (e.g. larql-kv.yml) --
      # otherwise pre-existing debt in a transitive dependency would
      # surface here even though it's unrelated to this patch.
      - name: Clippy (native, --no-deps)
        if: env.HAS_PATCH == '1'
        run: cargo clippy -p "$CRATE" --all-targets --no-deps -- -D warnings

      - name: Tests (native)
        if: env.HAS_PATCH == '1'
        run: cargo test -p "$CRATE"

  # Root tier: identical steps to `fix` above (see the header comment for
  # why this is duplicated rather than factored out), matrixed over
  # `roots` instead of `deps`, and gated on the deps tier's
  # verify-native completing first -- see the header comment's "known
  # gap" note for what this ordering does and doesn't guarantee.
  fix-root:
    name: fix-root / ${{ matrix.crate }} / ${{ matrix.target }} / ${{ matrix.features }}
    needs: [discover, verify-native]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.roots) }}
        target: [wasm32v1-none]
        features: [default, no-default-features]
    env:
      CRATE: ${{ matrix.crate }}
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fix-${{ matrix.crate }}-${{ matrix.target }}-

      - name: cargo clippy (check only, no --fix) -- gates whether a fix pass runs at all
        id: check
        continue-on-error: true
        shell: bash
        run: |
          if [ "$FEATURES" = "no-default-features" ]; then
            cargo clippy --target "$TARGET" -p "$CRATE" --no-default-features -- -D warnings
          else
            cargo clippy --target "$TARGET" -p "$CRATE" -- -D warnings
          fi

      - name: cargo clippy --fix --target ${{ matrix.target }}
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$FEATURES" = "no-default-features" ]; then
            cargo clippy --fix --target "$TARGET" -p "$CRATE" --no-default-features -- -D warnings
          else
            cargo clippy --fix --target "$TARGET" -p "$CRATE" -- -D warnings
          fi

      - name: cargo fmt (make --fix's output rustfmt-clean before capturing it)
        if: steps.check.outcome == 'failure'
        run: cargo fmt -p "$CRATE"

      - name: Capture the diff, whatever --fix (+ fmt) produced (or didn't)
        run: git diff -- crates/ > clippy-fix.patch

      - name: Re-check for remaining, non-auto-fixable findings
        if: steps.check.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$FEATURES" = "no-default-features" ]; then
            cargo clippy --target "$TARGET" -p "$CRATE" --no-default-features -- -D warnings 2>&1 | tee clippy-remaining.log
          else
            cargo clippy --target "$TARGET" -p "$CRATE" -- -D warnings 2>&1 | tee clippy-remaining.log
          fi

      - name: Record a clean result when there was nothing to fix
        if: steps.check.outcome == 'success'
        run: echo "cargo clippy reported no findings for $CRATE ($TARGET, $FEATURES) -- nothing to fix." > clippy-remaining.log

      - name: Upload the proposed patch + remaining-findings log
        uses: actions/upload-artifact@v7
        with:
          name: clippy-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.features }}
          path: |
            clippy-fix.patch
            clippy-remaining.log
          retention-days: 14
          if-no-files-found: error

  verify-native-root:
    name: verify-native-root / ${{ matrix.crate }} / ${{ matrix.target }} / ${{ matrix.features }}
    needs: [discover, fix-root]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.roots) }}
        target: [wasm32v1-none]
        features: [default, no-default-features]
    env:
      CRATE: ${{ matrix.crate }}
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: clippy-fix-${{ matrix.crate }}-${{ matrix.target }}-${{ matrix.features }}

      - name: Nothing to verify if --fix produced no changes
        shell: bash
        run: |
          if [ ! -s clippy-fix.patch ]; then
            echo "::notice::--fix produced an empty patch for $CRATE ($TARGET, $FEATURES) -- nothing to verify. Check clippy-remaining.log in the fix-root job's artifact for what's still unresolved."
            exit 0
          fi
          echo "HAS_PATCH=1" >> "$GITHUB_ENV"

      - name: Apply the proposed patch
        if: env.HAS_PATCH == '1'
        run: |
          git apply --check clippy-fix.patch
          git apply clippy-fix.patch

      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_PATCH == '1'
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS (Linux)
        if: env.HAS_PATCH == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Cache cargo registry + build artefacts
        if: env.HAS_PATCH == '1'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-native-verify-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-verify-${{ matrix.crate }}-

      - name: Format check
        if: env.HAS_PATCH == '1'
        run: cargo fmt -p "$CRATE" -- --check

      - name: Check all targets (native)
        if: env.HAS_PATCH == '1'
        run: cargo check -p "$CRATE" --all-targets

      - name: Clippy (native, --no-deps)
        if: env.HAS_PATCH == '1'
        run: cargo clippy -p "$CRATE" --all-targets --no-deps -- -D warnings

      - name: Tests (native)
        if: env.HAS_PATCH == '1'
        run: cargo test -p "$CRATE"
