# Per-target automated fix pipeline for larql-cli (proof of concept).
#
# Deliverable is the raw data itself, per target: what compiles, what
# `cargo clippy --fix` changes on its own (no human judgment), and what's
# still flagged after that (the residual -- exactly the set of concerns
# that needs a real decision, which is where splitting target-specific
# code into cleanly separated modules actually starts). This workflow
# does not classify, summarize, or render any of that.
#
# `cargo tree`/`check`/`fix`/residual `clippy` all print straight to the
# step's own stdout/stderr -- no `tee`-to-a-file. GitHub Actions already
# captures every step's full output verbatim (confirmed directly: pulling
# a job's raw log via the API showed complete -vv output, file:line
# included), so teeing the same content into a tracked-tree file was
# pure indirection -- and it's what caused `cargo fix` to see a dirty
# working directory and refuse to run, twice, before this was found. The
# job log is the raw data for those four; `fix.patch` (the one thing
# that doesn't already exist in any command's stdout -- a clean,
# directly `git apply`-able diff, versus the log merely showing that
# files changed) is the only uploaded artifact. Reading and acting on
# any of this happens outside the workflow.
#
# No hand-edited `#[cfg(...)]` blocks anywhere in this pipeline, and the
# workflow never writes to a source file itself -- every change to the
# tree comes from `cargo clippy --fix`, captured as `fix.patch`, not
# applied or committed here.
#
# Deliberately not answered here: whether cfg-selected code is *correct*
# on a given target (endianness, BLAS numerics, GPU hardware presence).
# That needs real tests, not this pipeline.
#
# `cargo check`/`clippy` don't link, but a dependency's build script
# (`ring`, a real dependency via larql-vindex's rustls-tls reqwest
# usage) can still shell out to a C compiler during `cargo check`
# itself. Where a real, standard, already-confirmed-available compiler
# package exists for a target (e.g. `gcc-aarch64-linux-gnu` on
# ubuntu-latest), it's installed -- not installing it wouldn't test
# larql-cli's code, it would just test this workflow's own refusal to
# run one apt-get command, which is uninformative in exactly the way a
# CI-configuration error is. Where no such package/cross-rs image/
# native runner exists anywhere (sparcv9-sun-solaris did not, on any
# GitHub-hosted runner -- confirmed by repeated real runs, not
# assumed), the target is omitted from the matrix entirely rather than
# kept as a permanently, unfixably red row.
#
# `features` is a third matrix axis (`with-gpu` / `without-gpu`), not
# just `--all-features` everywhere: larql-cli's only optional feature
# is `gpu`, and it's already `default = ["gpu"]` -- so `--all-features`
# and default-features are identical here, and neither one, alone,
# probes what changes when `gpu` is off. chrishayuk/larql#169
# documents real, different error counts under `--no-default-features`
# (mostly `large_enum_variant`/`dead_code` on metal-only paths) --
# feature-conditional reachability is one of the two axes (alongside
# target) this whole project cares about, so it gets its own tier
# rather than being collapsed into a single always-on choice.
#
# `--examples` is added to every cargo invocation below for the same
# reason `--tests` already was: it's real, uninspected compilable
# surface, not a hypothetical one. #169 itself names a concrete,
# already-known instance -- `convert_moe_to_per_layer` "excluded from
# CI due to an API break, which hides its clippy errors" -- so this
# isn't speculative scope, it's a disclosed gap with a known example
# behind it. No `--benches`: larql-cli has no bench targets to select.
#
# `--workspace` replaces `-p larql-cli` in steps B and C (not A, where
# `-p larql-cli` already transitively compiles every workspace
# sibling as a dependency, so a hard compile error there already
# surfaces): `--no-deps` scopes clippy's LINTING to workspace members
# only, but `-p larql-cli` was scoping it further, to larql-cli alone
# -- a genuinely target-specific correctness lint living in
# `larql-vindex` or `larql-compute` was invisible as a *lint* finding
# even though a hard error in the same code would not have been. This
# expansion is only sound now because the `#314` workspace-membership
# trim already happened -- before that fix, `--workspace` would have
# reintroduced exactly the feature-unification contamination `#314`
# removed (larql-server/larql-python/etc. polluting the build). `A.`
# also now checks `--workspace`, for the same reason: a sibling
# crate's own standalone tests/examples (not part of larql-cli's
# dependency chain, e.g. larql-vindex's own `#[cfg(test)]` code) were
# never reached by `-p larql-cli` at all, `--workspace` closes that.
#
# No job in this workflow is a required check; every probe step uses
# `continue-on-error: true` so a failure on one step (or one target)
# never prevents the remaining steps/targets from still running and
# still producing their own raw data.
#
# Lint policy is "allow nothing": every lint clippy ships allow-by-default
# (`clippy::cargo`, `clippy::nursery`, `clippy::pedantic`, plus rustc's own
# allow-by-default lints) is promoted to at least `warn` via explicit `-W`,
# so the probe's diagnostic surface isn't silently narrowed by defaults.
# `clippy::restriction` is excluded from every lint_scope tier below:
# it contains multiple lint pairs that demand literally opposite things
# for the same construct, verified directly against the actual installed
# clippy (0.1.98, matching this workflow's rustc 1.98.0) rather than
# assumed:
#   - `pub_with_shorthand` / `pub_without_shorthand` -- one disallows
#     `pub(loc)`, the other disallows `pub(in loc)`.
#   - `semicolon_inside_block` / `semicolon_outside_block` -- one wants
#     `unsafe { foo(); }`, the other wants `unsafe { foo() };`.
#   - `separated_literal_suffix` / `unseparated_literal_suffix` -- one
#     flags `1_u32` (wants `1u32`), the other flags `1u32` (wants
#     `1_u32`).
#   - `mod_module_files` / `self_named_module_files` -- clippy's own
#     source (`module_style.rs`) states one *forbids* `mod.rs`
#     entirely, the other *requires* it; designed as alternative
#     policies, not a joint one.
#   - `implicit_return` / `needless_return` -- opposite requirements
#     for a function's final expression, and the more consequential
#     pair of the five: `needless_return` is warn-by-default (part of
#     `clippy::all`, already active in every tier below), so enabling
#     `clippy::restriction` wouldn't just add a second opt-in
#     conflicting lint, it would collide with something already on.
# Enabling the group wholesale is unsatisfiable under `-D warnings` for
# any of these constructs, not just noisy.
#
# `-vv` and `RUST_BACKTRACE=full` are set throughout: a compile failure
# here is often a dependency's build script (e.g. `ring`, via rustls)
# unable to find a C compiler for the target, not a code-level error, and
# the difference is only visible with build-script output unabbreviated.
# `cargo tree --target <T>` is captured per target because the dependency
# graph itself is target-conditioned (`[target.'cfg(...)'.dependencies]`)
# -- the same crate can pull in a different, or no, C dependency
# depending on the target, and that's part of the raw data too.
#
# `os` per target is just whichever GitHub-hosted runner is closest to
# native for that target family (ubuntu for linux, macos for darwin,
# windows for windows) -- not a claim that the target is "supported" on
# that runner, only where `rustup target add` and a plain `cargo check`
# get attempted.
#
# `lint_scope` x `broken_code` is a second, orthogonal matrix axis,
# crossed with every target, so the same code can be compared across
# fix strategies rather than just across targets. The three
# `lint_scope` tiers are cumulative subsets of clippy's own default
# lint groups (`functional` subset `perf` subset `allow-nothing`):
#   - `functional`: clippy::correctness (deny by default) +
#     clippy::suspicious (warn by default) only -- lints that flag
#     code that is already wrong, not code that merely could be
#     written differently.
#   - `perf`: functional, plus clippy::perf -- still behavior-
#     preserving by definition, but its suggested rewrites are often
#     API substitutions (e.g. build a Vec via `with_capacity` instead
#     of `push`-in-a-loop), carrying the same kind of mechanical-fix
#     risk as style lints rather than correctness lints, hence its own
#     tier instead of being folded into `functional`.
#   - `allow-nothing`: the existing, unchanged full policy (every
#     allow-by-default group except `clippy::restriction`).
# The reason to separate these: every "clippy --fix produced code that
# doesn't compile" case found so far traced to a pedantic/nursery-tier
# suggestion (`chunks_exact_to_as_chunks`, `missing_const_for_fn` +
# `cast_lossless` combining unsafely, an incomplete `wildcard_imports`
# rewrite) -- never to a correctness or suspicious lint. Mixing style-
# lint auto-fixes into the "residual" signal conflates two different
# findings ("there's a real unfixed bug" vs. "clippy broke the build
# trying to rename a cast") into one number. `broken_code` isolates a
# second, independent question per tier: does allowing `--fix` to
# apply changes that might not compile actually change the outcome at
# this lint scope, or only at the wider ones?
#
# Triggered on `pull_request`, path-scoped to this file, not
# `workflow_dispatch`: a newly-added workflow can't be dispatched via
# the API/UI until it exists on the repo's default branch, and this
# branch is never getting merged there. Path-scoping to the file
# itself means pushing a change to this workflow is what re-runs it --
# not every unrelated commit on the branch. Not a required gate.
#
# --- Tier 2 (with Host Tools) extension ---
#
# Scope is every target on doc.rust-lang.org/nightly/rustc/platform-
# support.html's "Tier 2 with Host Tools" table (28 targets there, not
# the 29 the page's own prose claims -- same discrepancy, and the same
# "use what's actually named" resolution, as deny.toml's Tier 1 + Tier 2
# cargo-deny expansion on the companion fix/target-matrix-decidability-
# findings branch). cargo-deny only needs the dependency graph, so all
# 28 went in there. This workflow needs a real per-target C toolchain at
# build-script time (see the `ring`/aarch64 finding above), so each of
# the 28 was checked against what's actually installable on a
# GitHub-hosted runner -- via packages.ubuntu.com/noble and
# ports.ubuntu.com's real per-architecture repo listings, not assumed --
# before being added.
#
# Included (8), all via a real, standard, confirmed-available package:
#   - arm-unknown-linux-gnueabihf, armv7-unknown-linux-gnueabihf,
#     powerpc64le-unknown-linux-gnu, riscv64gc-unknown-linux-gnu,
#     s390x-unknown-linux-gnu: same mechanism as the existing
#     aarch64-unknown-linux-gnu row (cross gcc/g++ package + a
#     ports.ubuntu.com libssl-dev multiarch repo), generalized via
#     matrix.gcc_pkg/deb_arch/multiarch_triplet instead of duplicated
#     five more times. `arm-unknown-linux-gnueabihf` and
#     `armv7-unknown-linux-gnueabihf` share Debian's one armhf port and
#     its one gcc-arm-linux-gnueabihf cross package -- Debian doesn't
#     ship two separate ARM hard-float cross toolchains, and a
#     build-script's C compilation doesn't need rustc's own
#     target-feature distinction between the two.
#   - x86_64-unknown-linux-musl: `musl-tools` provides a *native*
#     musl-gcc (the runner itself is x86_64) -- no cross *C compiler*
#     at all, unlike every other target here. A real first run (job
#     98074714304) found a second, separate requirement missed in this
#     paragraph originally: openssl-sys needs libssl-dev/pkg-config,
#     which ubuntu-latest doesn't ship by default, plus
#     PKG_CONFIG_ALLOW_CROSS for the target-triple probe (pkg-config-rs
#     treats musl vs. gnu as cross-compilation by triple string alone,
#     same guard the arm64 step below already clears) -- see that
#     step's own comment.
#   - i686-pc-windows-gnu: cross-compiled on ubuntu-latest via
#     `gcc-mingw-w64-i686`/`g++-mingw-w64-i686`, the same "closest real
#     toolchain available, not a native runner" pattern already used for
#     aarch64-unknown-linux-gnu.
#   - x86_64-apple-darwin: runs on the same macos-latest (arm64
#     hardware) image as aarch64-apple-darwin. Xcode's clang is already
#     a universal (multi-arch) compiler, so no extra package is needed
#     -- identical to why aarch64-apple-darwin's own row installs
#     nothing beyond the base image.
#
# Excluded (20), each for a real, checked reason, not "not implemented
# yet":
#   - arm-unknown-linux-gnueabi, powerpc-unknown-linux-gnu,
#     powerpc64-unknown-linux-gnu (big-endian), loongarch64-unknown-
#     linux-gnu: a cross gcc/g++ package exists for every one of these,
#     but ports.ubuntu.com carries no `noble` repo for armel, powerpc,
#     ppc64 (big-endian), or loong64 (confirmed: HTTP 404 on
#     ports.ubuntu.com/ubuntu-ports/dists/noble/main/binary-<arch>/
#     Packages.gz for each) -- so libssl-dev:<arch> is not installable
#     by any standard mechanism, the same class of gap as the arm64 one
#     the existing aarch64-unknown-linux-gnu row had to solve, just with
#     no solution available.
#   - aarch64-unknown-linux-musl, loongarch64-unknown-linux-musl,
#     powerpc64-unknown-linux-musl, powerpc64le-unknown-linux-musl,
#     riscv64gc-unknown-linux-musl: `musl-tools` ships only a native
#     (x86_64) musl-gcc; Ubuntu carries no cross-musl-gcc package for
#     any other architecture.
#   - aarch64-unknown-linux-ohos, armv7-unknown-linux-ohos,
#     x86_64-unknown-linux-ohos: OpenHarmony targets need the OHOS
#     SDK/NDK, which isn't an apt or choco package.
#   - aarch64-pc-windows-gnullvm, x86_64-pc-windows-gnullvm: need
#     llvm-mingw, which (unlike gcc-mingw-w64-i686/x86_64) isn't a
#     standard apt or choco package.
#   - aarch64-unknown-freebsd, x86_64-unknown-freebsd,
#     x86_64-unknown-netbsd, x86_64-unknown-illumos, x86_64-pc-solaris,
#     sparcv9-sun-solaris: no GitHub-hosted native runner and no
#     standard cross toolchain package for any of them --
#     sparcv9-sun-solaris was already excluded from the original PR's
#     4-target scope for exactly this reason, before this Tier 2 pass
#     added the other five.

name: target-matrix-decidability

on:
  pull_request:
    paths:
      - '.github/workflows/target-matrix-decidability.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.target }}, ${{ matrix.features }}, ${{ matrix.lint_scope }}, broken_code=${{ matrix.broken_code }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: full
    defaults:
      run:
        # windows-latest's default `run:` shell is pwsh, not bash -- the
        # `2>&1 | tee ...` steps below are bash syntax (no `tee` on pwsh
        # by default, different redirection semantics). Forcing bash
        # here keeps every step identical across all three runner OSes.
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabihf
          - powerpc64le-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-pc-windows-gnu
          - x86_64-apple-darwin
        lint_scope: [functional, perf, allow-nothing]
        broken_code: [true, false]
        features: [with-gpu, without-gpu]
        include:
          # Merged into every combination matching `target`, regardless
          # of lint_scope/broken_code -- standard GitHub Actions matrix
          # semantics for a partial-key include entry, not a custom
          # mechanism.
          # Tier 1
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            gcc_pkg: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            deb_arch: arm64
            multiarch_triplet: aarch64-linux-gnu

          # Tier 2 (with Host Tools) -- see the header comment for what
          # was excluded and why.
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            gcc_pkg: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            deb_arch: armhf
            multiarch_triplet: arm-linux-gnueabihf
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            gcc_pkg: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            deb_arch: armhf
            multiarch_triplet: arm-linux-gnueabihf
          - target: powerpc64le-unknown-linux-gnu
            os: ubuntu-latest
            gcc_pkg: gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu
            deb_arch: ppc64el
            multiarch_triplet: powerpc64le-linux-gnu
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            gcc_pkg: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            deb_arch: riscv64
            multiarch_triplet: riscv64-linux-gnu
          - target: s390x-unknown-linux-gnu
            os: ubuntu-latest
            gcc_pkg: gcc-s390x-linux-gnu g++-s390x-linux-gnu
            deb_arch: s390x
            multiarch_triplet: s390x-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: i686-pc-windows-gnu
            os: ubuntu-latest
            gcc_pkg: gcc-mingw-w64-i686 g++-mingw-w64-i686
          - target: x86_64-apple-darwin
            os: macos-latest

          # Merged into every combination matching `lint_scope`,
          # regardless of target/broken_code, by the same mechanism.
          - lint_scope: functional
            lint_flags: '-A clippy::style -A clippy::complexity -A clippy::perf'
          - lint_scope: perf
            lint_flags: '-A clippy::style -A clippy::complexity'
          - lint_scope: allow-nothing
            lint_flags: '-W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo'
          # Merged into every combination matching `features`,
          # regardless of target/lint_scope/broken_code.
          - features: with-gpu
            feature_flags: '--all-features'
          - features: without-gpu
            feature_flags: '--no-default-features'

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # This is the general fix for the whole class of bug, not a
      # patch for one instance of it: `dtolnay/rust-toolchain`'s own
      # `targets:` input always installs into a toolchain slot named
      # after its own `toolchain:`/`@ref` value (e.g. "stable-<host>"),
      # independent of whatever toolchain a repo's own override (a
      # rust-toolchain.toml, or any future mechanism) actually selects
      # as ACTIVE -- confirmed against a real run's raw job log, where
      # the target landed in "stable-<host>" while "1.98.0-<host>" was
      # the toolchain actually in use, so cargo/rustc never saw it.
      # `rustup target add` with no --toolchain flag always resolves
      # and targets whichever toolchain is ACTUALLY active (respecting
      # any override, present or future, whatever it's named) --
      # confirmed by direct reproduction. No continue-on-error: if this
      # fails, it's a genuine toolchain/workspace misconfiguration, not
      # a compilability finding about the target, and it must fail
      # loudly and distinctly from the probe steps below rather than
      # silently produce misleading "does not compile" data (exactly
      # what happened before this was found: E0463 "can't find crate
      # for core" looked like a real compile failure and was actually
      # this).
      - name: Add target to the ACTUALLY active toolchain
        run: rustup target add ${{ matrix.target }}

      # `ring` (a real dependency of larql-cli's tree, via larql-vindex's
      # rustls-tls reqwest usage) needs a C compiler for whatever target
      # it's built for. Installing a real, standard, already-confirmed
      # cross-gcc package where one exists isn't "unnecessary
      # infrastructure" -- it's the difference between testing
      # larql-cli's actual code on this target versus testing nothing
      # but this workflow's own choice not to run one apt-get command.
      # Parameterized on matrix.gcc_pkg (one apt package list per
      # target family) instead of one `if: matrix.target == '...'` step
      # per target: it's the identical operation for every Linux-cross
      # and mingw-cross row here, confirmed package-by-package against
      # packages.ubuntu.com/noble (see the header comment), not guessed.
      # `gcc-aarch64-linux-gnu` was the first of these, confirmed
      # installable on the real ubuntu-latest image (verified directly
      # via probe-runner-packages.yml's `apt-get install --dry-run`, not
      # assumed). No equivalent package/cross-rs image/native runner
      # exists anywhere for sparcv9-sun-solaris -- that target's
      # compile failure stays real, unfixable information, not
      # something to route around, which is why it (and the other 19
      # excluded Tier 2 targets) has no matrix row at all rather than a
      # `gcc_pkg` that would fail to install.
      - name: Install cross gcc/g++ (real, standard, confirmed-available)
        # No CARGO_TARGET_*_LINKER needed: `cargo check`/`clippy` never
        # reach the linking stage. Only a dependency's build script (via
        # cc-rs, at build-script-execution time, which runs regardless
        # of check vs. build) needs the compiler binary on PATH -- and
        # the error messages already named the exact binaries these
        # packages provide: `ring` needed "aarch64-linux-gnu-gcc"
        # (this step's original scope); confirmed via a real run,
        # `esaxx-rs`'s C++ build needs "aarch64-linux-gnu-g++" too --
        # a distinct package (g++-aarch64-linux-gnu), not covered by
        # the C one.
        if: matrix.gcc_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.gcc_pkg }}

      # x86_64-unknown-linux-musl needs no cross *C compiler* at all --
      # the runner itself is x86_64, so `musl-tools`' *native* musl-gcc
      # is the whole gcc-side requirement. Ubuntu ships no cross-musl-
      # gcc for any other architecture, which is exactly why every other
      # Tier 2 musl target (aarch64/loongarch64/powerpc64/powerpc64le/
      # riscv64gc-unknown-linux-musl) has no matrix row.
      - name: Install musl-tools (native musl-gcc, no cross toolchain needed)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # A second, genuinely separate requirement, found from a real run's
      # own log (job 98074714304, x86_64-unknown-linux-musl): openssl-sys
      # failed with "Could not find directory of OpenSSL installation" on
      # BOTH the host triple and the musl target triple in the same job
      # -- ubuntu-latest doesn't ship libssl-dev/pkg-config by default at
      # all (the x86_64-unknown-linux-gnu row never hits this because
      # larql-cli's own dependency tree only pulls openssl-sys in on
      # `cfg(target_env = "musl")`, not on gnu, where rustls-tls is used
      # instead -- confirmed by this being the only target where the
      # failure appears). Installing libssl-dev/pkg-config alone isn't
      # enough for the second (target-triple) failure, though: the
      # `pkg-config` crate refuses a cross probe -- and treats
      # HOST=x86_64-unknown-linux-gnu vs. TARGET=x86_64-unknown-linux-musl
      # as cross-compilation purely by triple-string mismatch, regardless
      # of the identical CPU architecture -- unless PKG_CONFIG_ALLOW_CROSS
      # is set, the same guard the arm64 step below already has to clear.
      # Pointed at the native /usr/lib/x86_64-linux-gnu/pkgconfig, not a
      # musl-built one: there is no musl-built libssl.pc anywhere on this
      # runner (see the musl-gcc note above -- Ubuntu ships no musl cross
      # toolchain for anything, including its own host arch's libssl),
      # and `cargo check`/`clippy` never reach the link stage, so the
      # glibc build's headers/version metadata are sufficient for what
      # this probe actually exercises, same reasoning as the "no
      # CARGO_TARGET_*_LINKER needed" note above.
      - name: Install libssl-dev + pkg-config for musl (native x86_64, cross pkg-config probe)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH_x86_64_unknown_linux_musl=/usr/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      # A deeper, genuinely different layer of the same category,
      # confirmed via a real run once ring's blocker was cleared:
      # openssl-sys (reqwest's Linux native-tls path) needs a real
      # OpenSSL for the target, discoverable via cross pkg-config.
      # `libssl-dev:<arch>` + Debian/Ubuntu multiarch is the standard OS
      # mechanism for this, not bespoke infrastructure. Parameterized on
      # matrix.deb_arch/multiarch_triplet for the same reason as the gcc
      # step above: identical mechanism, five real architectures
      # (confirmed each has a ports.ubuntu.com/noble repo -- arm64,
      # armhf, ppc64el, riscv64, s390x -- unlike armel/powerpc/ppc64
      # (big-endian)/loong64, which don't, and are excluded for exactly
      # that reason).
      - name: Install libssl-dev for ${{ matrix.deb_arch }} (real, standard, multiarch)
        # First attempt failed with real evidence, not a guess:
        # `dpkg --add-architecture arm64` alone isn't enough on
        # ubuntu-latest -- its default sources only have
        # archive.ubuntu.com/security.ubuntu.com, which are amd64-only.
        # arm64 packages live on the separate ports.ubuntu.com mirror
        # (standard, well-documented Ubuntu infrastructure, not
        # anything specific to this workflow).
        #
        # Second attempt also failed with real evidence: restricting
        # the legacy /etc/apt/sources.list to [arch=amd64] didn't stop
        # apt querying security.ubuntu.com for arm64. ubuntu-latest is
        # 24.04 ("noble"), which ships its default sources in the
        # newer DEB822 format at /etc/apt/sources.list.d/ubuntu.sources
        # instead -- the legacy file is unused there. ubuntu.sources
        # has separate stanzas (archive mirror for main/updates/
        # backports, a distinct one for security.ubuntu.com); each
        # needs its own `Architectures: amd64` field, the standard
        # DEB822 way to scope a source, added after every `Types: deb`
        # line.
        if: matrix.deb_arch != ''
        run: |
          sudo sed -i -E 's/^deb(-src)? http/deb\1 [arch=amd64] http/' /etc/apt/sources.list
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          echo "=== sources.list ==="; cat /etc/apt/sources.list
          echo "=== ubuntu.sources (post-edit, if present) ==="; cat /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || echo "(absent)"
          echo "deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe restricted multiverse
          deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main universe restricted multiverse
          deb [arch=${{ matrix.deb_arch }}] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main universe restricted multiverse" \
            | sudo tee /etc/apt/sources.list.d/${{ matrix.deb_arch }}-ports.list
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y libssl-dev:${{ matrix.deb_arch }} pkg-config
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          # Real evidence, not a guess: an unscoped PKG_CONFIG_PATH also
          # leaked into openblas-src's build script (which compiles for
          # the HOST during cross-compilation, not the target), making
          # it link the host binary against the cross architecture's
          # OpenSSL objects. pkg-config's own docs specify the fix:
          # PKG_CONFIG_PATH (and _LIBDIR/_SYSROOT_DIR) can be scoped to
          # one target triple via a `_<target-with-underscores>`
          # suffix, so it's absent for the host-native build-script
          # compilation. ALLOW_CROSS isn't scopeable this way, but
          # that's fine -- it's only consulted when cargo's own TARGET
          # differs from HOST for that specific compilation unit, which
          # is never true for a build script.
          target_env="${{ matrix.target }}"
          echo "PKG_CONFIG_PATH_${target_env//-/_}=/usr/lib/${{ matrix.multiarch_triplet }}/pkgconfig" >> "$GITHUB_ENV"

      # larql-router-protocol's own build.rs already documents this
      # exact requirement (`#[cfg(windows)] fn set_protoc()` is a
      # no-op, relying on protoc being on PATH), and larql-cli.yml
      # already carries the real, working fix for it -- this step is
      # that same fix, not a new one. Without it, the whole workspace
      # build fails at larql-router-protocol before any lint runs,
      # and because A/B/C below are all continue-on-error, that
      # failure was being silently swallowed into a green "pass" with
      # an empty fix.patch, on every past run of this workflow.
      - name: Install protoc (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: choco install protoc -y --no-progress

      # Fixed for real, once, at the source (root Cargo.toml), not here:
      # cargo resolves features for a shared dependency as the union of
      # every `[workspace].members` crate's request for it, not just
      # `-p larql-cli`'s own, so larql-server/larql-python/larql-router/
      # larql-demos/model-compute -- none of which larql-cli depends on
      # -- used to influence every larql-cli build regardless of what
      # larql-cli's own Cargo.toml asked for. Filed upstream as
      # chrishayuk/larql#314 (this branch cares about one binary,
      # larql-cli, so it made the permanent workspace-membership change
      # locally rather than wait); independently documented on this
      # fork's experiment/cuda-nvptx-lint-build branch, commit 7c00c1df.
      #
      # This is deliberately a real, reviewed commit to the workspace
      # manifest, not something this workflow computes or rewrites at
      # runtime. An earlier version tried the runtime-rewrite approach
      # and was reverted: deciding which crates belong in a trimmed
      # workspace has no tool with `--fix`'s actual guarantee (rustc's
      # own MachineApplicable classification) behind it -- confirmed by
      # research, not assumed (the Cargo book's own guidance is that
      # `-p` doesn't isolate you and the fix is a genuinely different
      # workspace boundary; cargo-hack tests feature powersets to
      # detect leakage, it doesn't avoid it; cargo-hackerman forces
      # unification consistency, the opposite goal). A hand-rolled
      # script making that decision unattended on every run doesn't
      # meet that bar; a human, informed by `cargo tree`'s real output,
      # deciding it once and committing the result does.

      - name: cargo tree (this target's actual dependency graph)
        # No tee to a file: GitHub Actions already captures every step's
        # full stdout/stderr verbatim (confirmed directly -- pulling this
        # exact job's raw log via the API showed the complete -vv output,
        # file:line included, with nothing missing). Teeing the same
        # content into a tracked-tree file was pure indirection, and it's
        # what caused the dirty-tree bug (twice) that blocked `--fix` from
        # ever running. The job log is the raw data; nothing else is
        # needed for tree/check/fix/residual output.
        run: cargo tree --target ${{ matrix.target }} ${{ matrix.feature_flags }} -e normal,build,dev -vv

      # "Allow nothing" applies here too, not just to the clippy-based
      # steps below: `cargo check` never runs clippy-driver, so the
      # `-W clippy::*` flags in `lint_flags` are meaningless to it --
      # the equivalent for plain rustc is its own allow-by-default
      # lints (`missing_docs`, `unsafe_code`, `unreachable_pub`, etc),
      # which `cargo check` otherwise leaves silently narrowed by
      # defaults exactly like clippy's would be. This list is the
      # complete set of rustc's own allow-by-default lints, extracted
      # directly from the actual installed rustc/clippy (1.98.0/0.1.98,
      # matching this workflow's toolchain) via `-W help`, not
      # hand-assembled from memory -- and re-verified against that same
      # toolchain a second time: the first extraction included 8 names
      # (`deprecated_llvm_intrinsic`, `implicit_provenance_casts`,
      # `multiple_supertrait_upcastable`, `must_not_suspend`,
      # `non_exhaustive_omitted_patterns`,
      # `resolving_to_items_shadowing_supertrait_items`,
      # `shadowing_supertrait_items`, `unqualified_local_imports`) that
      # `-W help` lists but stable rustc doesn't actually recognize
      # ("unknown lint" warnings, harmless but sloppy) -- removed,
      # leaving only the 52 that a real `cargo check` accepts cleanly.
      # `-D warnings` (verified empirically,
      # not assumed: `RUSTFLAGS="-D warnings" cargo check`, both with a
      # dependency crate's own pre-existing warning and with a
      # workspace path-sibling's own violation) denies exactly the
      # crate(s) actually being checked -- cargo's `--cap-lints warn`
      # protects real external (crates.io) dependencies regardless, but
      # does NOT shield workspace path-dependency siblings, which
      # `--workspace` treats as primary targets, not dependencies.
      # Scoped to this step's own `env:`, not the job's, so it doesn't
      # also apply to steps B/C's `cargo clippy` invocations below,
      # which already have their own, clippy-specific "allow nothing"
      # policy via `lint_flags`.
      - name: A. cargo check
        continue-on-error: true
        env:
          RUSTFLAGS: >-
            -W absolute-paths-not-starting-with-crate -W ambiguous-negative-literals
            -W closure-returning-async-block -W dead-code-pub-in-binary -W deprecated-in-future
            -W deprecated-safe-2024 -W deref-into-dyn-supertrait
            -W edition-2024-expr-fragment-specifier -W elided-lifetimes-in-paths
            -W explicit-outlives-requirements -W ffi-unwind-calls -W if-let-rescope
            -W impl-trait-overcaptures -W impl-trait-redundant-captures
            -W keyword-idents-2018 -W keyword-idents-2024 -W let-underscore-drop -W linker-info
            -W macro-use-extern-crate -W meta-variable-misuse -W missing-copy-implementations
            -W missing-debug-implementations -W missing-docs -W missing-unsafe-on-extern
            -W non-ascii-idents -W redundant-imports -W redundant-lifetimes
            -W rust-2021-incompatible-closure-captures
            -W rust-2021-incompatible-or-patterns -W rust-2021-prefixes-incompatible-syntax
            -W rust-2021-prelude-collisions -W rust-2024-guarded-string-incompatible-syntax
            -W rust-2024-incompatible-pat -W rust-2024-prelude-collisions
            -W single-use-lifetimes -W tail-expr-drop-order -W trivial-casts -W trivial-numeric-casts
            -W unit-bindings -W unnameable-types -W unreachable-pub
            -W unsafe-attr-outside-unsafe -W unsafe-code -W unstable-features
            -W unused-crate-dependencies -W unused-extern-crates -W unused-import-braces
            -W unused-lifetimes -W unused-macro-rules -W unused-qualifications -W unused-results
            -W variant-size-differences -D warnings
        run: cargo check --workspace --bins --tests --examples --target ${{ matrix.target }} ${{ matrix.feature_flags }} -vv

      # Same bug class as finding 1, from a source that can't be
      # eliminated: `cargo check`/`cargo tree` are real, standard tool
      # behavior, not anything this workflow writes, and without
      # --locked they can legitimately rewrite Cargo.lock in place
      # during ordinary resolution (a new platform-specific entry for
      # this target, a semver-compatible registry update since the
      # committed lockfile was generated). Confirmed against a real
      # run's raw job log: `* Cargo.lock (dirty)` was the sole reported
      # file, on a target whose own worktree Cargo.lock is otherwise
      # clean and untouched by any step here. --fix's own precondition
      # then correctly refuses. Committing it (local only, discarded
      # when the job ends, never pushed) is the same fix as finding 1
      # for the same reason: whatever changed the tree before --fix
      # runs must not be the reason --fix can't run.
      - name: Commit any Cargo.lock drift from cargo's own resolution (local only, never pushed)
        run: |
          git config user.email "target-matrix-decidability@localhost"
          git config user.name "target-matrix-decidability"
          if [ -n "$(git status --porcelain -- Cargo.lock)" ]; then
            git add Cargo.lock
            git commit -q -m "ephemeral: cargo's own Cargo.lock resolution for this target"
          fi

      - name: B. clippy --fix (${{ matrix.lint_scope }}, broken_code=${{ matrix.broken_code }})
        continue-on-error: true
        run: >
          cargo clippy --fix ${{ matrix.broken_code == true && '--broken-code' || '' }}
          --workspace --bins --tests --examples --target ${{ matrix.target }}
          ${{ matrix.feature_flags }} --no-deps -vv
          -- ${{ matrix.lint_flags }}

      - name: B. capture the actual fix diff
        # This is the one thing worth uploading: `git diff` produces
        # content that doesn't exist in any command's stdout (the log
        # shows THAT files changed, not a clean, directly `git apply`-able
        # diff). Written after the fix step, so it can't affect that
        # step's own dirty-tree precondition.
        #
        # Scoped to crates/ only, not a bare `git diff`: --fix never
        # touches anything outside the source tree, but Cargo.lock can
        # legitimately drift on its own (e.g. a routine resolver update)
        # for reasons unrelated to what --fix did -- scoping keeps
        # fix.patch a clean per-target signal regardless.
        run: git diff -- crates/ > fix.patch

      - name: C. residual clippy (${{ matrix.lint_scope }}, deny warnings)
        continue-on-error: true
        run: >
          cargo clippy --workspace --bins --tests --examples --target ${{ matrix.target }}
          ${{ matrix.feature_flags }} --no-deps -vv
          -- ${{ matrix.lint_flags }} -D warnings

      - uses: actions/upload-artifact@v7
        with:
          name: fix-patch-${{ matrix.target }}-${{ matrix.features }}-${{ matrix.lint_scope }}-broken-${{ matrix.broken_code }}
          path: fix.patch
          retention-days: 14
          if-no-files-found: warn
