# Per-target automated fix pipeline for larql-cli (proof of concept).
#
# Deliverable is the raw data itself, per target: what compiles, what
# `cargo clippy --fix` changes on its own (no human judgment), and what's
# still flagged after that (the residual -- exactly the set of concerns
# that needs a real decision, which is where splitting target-specific
# code into cleanly separated modules actually starts). This workflow
# does not classify, summarize, or render any of that.
#
# `cargo tree`/`check`/`fix`/residual `clippy` all print straight to the
# step's own stdout/stderr -- no `tee`-to-a-file. GitHub Actions already
# captures every step's full output verbatim (confirmed directly: pulling
# a job's raw log via the API showed complete -vv output, file:line
# included), so teeing the same content into a tracked-tree file was
# pure indirection -- and it's what caused `cargo fix` to see a dirty
# working directory and refuse to run, twice, before this was found. The
# job log is the raw data for those four; `fix.patch` (the one thing
# that doesn't already exist in any command's stdout -- a clean,
# directly `git apply`-able diff, versus the log merely showing that
# files changed) is the only uploaded artifact. Reading and acting on
# any of this happens outside the workflow.
#
# No hand-edited `#[cfg(...)]` blocks anywhere in this pipeline, and the
# workflow never writes to a source file itself -- every change to the
# tree comes from `cargo clippy --fix`, captured as `fix.patch`, not
# applied or committed here.
#
# Deliberately not answered here: whether cfg-selected code is *correct*
# on a given target (endianness, BLAS numerics, GPU hardware presence).
# That needs real tests, not this pipeline.
#
# No cross-toolchain installation of any kind (no apt cross-gcc, no
# cross-rs/Docker, no linker env vars). `rustup target add` gets a
# target's prebuilt std; nothing else is provided. `cargo check`/`clippy`
# don't link, but a dependency's build script (this workspace pulls in
# `ring` via rustls) can still shell out to a C compiler during `cargo
# check` itself -- confirmed locally: `aarch64-unknown-linux-gnu` and
# `sparcv9-sun-solaris` both fail identically with
# `error occurred in cc-rs: failed to find tool "<target>-gcc"`. That
# failure IS bucket A ("does not compile", with the exact reason in the
# log) -- not a problem to engineer around by installing a cross-gcc to
# force a green result. Manufacturing success would hide the finding,
# not report it.
#
# `--all-features` is used on purpose, unlike the per-crate CI workflows
# (which pin `--no-default-features` on non-macOS to keep their gate
# green). Here, a target where `gpu` fails to compile IS real data. No
# job in this workflow is a required check; every probe step uses
# `continue-on-error: true` so a failure on one step (or one target)
# never prevents the remaining steps/targets from still running and
# still producing their own raw data.
#
# Lint policy is "allow nothing": every lint clippy ships allow-by-default
# (`clippy::cargo`, `clippy::nursery`, `clippy::pedantic`, plus rustc's own
# allow-by-default lints) is promoted to at least `warn` via explicit `-W`,
# so the probe's diagnostic surface isn't silently narrowed by defaults.
# `clippy::restriction` is excluded: it contains mutually contradictory
# lint pairs (`clippy::pub_with_shorthand` / `clippy::pub_without_shorthand`
# both live in that group), so enabling it wholesale is unsatisfiable
# under `-D warnings`, not just noisy.
#
# `-vv` and `RUST_BACKTRACE=full` are set throughout: a compile failure
# here is often a dependency's build script (e.g. `ring`, via rustls)
# unable to find a C compiler for the target, not a code-level error, and
# the difference is only visible with build-script output unabbreviated.
# `cargo tree --target <T>` is captured per target because the dependency
# graph itself is target-conditioned (`[target.'cfg(...)'.dependencies]`)
# -- the same crate can pull in a different, or no, C dependency
# depending on the target, and that's part of the raw data too.
#
# `os` per target is just whichever GitHub-hosted runner is closest to
# native for that target family (ubuntu for linux, macos for darwin,
# windows for windows) -- not a claim that the target is "supported" on
# that runner, only where `rustup target add` and a plain `cargo check`
# get attempted.
#
# Triggered on `pull_request`, path-scoped to this file, not
# `workflow_dispatch`: a newly-added workflow can't be dispatched via
# the API/UI until it exists on the repo's default branch, and this
# branch is never getting merged there. Path-scoping to the file
# itself means pushing a change to this workflow is what re-runs it --
# not every unrelated commit on the branch. Not a required gate.

name: target-matrix-decidability

on:
  pull_request:
    paths:
      - '.github/workflows/target-matrix-decidability.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: full
    defaults:
      run:
        # windows-latest's default `run:` shell is pwsh, not bash -- the
        # `2>&1 | tee ...` steps below are bash syntax (no `tee` on pwsh
        # by default, different redirection semantics). Forcing bash
        # here keeps every step identical across all three runner OSes.
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: sparcv9-sun-solaris
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # This is the general fix for the whole class of bug, not a
      # patch for one instance of it: `dtolnay/rust-toolchain`'s own
      # `targets:` input always installs into a toolchain slot named
      # after its own `toolchain:`/`@ref` value (e.g. "stable-<host>"),
      # independent of whatever toolchain a repo's own override (a
      # rust-toolchain.toml, or any future mechanism) actually selects
      # as ACTIVE -- confirmed against a real run's raw job log, where
      # the target landed in "stable-<host>" while "1.98.0-<host>" was
      # the toolchain actually in use, so cargo/rustc never saw it.
      # `rustup target add` with no --toolchain flag always resolves
      # and targets whichever toolchain is ACTUALLY active (respecting
      # any override, present or future, whatever it's named) --
      # confirmed by direct reproduction. No continue-on-error: if this
      # fails, it's a genuine toolchain/workspace misconfiguration, not
      # a compilability finding about the target, and it must fail
      # loudly and distinctly from the probe steps below rather than
      # silently produce misleading "does not compile" data (exactly
      # what happened before this was found: E0463 "can't find crate
      # for core" looked like a real compile failure and was actually
      # this).
      - name: Add target to the ACTUALLY active toolchain
        run: rustup target add ${{ matrix.target }}

      # Isolate larql-cli from the rest of the workspace's feature
      # unification (filed upstream as chrishayuk/larql#314, with the
      # same finding independently documented on this fork's
      # experiment/cuda-nvptx-lint-build branch, commit 7c00c1df):
      # Cargo resolves features for a shared dependency as the union of
      # every `[workspace].members` crate's request for it, not just
      # `-p larql-cli`'s own -- so larql-server's HTTP stack,
      # larql-python's pyo3 bindings, larql-router, and model-compute
      # (none of which larql-cli depends on) can still influence what
      # larql-cli actually builds against.
      #
      # The closure is `cargo tree -p larql-cli`'s own traversal, piped
      # through plain text filtering (grep/awk/sort) -- not a hand-
      # written graph walk over `cargo metadata` JSON, which would be
      # reimplementing exactly what `cargo tree` already computes.
      # `members`/`default-members` are trimmed to that closure with
      # `awk`, ephemeral to this checkout only, never committed to the
      # real workspace. No separate validation step either: the very
      # next `cargo tree`/`cargo check` invocation is what actually
      # proves the rewritten Cargo.toml is well-formed -- if it isn't,
      # cargo fails loudly right there, which is the real check, not a
      # second, unauthoritative one written here.
      - name: Isolate larql-cli from unrelated workspace members
        run: |
          KEEP=$(cargo tree -p larql-cli --all-features -e normal,build,dev --prefix none 2>/dev/null \
            | grep -oE '^(larql-[a-z-]+|model-compute) v' \
            | awk '{print $1}' \
            | sort -u)
          echo "larql-cli's real workspace closure:"
          echo "$KEEP"

          for key in members default-members; do
            awk -v key="$key" -v keep="$KEEP" '
              BEGIN { n = split(keep, arr, "\n") }
              $0 ~ "^" key " = \\[" {
                print key " = ["
                for (i = 1; i <= n; i++) print "    \"crates/" arr[i] "\","
                print "]"
                skip = 1
                next
              }
              skip && /^\]/ { skip = 0; next }
              skip { next }
              { print }
            ' Cargo.toml > Cargo.toml.new && mv Cargo.toml.new Cargo.toml
          done

      - name: cargo tree (this target's actual dependency graph)
        # No tee to a file: GitHub Actions already captures every step's
        # full stdout/stderr verbatim (confirmed directly -- pulling this
        # exact job's raw log via the API showed the complete -vv output,
        # file:line included, with nothing missing). Teeing the same
        # content into a tracked-tree file was pure indirection, and it's
        # what caused the dirty-tree bug (twice) that blocked `--fix` from
        # ever running. The job log is the raw data; nothing else is
        # needed for tree/check/fix/residual output.
        run: cargo tree --target ${{ matrix.target }} --all-features -e normal,build,dev -vv

      - name: A. cargo check
        continue-on-error: true
        run: cargo check -p larql-cli --bins --tests --target ${{ matrix.target }} --all-features -vv

      # Same bug class as finding 1, confirmed via a real run's raw job
      # log (`* Cargo.toml (dirty)`, `* Cargo.lock (dirty)`), same root
      # cause (a workflow step's own write sits uncommitted in the tree
      # when --fix runs next), different fix shape: the isolation step's
      # edit can't be relocated outside the tree the way tee'd logs were
      # -- cargo needs Cargo.toml/Cargo.lock at their real paths -- so
      # the fix here is to commit it instead. Placed after `cargo tree`
      # and `cargo check`, not right after the trim itself: cargo only
      # prunes Cargo.lock to match the trimmed members on its next
      # invocation, so committing any earlier would miss that later
      # change and still leave Cargo.lock dirty when --fix runs.
      # Local-only commit, on an ephemeral checkout that's discarded
      # when the job ends -- never pushed anywhere.
      - name: Commit the ephemeral workspace trim (local only, never pushed)
        run: |
          git config user.email "target-matrix-decidability@localhost"
          git config user.name "target-matrix-decidability"
          if [ -n "$(git status --porcelain)" ]; then
            git add Cargo.toml Cargo.lock
            git commit -q -m "ephemeral: isolate larql-cli from unrelated workspace members"
          fi

      - name: B. clippy --fix (allow nothing, broken code included)
        continue-on-error: true
        run: >
          cargo clippy --fix --broken-code -p larql-cli --bins --tests --target ${{ matrix.target }}
          --all-features --no-deps -vv
          -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo

      - name: B. capture the actual fix diff
        # This is the one thing worth uploading: `git diff` produces
        # content that doesn't exist in any command's stdout (the log
        # shows THAT files changed, not a clean, directly `git apply`-able
        # diff). Written after the fix step, so it can't affect that
        # step's own dirty-tree precondition.
        #
        # Scoped to crates/ only, not a bare `git diff`: the workspace-
        # isolation step above rewrites the root Cargo.toml (and cargo
        # then prunes Cargo.lock to match on its next invocation) --
        # confirmed directly, an unscoped `git diff` produced the exact
        # same ~23KB Cargo.toml/Cargo.lock patch for every target
        # regardless of what --fix actually did to the source, making
        # fix.patch worthless as a per-target signal. Only crates/ is
        # ever a `--fix` output; the workspace files are this workflow's
        # own ephemeral setup, not part of what's being probed.
        run: git diff -- crates/ > fix.patch

      - name: C. residual clippy (allow nothing, deny warnings)
        continue-on-error: true
        run: >
          cargo clippy -p larql-cli --bins --tests --target ${{ matrix.target }}
          --all-features --no-deps -vv
          -- -W clippy::all -W clippy::pedantic -W clippy::nursery -W clippy::cargo -D warnings

      - uses: actions/upload-artifact@v7
        with:
          name: fix-patch-${{ matrix.target }}
          path: fix.patch
          retention-days: 14
          if-no-files-found: warn
