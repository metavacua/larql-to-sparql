name: target-analysis-pipeline
# Task 13 concurrency-cancellation proof: trivial follow-up commit, pushed
# immediately after commit a7b3a42a's run started, to trigger cancel-in-progress.

on:
  push:
    branches:
      - "experiment/target-analysis-*"
  workflow_dispatch:
    inputs:
      target:
        description: "Single target triple to analyze (optional; omit for the full rustc target-list)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    name: Discover target matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    outputs:
      target-matrix: ${{ steps.resolve.outputs.matrix }}
      batches: ${{ steps.resolve.outputs.batches }}
      batch-indices: ${{ steps.resolve.outputs.batch-indices }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: rustc --print target-list
        run: rustup run nightly rustc --print target-list > target-list.txt
      - name: Query tier for every real target
        run: |
          : > tier-lines.txt
          while IFS= read -r TARGET; do
            TIER=$(rustup run nightly rustc --print target-spec-json -Z unstable-options --target "$TARGET" 2>/dev/null \
              | python3 -c 'import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get("metadata", {}).get("tier", ""))
          except Exception:
              print("")')
            printf '%s\t%s\n' "$TARGET" "$TIER" >> tier-lines.txt
          done < target-list.txt
          python3 -c "
          import json
          tiers = {}
          with open('tier-lines.txt') as f:
              for line in f:
                  target, tier = line.rstrip(chr(10)).split(chr(9), 1)
                  tiers[target] = int(tier) if tier else None
          with open('target-tiers.json', 'w') as f:
              json.dump(tiers, f)
          "
      - name: Resolve target matrix
        id: resolve
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          python3 scripts/target_analysis_discovery.py \
            --target-list-file target-list.txt \
            --requested-target "$REQUESTED_TARGET" \
            --max-batch-size 12 \
            --target-tiers-file target-tiers.json \
            --max-tier 2 \
            --github-output "$GITHUB_OUTPUT" > /dev/null
      - name: Upload raw target-list and tiers
        uses: actions/upload-artifact@v4
        with:
          name: discovery-target-list
          path: |
            target-list.txt
            target-tiers.json

  target-independent-checks:
    name: "Target-independent checks: fmt (${{ matrix.crate }})"
    needs: [discovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        crate: [larql-boundary, larql-vindex-spec, larql-models, larql-compute, larql-cli]
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rustfmt --toolchain nightly
      - name: "cargo fmt --check: ${{ matrix.crate }}"
        id: fmt
        continue-on-error: true
        run: cargo +nightly fmt -p "${{ matrix.crate }}" --check > fmt-output.txt 2>&1
      - name: Upload fmt-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-independent-checks-${{ matrix.crate }}
          path: fmt-output.txt
      - name: Assert honest result
        run: |
          echo "cargo fmt --check outcome: ${{ steps.fmt.outcome }}"
          if [ "${{ steps.fmt.outcome }}" = "failure" ]; then
            echo "::notice::Real fmt violation recorded as a finding, not masked."
          fi

  target-capability:
    name: "Target capability: batch ${{ matrix.batch_index }}"
    needs: [discovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        batch_index: ${{ fromJSON(needs.discovery.outputs.batch-indices) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Probe every target in this batch
        env:
          BATCH_TARGETS: ${{ toJSON(fromJSON(needs.discovery.outputs.batches)[matrix.batch_index]) }}
        run: |
          mkdir -p out
          echo "$BATCH_TARGETS" | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))' > targets-in-batch.txt
          rustup run nightly rustc --print target-list > full-target-list.txt
          FAILED=0
          while IFS= read -r TARGET; do
            echo "=== target: $TARGET ==="
            if ! grep -qx "$TARGET" full-target-list.txt; then
              echo "::error::$TARGET not found in rustc --print target-list — discovery/capability disagreement"
              FAILED=1
              continue
            fi
            rustup run nightly rustc --print target-spec-json -Z unstable-options \
              --target "$TARGET" > "out/target-spec-$TARGET.json" || FAILED=1
            rustup run nightly rustc --print cfg --target "$TARGET" > "out/cfg-$TARGET.txt" || FAILED=1
            rustup run nightly rustc --print supported-crate-types -Z unstable-options \
              --target "$TARGET" > "out/supported-crate-types-$TARGET.txt" || FAILED=1
          done < targets-in-batch.txt
          exit $FAILED
      - name: Upload capability artifacts for this batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-capability-batch-${{ matrix.batch_index }}
          path: out/

  dependency-graph:
    name: "Dependency graph: batch ${{ matrix.batch_index }}"
    needs: [discovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        batch_index: ${{ fromJSON(needs.discovery.outputs.batch-indices) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Dependency-graph probes for every target in this batch
        env:
          BATCH_TARGETS: ${{ toJSON(fromJSON(needs.discovery.outputs.batches)[matrix.batch_index]) }}
        run: |
          mkdir -p out
          echo "$BATCH_TARGETS" | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))' > targets-in-batch.txt
          cargo install cargo-deny --locked
          FAILED=0
          while IFS= read -r TARGET; do
            echo "=== target: $TARGET ==="
            cargo +nightly metadata --format-version 1 --filter-platform "$TARGET" \
              > "out/metadata-$TARGET.json" || FAILED=1
            cargo +nightly tree -p larql-cli -e features --target "$TARGET" \
              > "out/tree-features-$TARGET.txt" || FAILED=1
            cargo +nightly tree -p larql-cli --duplicates --target "$TARGET" \
              > "out/tree-duplicates-$TARGET.txt" || FAILED=1
            cargo +nightly build -Z unstable-options --unit-graph \
              -p larql-cli --target "$TARGET" \
              > "out/unit-graph-$TARGET.json" || FAILED=1
            cargo deny --config deny-nvptx.toml check bans licenses advisories sources \
              > "out/deny-$TARGET.txt" || true
          done < targets-in-batch.txt
          exit $FAILED
      - name: Upload dependency-graph artifacts for this batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph-batch-${{ matrix.batch_index }}
          path: out/

  build-attempt:
    name: "Build attempt: batch ${{ matrix.batch_index }}"
    needs: [discovery, target-capability]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
      actions: read    # actions/download-artifact
    strategy:
      fail-fast: false
      matrix:
        batch_index: ${{ fromJSON(needs.discovery.outputs.batch-indices) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          rustup component add clippy --toolchain nightly
      - name: Download this batch's target-capability artifact
        uses: actions/download-artifact@v4
        with:
          name: target-capability-batch-${{ matrix.batch_index }}
          path: capability
      - name: Build-attempt probes for every target/build_std/cmd/features combination in this batch (plus a per-target crate-type canary)
        id: attempt
        env:
          BATCH_TARGETS: ${{ toJSON(fromJSON(needs.discovery.outputs.batches)[matrix.batch_index]) }}
        run: |
          mkdir -p out
          echo "$BATCH_TARGETS" | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))' > targets-in-batch.txt
          FAILED=0
          while IFS= read -r TARGET; do
            # Probe-mechanism canary (run 1's real CI evidence): `--crate-type` is
            # rejected outright by `cargo check`/`clippy`/`build` (it is not a flag
            # on those subcommands at all -- confirmed from run 1's logs, uniform
            # "unexpected argument '--crate-type' found" across all three). The one
            # cargo subcommand that documents `--crate-type` is `cargo rustc`, and
            # its own docs say it "only works when building a lib or example
            # library target" -- larql-cli is bin-only (see crates/larql-cli/Cargo.toml),
            # so the crate-type dimension cannot be driven through cargo's CLI against
            # this package as it stands. Recorded here as real L1 evidence (not
            # silently dropped) via a single `|| true` canary per target, instead of
            # a 5x-wide loop where every iteration issued an identical failing command.
            FIRST_CRATE_TYPE=$(tr ',' '\n' < "capability/supported-crate-types-$TARGET.txt" | sed 's/^ *//; s/ *$//' | head -1)
            if [ -n "$FIRST_CRATE_TYPE" ]; then
              echo "=== crate-type canary: target=$TARGET crate_type=$FIRST_CRATE_TYPE (cargo rustc --crate-type; expected to fail -- larql-cli is bin-only) ==="
              cargo +nightly rustc -p larql-cli --target "$TARGET" \
                --crate-type "$FIRST_CRATE_TYPE" --message-format=json \
                > "out/crate-type-canary-$TARGET.json" 2>&1 || true
            fi
            for BUILD_STD in none std core,alloc core; do
              if [ "$BUILD_STD" = "none" ]; then BUILD_STD_FLAG=""; else BUILD_STD_FLAG="-Z build-std=$BUILD_STD"; fi
              for CARGO_CMD in check clippy build; do
                for FEATURES in default-features no-default-features; do
                  if [ "$FEATURES" = "no-default-features" ]; then FEATURES_FLAG="--no-default-features"; else FEATURES_FLAG=""; fi
                  OUTFILE="out/attempt-$TARGET-$BUILD_STD-$CARGO_CMD-$FEATURES.json"
                  echo "=== target=$TARGET build_std=$BUILD_STD cmd=$CARGO_CMD features=$FEATURES ==="
                  cargo +nightly "$CARGO_CMD" -p larql-cli \
                    --target "$TARGET" $FEATURES_FLAG $BUILD_STD_FLAG \
                    --keep-going --message-format=json > "$OUTFILE" || FAILED=1
                done
              done
            done
          done < targets-in-batch.txt
          echo "batch-had-failure=$FAILED" >> "$GITHUB_OUTPUT"
      - name: Upload full diagnostic JSON for this batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-attempt-batch-${{ matrix.batch_index }}
          path: out/
      - name: Assert honest result
        run: |
          echo "batch ${{ matrix.batch_index }} had at least one real cargo failure: ${{ steps.attempt.outputs.batch-had-failure }}"
          if [ "${{ steps.attempt.outputs.batch-had-failure }}" = "1" ]; then
            echo "::notice::At least one real build failure in this batch, recorded as a finding in the uploaded JSON, not masked."
          fi

  runtime-test:
    name: "Runtime test: batch ${{ matrix.batch_index }}"
    needs: [discovery]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
    strategy:
      fail-fast: false
      matrix:
        batch_index: ${{ fromJSON(needs.discovery.outputs.batch-indices) }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine runner availability and execute or record block, for every target in this batch
        env:
          BATCH_TARGETS: ${{ toJSON(fromJSON(needs.discovery.outputs.batches)[matrix.batch_index]) }}
        run: |
          mkdir -p out
          echo "$BATCH_TARGETS" | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))' > targets-in-batch.txt
          while IFS= read -r TARGET; do
            case "$TARGET" in
              wasm32*|wasm64*)
                echo '{"status": "runnable", "runner": "wasmtime"}' > "out/runtime-test-result-$TARGET.json"
                # actual wasmtime execution wired in the wasm-family follow-on work;
                # this job records availability honestly either way.
                ;;
              x86_64-unknown-linux-gnu|aarch64-*-linux-*|aarch64-apple-darwin)
                echo '{"status": "runnable", "runner": "native"}' > "out/runtime-test-result-$TARGET.json"
                ;;
              nvptx64-nvidia-cuda)
                echo '{"status": "blocked", "reason": "no free GPU CI runner available for this project (confirmed 2026-08-16)"}' \
                  > "out/runtime-test-result-$TARGET.json"
                ;;
              *)
                echo '{"status": "blocked", "reason": "no known runner for this target"}' \
                  > "out/runtime-test-result-$TARGET.json"
                ;;
            esac
          done < targets-in-batch.txt
      - name: Upload runtime-test results for this batch
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-batch-${{ matrix.batch_index }}
          path: out/

  indexing:
    name: Build navigation index
    needs: [discovery, target-capability, dependency-graph, build-attempt, runtime-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout
      actions: read    # gh run download, below
    steps:
      - uses: actions/checkout@v4
      # Real-CI evidence (run 32316739919, job "Build navigation index",
      # https://github.com/metavacua/larql-to-sparql/actions/runs/32316739919):
      # an unfiltered `actions/download-artifact@v4` with `path: artifacts` and
      # no name/pattern (i.e. "download everything") pulled all 113 artifacts,
      # dominated by build-attempt-batch-* at 9.43GB total across 28 batches
      # (everything else combined: 0.08GB) -- and the runner crashed with
      # `System.IO.IOException: No space left on device`. Neither Step 1 below
      # (which only needs each artifact's *filenames*, for the expected/actual
      # completeness diff) nor Step 2 (which only reads ONE of the 24
      # per-target build_std/cmd/features combos --
      # attempt-<target>-none-check-default-features.json -- plus the tiny
      # target-spec file) needs the other 23 combos' content at all, so bulk
      # materializing all of build-attempt-batch-*'s content was never
      # necessary. Fixed below: the three small artifact families still use
      # the standard action; build-attempt-batch-* is fetched one batch at a
      # time via `gh run download` and immediately trimmed, so peak disk
      # usage never exceeds roughly one batch's uncompressed size.
      - name: Download target-capability artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: target-capability-batch-*
      - name: Download dependency-graph artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dependency-graph-batch-*
      - name: Download runtime-test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: runtime-test-batch-*
      - name: Download build-attempt artifacts one batch at a time (avoids the disk exhaustion above)
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_INDICES: ${{ needs.discovery.outputs.batch-indices }}
        run: |
          set -euo pipefail
          echo "$BATCH_INDICES" | python3 -c 'import json, sys; print("\n".join(str(i) for i in json.load(sys.stdin)))' > batch-indices.txt
          while IFS= read -r N; do
            echo "=== build-attempt batch $N ==="
            rm -rf raw-attempt-batch
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              -n "build-attempt-batch-$N" \
              -D raw-attempt-batch
            mkdir -p "artifacts/build-attempt-batch-$N"
            # Preserve every filename (Step 1 needs the full expected/actual
            # completeness diff), but only keep real content for the one file
            # per target Step 2 actually reads -- everything else becomes a
            # 0-byte placeholder. f.is_file() in Step 1 is true either way.
            for f in raw-attempt-batch/*; do
              name=$(basename "$f")
              case "$name" in
                *-none-check-default-features.json)
                  cp "$f" "artifacts/build-attempt-batch-$N/$name"
                  ;;
                *)
                  : > "artifacts/build-attempt-batch-$N/$name"
                  ;;
              esac
            done
            rm -rf raw-attempt-batch
          done < batch-indices.txt
      - name: Compute expected vs. actual per-target files, and the target-to-batch map
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path

          target_matrix = json.loads('''${{ needs.discovery.outputs.target-matrix }}''')
          batches = json.loads('''${{ needs.discovery.outputs.batches }}''')

          target_to_batch = {}
          for batch_index, batch_targets in enumerate(batches):
              for t in batch_targets:
                  target_to_batch[t] = batch_index

          expected = set()
          for t in target_matrix:
              expected.add(f"target-spec-{t}.json")
              expected.add(f"cfg-{t}.txt")
              expected.add(f"supported-crate-types-{t}.txt")
              expected.add(f"metadata-{t}.json")
              expected.add(f"tree-features-{t}.txt")
              expected.add(f"tree-duplicates-{t}.txt")
              expected.add(f"unit-graph-{t}.json")
              expected.add(f"deny-{t}.txt")
              expected.add(f"runtime-test-result-{t}.json")
              for build_std in ["none", "std", "core,alloc", "core"]:
                  for cmd in ["check", "clippy", "build"]:
                      for feat in ["default-features", "no-default-features"]:
                          expected.add(f"attempt-{t}-{build_std}-{cmd}-{feat}.json")

          batch_prefixes = (
              "target-capability-batch-", "dependency-graph-batch-",
              "build-attempt-batch-", "runtime-test-batch-",
          )
          actual = set()
          for batch_dir in Path("artifacts").iterdir():
              if batch_dir.is_dir() and batch_dir.name.startswith(batch_prefixes):
                  for f in batch_dir.iterdir():
                      if f.is_file():
                          actual.add(f.name)

          Path("expected-artifacts.json").write_text(json.dumps(sorted(expected)))
          Path("actual-artifacts.json").write_text(json.dumps(sorted(actual)))
          Path("target-to-batch.json").write_text(json.dumps(target_to_batch))
          PYEOF
      - name: Run indexing script per target
        run: |
          mkdir -p normalized
          python3 - <<'PYEOF'
          import json
          import subprocess
          import sys
          from pathlib import Path

          target_matrix = json.loads('''${{ needs.discovery.outputs.target-matrix }}''')
          target_to_batch = json.loads(Path("target-to-batch.json").read_text())
          combined = {}
          any_missing = False
          for t in target_matrix:
              batch_index = target_to_batch.get(t)
              attempt_file = Path(f"artifacts/build-attempt-batch-{batch_index}/attempt-{t}-none-check-default-features.json")
              spec_file = Path(f"artifacts/target-capability-batch-{batch_index}/target-spec-{t}.json")
              if batch_index is None or not attempt_file.exists() or not spec_file.exists():
                  combined[t] = {"error": "missing required per-target file"}
                  any_missing = True
                  continue

              # `cargo ... --message-format=json > attempt_file` writes cargo's
              # JSON-lines wire format (one JSON object per line -- see
              # https://doc.rust-lang.org/cargo/reference/external-tools.html and
              # this repo's own experiment-cuda-nvptx.yml, which already parses
              # these exact files line-by-line with jq), NOT a single JSON array.
              # target_analysis_indexing.py's load_json() does a plain json.load(),
              # which requires a JSON array -- confirmed locally with a synthetic
              # two-line JSONL fixture (json.decoder.JSONDecodeError: Extra data).
              # Normalize here, at the workflow-wiring level, rather than touching
              # the already-tested Task 3 script.
              normalized_file = Path(f"normalized/attempt-{t}.json")
              try:
                  messages = [
                      json.loads(line)
                      for line in attempt_file.read_text().splitlines()
                      if line.strip()
                  ]
              except json.JSONDecodeError as exc:
                  combined[t] = {"error": f"malformed JSONL in {attempt_file}: {exc}"}
                  any_missing = True
                  continue
              normalized_file.write_text(json.dumps(messages))

              result = subprocess.run(
                  [
                      # Real-CI evidence (run 32329135970, job "Build
                      # navigation index", all 331 targets):
                      # `python3 scripts/target_analysis_indexing.py` makes
                      # Python add scripts/ itself (not the repo root) to
                      # sys.path[0], so the script's own
                      # `from scripts.target_analysis_common import ...`
                      # raises ModuleNotFoundError: No module named 'scripts'.
                      # `python3 -m scripts.target_analysis_indexing`, run
                      # from the repo root (as this step already is, post
                      # actions/checkout@v4), adds the cwd instead, which is
                      # exactly what scripts/__init__.py's package needs.
                      # Confirmed locally: the plain-script form reproduces
                      # the identical traceback; the -m form succeeds with
                      # no PYTHONPATH override required.
                      "python3", "-m", "scripts.target_analysis_indexing",
                      "--compiler-messages-file", str(normalized_file),
                      "--target-spec-file", str(spec_file),
                      "--std-mode-errors-file", "/dev/stdin",
                      "--expected-artifacts-file", "expected-artifacts.json",
                      "--actual-artifacts-file", "actual-artifacts.json",
                  ],
                  input="[]",
                  capture_output=True,
                  text=True,
              )
              try:
                  combined[t] = json.loads(result.stdout)
              except json.JSONDecodeError:
                  combined[t] = {
                      "error": "indexing script produced non-JSON stdout",
                      "returncode": result.returncode,
                      "stderr": result.stderr[:500],
                  }
                  any_missing = True
                  continue
              if result.returncode != 0:
                  any_missing = True

          Path("index.json").write_text(json.dumps(combined, indent=2))

          if any_missing:
              missing_summary = set()
              for entry in combined.values():
                  missing_summary.update(entry.get("missing_artifacts", []))
              print(f"::error::indexing job found incompleteness across {len(combined)} targets")
              print(f"{len(missing_summary)} distinct missing artifact names (first 10 shown):")
              for name in sorted(missing_summary)[:10]:
                  print(f"  - {name}")

          sys.exit(1 if any_missing else 0)
          PYEOF
      - name: Upload index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-index
          path: index.json
