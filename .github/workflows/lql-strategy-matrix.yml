# LQL Strategy Matrix — empirical (source × produce-recipe × level) × command experiment.
#
# For every CLI-invokable leg (a model + a produce recipe: extract at a level,
# extract with a quant flag, gguf-to-vindex, or post-hoc quantize), the workflow
# PRODUCES a vindex on the current binary, records what it structurally is
# (family/dtype/quant/layers), then runs the full LQL command corpus against it
# and reports the COMPLETE RAW OUTPUT of every cell.
#
# The harness reports; it does not judge. There is no verdict layer: no
# pass/fail, no conformance oracle, no summarisation of the output into a
# derived opinion. Reading the results is a separate activity performed on the
# raw captures, by a human, outside this workflow. Legs are enumerated by
# scripts/lql_matrix/gen_legs.py (no prediction-pruning — see that file).

name: lql-strategy-matrix

on:
  # Feature branches trigger via their pull_request only. Listing a branch
  # here *and* targeting `main` below fires the whole matrix twice per push,
  # on two events that the concurrency group cannot dedupe (see below).
  push:
    branches: [lql-strategy-matrix]
  # Only fire when something that could change the RESULT changed. A docs or
  # spec commit on this branch should not spend an hour of runners.
  pull_request:
    branches: [lql-strategy-matrix, main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/lql_matrix/**"
      - ".github/workflows/lql-strategy-matrix.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which parts to run"
        type: choice
        default: all
        options: [all, probe, matrix, quality, none]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

# `github.ref` is refs/heads/<branch> on push but refs/pull/<n>/merge on
# pull_request, so keying on it puts the two events in different groups and a
# branch with an open PR runs the whole matrix twice. `head_ref || ref_name`
# normalises both to the branch name, so one branch means one group.
#
# cancel-in-progress stays false: a leg that dies mid-run loses its measured
# rows, and this workflow is a discovery experiment whose output is the
# deliverable — unlike the per-crate gates, where a superseded PR run is
# simply stale and worth cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: "1"

jobs:
  # Decides what this run does, so a run can be narrowed without editing the
  # workflow. Three ways in, cheapest first:
  #
  #   commit message   [skip matrix] [skip probe] [skip quality] [skip ci]
  #   dispatch input   scope = all | probe | matrix | quality | none
  #   paths filter     (above) — a docs-only PR does not trigger at all
  #
  # Everything downstream hangs off these three booleans, so a narrowed run
  # skips whole job trees rather than starting them and exiting early.
  gate:
    runs-on: ubuntu-latest
    outputs:
      probe: ${{ steps.g.outputs.probe }}
      matrix: ${{ steps.g.outputs.matrix }}
      quality: ${{ steps.g.outputs.quality }}
    steps:
      - id: g
        env:
          SCOPE: ${{ github.event.inputs.scope }}
          MSG: ${{ github.event.head_commit.message }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          SCOPE="${SCOPE:-all}"
          probe=false; matrix=false; quality=false
          case "$SCOPE" in
            all)     probe=true;  matrix=true;  quality=true ;;
            probe)   probe=true ;;
            matrix)  matrix=true ;;
            quality) quality=true ;;
            none)    : ;;
          esac
          # A skip marker in the commit message or PR title turns a part off
          # without a dispatch, which is what you want mid-iteration.
          TEXT="${MSG:-} ${TITLE:-}"
          case "$TEXT" in
            *"[skip ci]"*)      probe=false; matrix=false; quality=false ;;
          esac
          case "$TEXT" in *"[skip probe]"*)   probe=false ;;   esac
          case "$TEXT" in *"[skip matrix]"*)  matrix=false ;;  esac
          case "$TEXT" in *"[skip quality]"*) quality=false ;; esac
          {
            echo "probe=$probe"; echo "matrix=$matrix"; echo "quality=$quality"
          } >> "$GITHUB_OUTPUT"
          echo "scope=$SCOPE -> probe=$probe matrix=$matrix quality=$quality"

  # Enumerate every leg as JSON → consumed by the matrix via fromJSON. A malformed
  # plan fails here in seconds, before any leg runs.
  plan:
    needs: gate
    if: needs.gate.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.gen.outputs.legs }}
      repos: ${{ steps.repos.outputs.repos }}
    steps:
      - uses: actions/checkout@v6
      - id: gen
        # TEMPORARY (round-trip CI validation): narrow the matrix to the
        # round-trip-relevant models only. gen_legs.py keeps the full model list;
        # this env var filters it. Remove the `env:` block to restore full coverage.
        env:
          LQL_MATRIX_ONLY: "smol135,smol135base"
        run: |
          legs=$(python3 scripts/lql_matrix/gen_legs.py)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "$legs" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d)} legs planned')"

      # Distinct source repos across the planned legs. The prefetch job fans
      # out over these, so the hub is contacted once per repo per run instead
      # of once per leg.
      # Derived from the leg list ALREADY emitted above, never by re-running the
      # generator: a second invocation is a second derivation that can disagree
      # with the first. It did — `LQL_MATRIX_ONLY` is scoped to the `gen` step,
      # so a sibling step re-running gen_legs.py saw the unfiltered model list
      # and prefetched all 7 repos instead of the 2 the matrix actually uses.
      - id: repos
        env:
          LEGS: ${{ steps.gen.outputs.legs }}
        run: |
          repos=$(python3 -c "
          import json, os
          legs = json.loads(os.environ['LEGS'])
          seen = {}
          for lg in legs:
              if lg['source_kind'] != 'safetensors':
                  continue          # gguf legs stage their own repo (#180/#277)
              seen.setdefault(lg['hf'], lg['hf'].replace('/', '--'))
          print(json.dumps([{'repo': r, 'slug': s} for r, s in sorted(seen.items())]))
          ")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "$repos" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d)} distinct repos to prefetch:'); [print('  '+r['repo']) for r in d]"

  # Fetch each source repo from the hub EXACTLY ONCE per run, into a cache every
  # downstream job restores.
  #
  # Why: `snapshot_download` calls the repo-metadata API
  # (/api/models/<repo>/revision/main) on every invocation, before any file
  # transfer. Calling it once per matrix leg meant 27 anonymous metadata calls
  # per run at 12-way concurrency from shared GitHub egress IPs, and CloudFront
  # answered 429. The failure was hard rather than soft because each leg is a
  # cold runner: snapshot_download's own fallback ("cannot find the appropriate
  # snapshot folder ... on the local disk") had nothing to fall back to.
  #
  # A warm cache fixes both halves — it removes the calls, and it restores the
  # fallback for any 429 that still happens.
  prefetch:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Saved at job end, so the whole matrix sees a warm cache. Keyed on the
      # repo alone: these are immutable released snapshots, not moving refs.
      - name: Cache HF snapshot (${{ matrix.repo.repo }})
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-snapshot-${{ matrix.repo.slug }}-v2
      - name: Fetch (${{ matrix.repo.repo }})
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          # Subtractive, not an allowlist: excluding a known-unneeded artifact
          # cannot silently drop a file some architecture needs, whereas an
          # allowlist can (sentencepiece tokenizer.model, merges.txt, shard
          # index files, ...). Measured on SmolLM2-135M-Instruct: onnx/ is
          # 1618.7 MiB against 259.9 MiB of safetensors+config+tokenizer that
          # the pipeline actually reads — 86% of the fetch, and the reason its
          # cache entry is 1116 MiB while the base model's is 201 MiB.
          # gguf is NOT excluded: the convert legs consume it, staged by their
          # own step.
          IGNORE = ["onnx/*", "*.onnx", "*.onnx_data"]
          repo = os.environ["REPO"]
          # local_files_only first: a cache hit contacts the hub zero times.
          try:
              p = snapshot_download(repo, local_files_only=True)
              print(f"cache hit, no hub request: {p}")
          except Exception:
              p = snapshot_download(repo, ignore_patterns=IGNORE)
              print(f"cache miss, fetched from hub: {p}")
          PY
        env:
          REPO: ${{ matrix.repo.repo }}

  # Compile larql-cli ONCE; every leg downloads the binary.
  build:
    needs: gate
    # The binary is needed by both the probe and the matrix.
    if: needs.gate.outputs.probe == 'true' || needs.gate.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lqlmatrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lqlmatrix-
      - name: Install BLAS (build)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Build larql-cli (release)
        run: cargo build --release -p larql-cli
      - name: Upload larql binary
        uses: actions/upload-artifact@v4
        with:
          name: larql-bin
          path: target/release/larql
          retention-days: 1
          if-no-files-found: error

  quality:
    needs: gate
    if: needs.gate.outputs.quality == 'true'
    # Loud, obviously-directed signal on the LQL command stack: fmt + clippy +
    # tests, run ALONGSIDE the matrix (NOT a dependency of it) so a red check
    # never skips the matrix — we want both signals on the same run to compare
    # "unit test passed" against "matrix cell crashed" and localise the defect.
    # No exemptions: the backlog is included on purpose. The alarm stays on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure clippy + rustfmt (runner ships stable rust already)
        run: rustup component add clippy rustfmt
      - name: Install BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Cache cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lqlmatrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lqlmatrix-
      - name: fmt (loud)
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy — LQL stack (loud, no exemption)
        id: clippy
        continue-on-error: true
        run: cargo clippy -p larql-lql -p larql-cli -p larql-inference -p larql-vindex -p larql-core -p larql-kv -p larql-models --no-default-features -- -D warnings
      - name: test — LQL stack (comparative signal for the matrix)
        id: test
        continue-on-error: true
        run: cargo test -p larql-lql -p larql-cli -p larql-inference -p larql-vindex -p larql-core -p larql-kv -p larql-models --no-default-features
      - name: Report + fail loud if any check failed
        run: |
          {
            echo "## Quality — LQL command stack"
            echo "| check | outcome |"
            echo "|---|---|"
            echo "| fmt    | ${{ steps.fmt.outcome }} |"
            echo "| clippy | ${{ steps.clippy.outcome }} |"
            echo "| test   | ${{ steps.test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.fmt.outcome }}" = success ] \
            && [ "${{ steps.clippy.outcome }}" = success ] \
            && [ "${{ steps.test.outcome }}" = success ]

  matrix:
    needs: [gate, plan, prefetch, build]
    if: needs.gate.outputs.matrix == 'true'
    strategy:
      fail-fast: false          # every leg runs even when one breaks — breakage is data
      max-parallel: 12
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NAME: ${{ matrix.leg.name }}
      HF: ${{ matrix.leg.hf }}
      OP: ${{ matrix.leg.op }}
      LEVEL: ${{ matrix.leg.level }}
      FLAGS: ${{ matrix.leg.flags }}
      CORPUS_MODEL: ${{ matrix.leg.corpus_model }}
      TOKENIZER_REPO: ${{ matrix.leg.tokenizer_repo }}
      LQL_WITH: ${{ matrix.leg.lql_with }}
    steps:
      - uses: actions/checkout@v6
      - name: Download larql binary
        uses: actions/download-artifact@v4
        with:
          name: larql-bin
          path: bin
      - name: Prep
        run: |
          chmod +x bin/larql scripts/lql_matrix/run_matrix.sh
          sudo apt-get update && sudo apt-get install -y libopenblas-dev time
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: slug
        run: echo "slug=${HF//\//--}" >> "$GITHUB_OUTPUT"
      - name: Restore HF snapshot (${{ matrix.leg.hf }})
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/huggingface
          key: hf-snapshot-${{ steps.slug.outputs.slug }}-v2
      - name: Resolve source snapshot (${{ matrix.leg.hf }})
        run: |
          python -m pip install --quiet huggingface_hub numpy
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          IGNORE = ["onnx/*", "*.onnx", "*.onnx_data"]   # keep in step with the prefetch job
          repo = os.environ["HF"]
          # The prefetch job warmed this cache, so the normal path makes zero
          # hub requests. The fallback exists only for a cache eviction between
          # jobs; it is logged loudly because it is the condition that produced
          # the 429 storm, and a silent re-download would hide its return.
          try:
              print(f"resolved from cache, no hub request: {snapshot_download(repo, local_files_only=True)}")
          except Exception as e:
              print(f"::warning::HF cache MISS for {repo} ({type(e).__name__}) - falling back to a hub fetch")
              print(f"fetched from hub: {snapshot_download(repo, ignore_patterns=IGNORE)}")
          PY

      - name: Produce vindex (${{ matrix.leg.op }})
        run: |
          set +e
          mkdir -p out
          LARQL=./bin/larql
          VINDEX="out/${NAME}.vindex"
          TIMEF="out/produce-${NAME}.time"
          O="out/produce-${NAME}.out"; E="out/produce-${NAME}.err"
          start=$(date +%s%3N)
          case "$OP" in
            extract)
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL extract "$HF" -o "$VINDEX" ${LEVEL:+--level $LEVEL} $FLAGS >"$O" 2>"$E" ;;
            extract-lql)
              # Same production, driven through the LQL surface instead of the
              # CLI flag, so the two level lattices can be compared by the
              # weight-class vector tensor_presence.py derives. LQL_WITH empty
              # exercises the grammar's own default (Browse), which is NOT the
              # CLI's default (inference).
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL lql "EXTRACT MODEL \"$HF\" INTO \"$VINDEX\" $LQL_WITH;" >"$O" 2>"$E" ;;
            gguf-to-vindex)
              GGUF=$(find ~/.cache/huggingface -name '*.gguf' | head -1)
              echo "gguf source: $GGUF"
              # Stage the tokenizer from the base repo beside the .gguf — the -gguf repo
              # ships none, so gguf-to-vindex fails late without it (#180/#277).
              if [ -n "$TOKENIZER_REPO" ]; then
                TOKDIR=$(python3 -c "from huggingface_hub import snapshot_download; print(snapshot_download('${TOKENIZER_REPO}', allow_patterns=['tokenizer*','*special_tokens*','config.json','generation_config.json']))")
                # Staged file-by-file and REPORTED. Was `2>/dev/null || true`,
                # so a gguf leg could proceed with no tokenizer and fail later
                # for a reason unrelated to the missing stage (#180/#277).
                for tf in "$TOKDIR"/tokenizer*.json "$TOKDIR"/special_tokens_map.json; do
                  if [ -f "$tf" ]; then cp "$tf" "$(dirname "$GGUF")/" && echo "staged: $(basename "$tf")"
                  else echo "NOT staged (absent in $TOKENIZER_REPO): $(basename "$tf")"; fi
                done
                echo "staged tokenizer from $TOKENIZER_REPO into $(dirname "$GGUF")"
              fi
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL convert gguf-to-vindex "$GGUF" -o "$VINDEX" ${LEVEL:+--level $LEVEL} $FLAGS >"$O" 2>"$E" ;;
            quantize-q4k)
              /usr/bin/time -v -o "${TIMEF}.src" timeout 18000 \
                $LARQL extract "$HF" -o "${VINDEX}.src" --level inference >"$O" 2>"$E"
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL convert quantize q4k --input "${VINDEX}.src" --output "$VINDEX" >>"$O" 2>>"$E" ;;
            quantize-fp4)
              /usr/bin/time -v -o "${TIMEF}.src" timeout 18000 \
                $LARQL extract "$HF" -o "${VINDEX}.src" --level inference >"$O" 2>"$E"
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL convert quantize fp4 --input "${VINDEX}.src" --output "$VINDEX" >>"$O" 2>>"$E" ;;
          esac
          ec=$?
          end=$(date +%s%3N)
          # peak RSS = MAX across every command's time file (extract .src + quantize),
          # not just the last — a fast-failing quantize must not hide a multi-GB extract.
          # Nothing below sends stderr to /dev/null or substitutes a plausible
          # value on failure: a swallowed failure is indistinguishable from a
          # successful empty result, and the harness exists to show what happened.
          rss=$(python3 scripts/lql_matrix/peak_rss.py "${TIMEF}.src" "$TIMEF" 2>>"$E")
          vmb=$(du -sm "$VINDEX" 2>>"$E" | cut -f1)
          printf '{"name":"%s","op":"%s","level":"%s","flags":"%s","exit_code":%d,"duration_ms":%d,"peak_rss_kb":%s,"vindex_mb":%s}\n' \
            "$NAME" "$OP" "$LEVEL" "$FLAGS" "$ec" "$((end-start))" "${rss:-null}" "${vmb:-null}" \
            > "out/produce-${NAME}.json"
          echo "produce ${NAME}: exit=$ec rss=${rss:-?}kb vindex=${vmb:-?}MB"

          # descriptor: what the recipe actually produced. Its stderr is KEPT —
          # this used to be `2>/dev/null || echo '{"error":"descriptor failed"}'`,
          # which destroyed the traceback and replaced it with a fixed string, so
          # a crashed descriptor and a descriptor reporting a problem looked the same.
          python3 scripts/lql_matrix/descriptor.py "$VINDEX" "$NAME" \
            > "out/descriptor-${NAME}.json" 2> "out/descriptor-${NAME}.err"
          echo "descriptor:"
          if [ -s "out/descriptor-${NAME}.json" ]; then cat "out/descriptor-${NAME}.json"
          else echo "(descriptor wrote nothing — see descriptor-${NAME}.err)"; fi
          [ -s "out/descriptor-${NAME}.err" ] && { echo "descriptor stderr:"; cat "out/descriptor-${NAME}.err"; }

          # weight-family inventory
          MDIR="out/manifest-${NAME}"; mkdir -p "$MDIR"
          for f in index.json weight_manifest.json; do
            if [ -f "$VINDEX/$f" ]; then cp "$VINDEX/$f" "$MDIR/"
            else echo "absent: $VINDEX/$f" >> "$MDIR/copy.log"; fi
          done
          [ -f "$MDIR/copy.log" ] && cat "$MDIR/copy.log"

          # filename -> size for every vindex file. On failure the stderr is kept
          # and no `{}` is fabricated: an empty listing must mean "no files", never
          # "the lister crashed".
          python3 -c "import json,os,sys; d=sys.argv[1]; print(json.dumps({f: os.path.getsize(os.path.join(d,f)) for f in os.listdir(d)}))" \
            "$VINDEX" > "$MDIR/listing.json" 2> "$MDIR/listing.err"
          [ -s "$MDIR/listing.err" ] && { echo "listing stderr:"; cat "$MDIR/listing.err"; }

      - name: Round-trip compile (${{ matrix.leg.name }})
        if: ${{ matrix.leg.roundtrip == true }}
        continue-on-error: true
        run: |
          # Cache is already warm from the resolve step above; local_files_only
          # keeps this second resolution from adding another metadata call.
          BASE_DIR=$(python3 -c "from huggingface_hub import snapshot_download; print(snapshot_download('${HF}', local_files_only=True))")
          python3 scripts/lql_matrix/roundtrip_compile.py --name "$NAME" --hf "$HF" \
            --vindex "out/${NAME}.vindex" --larql-bin ./bin/larql --out-root "$(mktemp -d)" \
            --produce-out "out/roundtrip-produce-${NAME}.jsonl" --diff-out "out/roundtrip-${NAME}.json"

      - name: Upload round-trip results
        if: ${{ always() && matrix.leg.roundtrip == true }}
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-${{ matrix.leg.name }}
          retention-days: 1
          path: |
            out/roundtrip-${{ matrix.leg.name }}.json
            out/roundtrip-produce-${{ matrix.leg.name }}.jsonl
            out/roundtrip-cells-${{ matrix.leg.name }}/

      - name: Run LQL command corpus (${{ matrix.leg.name }})
        run: |
          VINDEX="out/${NAME}.vindex"
          LARQL_BIN=./bin/larql \
          MODEL_ID="${CORPUS_MODEL}" \
          TMPROOT="$(mktemp -d)" \
          CELL_TIMEOUT=900 \
          scripts/lql_matrix/run_matrix.sh \
            "${NAME}" "$VINDEX" scripts/lql_matrix/commands.jsonl "out/results-${NAME}.jsonl"

      - name: Upload leg results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.leg.name }}
          retention-days: 1
          path: |
            out/results-${{ matrix.leg.name }}.jsonl
            out/produce-${{ matrix.leg.name }}.json
            out/produce-${{ matrix.leg.name }}.err
            out/descriptor-${{ matrix.leg.name }}.json
            out/descriptor-${{ matrix.leg.name }}.err
            out/produce-${{ matrix.leg.name }}.out
            out/manifest-${{ matrix.leg.name }}/
            out/cells/

  # Model-level lifecycle cells (EXTRACT MODEL / USE MODEL) don't read a produced
  # vindex — run them ONCE per model instead of once per leg (removes the biggest
  # duplicated extraction: the per-leg re-extract). Separate `lifecycle-*` artifacts
  # so the `results-*` globs ignore them.
  model-lifecycle:
    needs: [gate, prefetch, build]
    if: needs.gate.outputs.matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        model:
          # TEMPORARY (round-trip CI validation): only smol135 is exercised for
          # the model-lifecycle corpus. Uncomment the others to restore full coverage.
          - { id: smol135,   hf: "HuggingFaceTB/SmolLM2-135M-Instruct" }
          # - { id: qwen05,    hf: "Qwen/Qwen2.5-Coder-0.5B-Instruct" }
          # - { id: smol360,   hf: "HuggingFaceTB/SmolLM2-360M-Instruct" }
          # - { id: qwen15,    hf: "Qwen/Qwen2.5-1.5B-Instruct" }
          # - { id: granite1b, hf: "ibm-granite/granite-3.0-1b-a400m-instruct" }
          # - { id: bitnet2b,  hf: "microsoft/bitnet-b1.58-2B-4T" }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Download larql binary
        uses: actions/download-artifact@v4
        with:
          name: larql-bin
          path: bin
      - name: Prep
        run: |
          chmod +x bin/larql scripts/lql_matrix/run_matrix.sh
          sudo apt-get update && sudo apt-get install -y libopenblas-dev time
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: slug
        run: echo "slug=${MHF//\//--}" >> "$GITHUB_OUTPUT"
        env:
          MHF: ${{ matrix.model.hf }}
      - name: Restore HF snapshot (${{ matrix.model.hf }})
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/huggingface
          key: hf-snapshot-${{ steps.slug.outputs.slug }}-v2
      - name: Resolve snapshot (${{ matrix.model.hf }})
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          IGNORE = ["onnx/*", "*.onnx", "*.onnx_data"]   # keep in step with the prefetch job
          repo = os.environ["MHF"]
          try:
              print(f"resolved from cache, no hub request: {snapshot_download(repo, local_files_only=True)}")
          except Exception as e:
              print(f"::warning::HF cache MISS for {repo} ({type(e).__name__}) - falling back to a hub fetch")
              print(f"fetched from hub: {snapshot_download(repo, ignore_patterns=IGNORE)}")
          PY
        env:
          MHF: ${{ matrix.model.hf }}
      - name: Run model-level lifecycle corpus (${{ matrix.model.id }})
        run: |
          mkdir -p out
          LARQL_BIN=./bin/larql \
          MODEL_ID="${{ matrix.model.hf }}" \
          TMPROOT="$(mktemp -d)" \
          CELL_TIMEOUT=900 \
          scripts/lql_matrix/run_matrix.sh \
            "${{ matrix.model.id }}-lifecycle" "unused.vindex" \
            scripts/lql_matrix/commands-model.jsonl "out/lifecycle-${{ matrix.model.id }}.jsonl"
      - name: Upload lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.model.id }}
          retention-days: 1
          path: |
            out/lifecycle-${{ matrix.model.id }}.jsonl
            out/cells/

  roundtrip:
    needs: [gate, matrix]
    # always() so a failed leg still gets collated; the gate term so a run that
    # never asked for the matrix does not collate nothing.
    if: always() && needs.gate.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build round-trip catalogue
        run: |
          python3 scripts/lql_matrix/roundtrip_aggregate.py \
            "artifacts/roundtrip-*/roundtrip-*.json" roundtrip-catalogue.json roundtrip-catalogue.md
          cat roundtrip-catalogue.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload round-trip catalogue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-catalogue
          retention-days: 1
          path: |
            roundtrip-catalogue.json
            roundtrip-catalogue.md

  inventory:
    needs: [gate, matrix]
    if: always() && needs.gate.outputs.matrix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Tensor presence
        run: |
          python3 scripts/lql_matrix/tensor_presence.py \
            "artifacts/results-*/manifest-*/listing.json" presence.json
          cat presence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory
          retention-days: 1
          path: presence.json
