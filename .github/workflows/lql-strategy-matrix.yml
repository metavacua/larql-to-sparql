# LQL Strategy Matrix — empirical (source × produce-recipe × level) × command experiment.
#
# For every CLI-invokable leg (a model + a produce recipe: extract at a level,
# extract with a quant flag, gguf-to-vindex, or post-hoc quantize), the workflow
# PRODUCES a vindex on the current binary, records its structural descriptor
# (family/dtype/quant vs expected — so extraction/convert breakage or silent
# dequant is observed, not assumed), then runs the full LQL command corpus against
# it and records the RAW MECHANICAL OUTCOME of every cell. Discovery experiment,
# not a pass/fail gate: the breakage is the deliverable. Legs are enumerated by
# scripts/lql_matrix/gen_legs.py (no prediction-pruning — see that file).

name: lql-strategy-matrix

on:
  push:
    branches: [candidate/main-replacement]
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the run if any conformance invariant is violated"
        type: boolean
        default: false
      include_bitnet2b:
        description: "Include BitNet-2B-4T legs (safetensors + GGUF ternary/dequant) -- heaviest source by far, off by default"
        type: boolean
        default: false
      include_mistral7b:
        description: "Run the Mistral-7B-v0.1 goldens against the real model (~14.5 GB download) -- off by default"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  # Enumerate every leg as JSON → consumed by the matrix via fromJSON. A malformed
  # plan fails here in seconds, before any leg runs.
  plan:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.gen.outputs.legs }}
    steps:
      - uses: actions/checkout@v6
      - id: gen
        env:
          # push/schedule carry no `inputs` context; default to excluded.
          INCLUDE_BITNET2B: ${{ github.event.inputs.include_bitnet2b || 'false' }}
        run: |
          legs=$(python3 scripts/lql_matrix/gen_legs.py)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "$legs" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'{len(d)} legs planned')"

  # Compile larql-cli ONCE; every leg downloads the binary.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lqlmatrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lqlmatrix-
      - name: Install BLAS (build)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Build larql-cli (release)
        run: cargo build --release -p larql-cli
      - name: Upload larql binary
        uses: actions/upload-artifact@v4
        with:
          name: larql-bin
          path: target/release/larql
          retention-days: 1
          if-no-files-found: error

  quality:
    # Loud, obviously-directed signal on the LQL command stack: fmt + clippy +
    # tests, run ALONGSIDE the matrix (NOT a dependency of it) so a red check
    # never skips the matrix — we want both signals on the same run to compare
    # "unit test passed" against "matrix cell crashed" and localise the defect.
    # No exemptions: the backlog is included on purpose. The alarm stays on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ensure clippy + rustfmt (runner ships stable rust already)
        run: rustup component add clippy rustfmt
      - name: Install BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Cache cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lqlmatrix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lqlmatrix-
      - name: fmt (loud)
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy — LQL stack (loud, no exemption)
        id: clippy
        continue-on-error: true
        run: cargo clippy -p larql-lql -p larql-cli -p larql-inference -p larql-vindex -p larql-core -p larql-kv -p larql-models --no-default-features -- -D warnings
      - name: test — LQL stack (comparative signal for the matrix)
        id: test
        continue-on-error: true
        run: cargo test -p larql-lql -p larql-cli -p larql-inference -p larql-vindex -p larql-core -p larql-kv -p larql-models --no-default-features
      - name: Report + fail loud if any check failed
        run: |
          {
            echo "## Quality — LQL command stack"
            echo "| check | outcome |"
            echo "|---|---|"
            echo "| fmt    | ${{ steps.fmt.outcome }} |"
            echo "| clippy | ${{ steps.clippy.outcome }} |"
            echo "| test   | ${{ steps.test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.fmt.outcome }}" = success ] \
            && [ "${{ steps.clippy.outcome }}" = success ] \
            && [ "${{ steps.test.outcome }}" = success ]

  matrix:
    # A short explicit name: gh's `run view --log` shows nothing for job names
    # that are long or contain path-illegal characters (cli/cli #7640, #7642),
    # which the default name built from every matrix field is.
    name: matrix (${{ matrix.leg.name }})
    needs: [plan, build]
    strategy:
      fail-fast: false          # every leg runs even when one breaks — breakage is data
      max-parallel: 12
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NAME: ${{ matrix.leg.name }}
      HF: ${{ matrix.leg.hf }}
      OP: ${{ matrix.leg.op }}
      LEVEL: ${{ matrix.leg.level }}
      FLAGS: ${{ matrix.leg.flags }}
      EXPECT_QUANT: ${{ matrix.leg.expect_quant }}
      CORPUS_MODEL: ${{ matrix.leg.corpus_model }}
      TOKENIZER_REPO: ${{ matrix.leg.tokenizer_repo }}
    steps:
      - uses: actions/checkout@v6
      - name: Download larql binary
        uses: actions/download-artifact@v4
        with:
          name: larql-bin
          path: bin
      - name: Prep
        run: |
          chmod +x bin/larql scripts/lql_matrix/run_matrix.sh
          sudo apt-get update && sudo apt-get install -y libopenblas-dev time
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # vindex3 legs read the hub by header/byte range (hf://) and must not
      # have the checkpoint on disk — that is the property they exercise.
      - name: Pre-download source snapshot (${{ matrix.leg.hf }})
        if: matrix.leg.op != 'vindex3'
        run: |
          python -m pip install --quiet huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('${HF}')"

      - name: Produce vindex (${{ matrix.leg.op }})
        run: |
          set +e
          mkdir -p out
          LARQL=./bin/larql
          VINDEX="out/${NAME}.vindex"
          TIMEF="out/produce-${NAME}.time"
          O="out/produce-${NAME}.out"; E="out/produce-${NAME}.err"
          start=$(date +%s%3N)
          case "$OP" in
            extract)
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL extract "$HF" -o "$VINDEX" ${LEVEL:+--level $LEVEL} $FLAGS >"$O" 2>"$E" ;;
            gguf-to-vindex)
              GGUF=$(find ~/.cache/huggingface -name '*.gguf' | head -1)
              echo "gguf source: $GGUF"
              # Stage the tokenizer from the base repo beside the .gguf — the -gguf repo
              # ships none, so gguf-to-vindex fails late without it (#180/#277).
              if [ -n "$TOKENIZER_REPO" ]; then
                TOKDIR=$(python3 -c "from huggingface_hub import snapshot_download; print(snapshot_download('${TOKENIZER_REPO}', allow_patterns=['tokenizer*','*special_tokens*','config.json','generation_config.json']))")
                cp "$TOKDIR"/tokenizer*.json "$TOKDIR"/special_tokens_map.json "$(dirname "$GGUF")/" 2>/dev/null || true
                echo "staged tokenizer from $TOKENIZER_REPO into $(dirname "$GGUF")"
              fi
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL convert gguf-to-vindex "$GGUF" -o "$VINDEX" ${LEVEL:+--level $LEVEL} $FLAGS >"$O" 2>"$E" ;;
            quantize-q4k)
              /usr/bin/time -v -o "${TIMEF}.src" timeout 18000 \
                $LARQL extract "$HF" -o "${VINDEX}.src" --level inference >"$O" 2>"$E"
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL convert quantize q4k --input "${VINDEX}.src" --output "$VINDEX" >>"$O" 2>>"$E" ;;
            quantize-fp4)
              /usr/bin/time -v -o "${TIMEF}.src" timeout 18000 \
                $LARQL extract "$HF" -o "${VINDEX}.src" --level inference >"$O" 2>"$E"
              /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                $LARQL convert quantize fp4 --input "${VINDEX}.src" --output "$VINDEX" >>"$O" 2>>"$E" ;;
            vindex3)
              # The project's V3 producer (docs/vindex3-format.md §4, §6):
              # `vindex3 plan` is the G1 admission verdict from safetensors
              # headers alone; encode runs only on an admissible plan. The
              # plan's own output is the deliverable either way, so it is
              # printed on success here and by the non-ok block below
              # otherwise.
              /usr/bin/time -v -o "${TIMEF}.src" timeout 3600 \
                $LARQL vindex3 plan "hf://$HF" --output "out/plan-${NAME}.json" >"$O" 2>"$E"
              pec=$?
              if [ "$pec" -eq 0 ]; then
                echo "::group::vindex3 plan ${NAME} (admissible)"
                cat "$O" "$E"
                echo "::endgroup::"
                /usr/bin/time -v -o "$TIMEF" timeout 18000 \
                  $LARQL vindex3 encode "hf://$HF" --output "$VINDEX" $FLAGS >>"$O" 2>>"$E"
              else
                (exit "$pec")
              fi ;;
          esac
          ec=$?
          end=$(date +%s%3N)
          case "$ec" in
            0) bucket=ok ;; 124) bucket=timeout ;; 137|139|134) bucket=crash ;; *) bucket=err ;;
          esac
          # peak RSS = MAX across every command's time file (extract .src + quantize),
          # not just the last — a fast-failing quantize must not hide a multi-GB extract.
          rss=$(python3 scripts/lql_matrix/peak_rss.py "${TIMEF}.src" "$TIMEF" 2>/dev/null)
          vmb=$(du -sm "$VINDEX" 2>/dev/null | cut -f1)
          printf '{"name":"%s","op":"%s","level":"%s","flags":"%s","exit_code":%d,"bucket":"%s","duration_ms":%d,"peak_rss_kb":%s,"vindex_mb":%s}\n' \
            "$NAME" "$OP" "$LEVEL" "$FLAGS" "$ec" "$bucket" "$((end-start))" "${rss:-0}" "${vmb:-0}" \
            > "out/produce-${NAME}.json"
          echo "produce ${NAME}: exit=$ec bucket=$bucket rss=${rss:-?}kb vindex=${vmb:-?}MB"
          # Raw stdout/stderr are captured to files for the artifact, but a
          # non-ok produce is exactly the case where the actual larql error
          # text must be a standard, always-visible part of THIS log — not
          # something only recoverable by downloading a 1-day-retention
          # artifact. Print it here, unfiltered.
          if [ "$bucket" != "ok" ]; then
            echo "::group::produce ${NAME} stdout"
            cat "$O"
            echo "::endgroup::"
            echo "::group::produce ${NAME} stderr"
            cat "$E"
            echo "::endgroup::"
          fi
          # descriptor: what did we actually get vs what we expected?
          if ! python3 scripts/lql_matrix/descriptor.py "$VINDEX" "$NAME" "$EXPECT_QUANT" \
                 > "out/descriptor-${NAME}.json" 2> "out/descriptor-${NAME}.err"; then
            echo "::warning::descriptor.py failed for ${NAME} — see stderr below, not just the placeholder"
            echo "::group::descriptor.py stderr (${NAME})"
            cat "out/descriptor-${NAME}.err"
            echo "::endgroup::"
            printf '{"name":"%s","error":"descriptor failed"}\n' "$NAME" > "out/descriptor-${NAME}.json"
          fi
          echo "descriptor:"; cat "out/descriptor-${NAME}.json"
          # weight-family inventory (which classes the recipe produced)
          MDIR="out/manifest-${NAME}"; mkdir -p "$MDIR"
          cp "$VINDEX/index.json" "$VINDEX/weight_manifest.json" "$MDIR/" 2>/dev/null || true
          # tensor-presence witness (Q8): filename -> size for every vindex file
          python3 -c "import json,os,sys; d=sys.argv[1]; print(json.dumps({f: os.path.getsize(os.path.join(d,f)) for f in os.listdir(d)}) if os.path.isdir(d) else '{}')" \
            "$VINDEX" > "$MDIR/listing.json" 2>/dev/null || echo '{}' > "$MDIR/listing.json"

      # Uploaded before the corpus runs, so the real-artifact tests see the
      # vindex exactly as produced. A leg that failed to produce uploads
      # nothing; the consuming job then fails on the missing artifact.
      - name: Upload vindex for real-artifact tests
        if: contains(fromJSON('["smol135base.v3","smol135base.native.all","smol135base.xform.q4k"]'), matrix.leg.name)
        uses: actions/upload-artifact@v4
        with:
          name: vindex-${{ matrix.leg.name }}
          path: out/${{ matrix.leg.name }}.vindex
          retention-days: 1
          if-no-files-found: warn

      - name: Run LQL command corpus (${{ matrix.leg.name }})
        run: |
          VINDEX="out/${NAME}.vindex"
          LARQL_BIN=./bin/larql \
          MODEL_ID="${CORPUS_MODEL}" \
          TMPROOT="$(mktemp -d)" \
          CELL_TIMEOUT=900 \
          scripts/lql_matrix/run_matrix.sh \
            "${NAME}" "$VINDEX" scripts/lql_matrix/commands.jsonl "out/results-${NAME}.jsonl"

      - name: Upload leg results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.leg.name }}
          retention-days: 1
          path: |
            out/results-${{ matrix.leg.name }}.jsonl
            out/produce-${{ matrix.leg.name }}.json
            out/produce-${{ matrix.leg.name }}.err
            out/descriptor-${{ matrix.leg.name }}.json
            out/plan-${{ matrix.leg.name }}.json
            out/manifest-${{ matrix.leg.name }}/
            out/cells/

  # Model-level lifecycle cells (EXTRACT MODEL / USE MODEL) don't read a produced
  # vindex — run them ONCE per model instead of once per leg (removes the biggest
  # duplicated extraction: the per-leg re-extract). Separate `lifecycle-*` artifacts
  # so the conformance/aggregate `results-*` globs ignore them.
  model-lifecycle:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        model:
          - { id: smol135,     hf: "HuggingFaceTB/SmolLM2-135M-Instruct" }
          - { id: smol135base, hf: "HuggingFaceTB/SmolLM2-135M" }
          - { id: bitnet2b,  hf: "microsoft/bitnet-b1.58-2B-4T" }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Download larql binary
        uses: actions/download-artifact@v4
        with:
          name: larql-bin
          path: bin
      - name: Prep
        run: |
          chmod +x bin/larql scripts/lql_matrix/run_matrix.sh
          sudo apt-get update && sudo apt-get install -y libopenblas-dev time
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # This matrix is static YAML, not driven by gen_legs.py's own
      # INCLUDE_BITNET2B gate -- without this on the two costly steps below,
      # the bitnet2b entry above downloads and runs regardless of the
      # toggle (confirmed on run 36646839935, 2026-09-29). A job-level `if:`
      # referencing `matrix.*` here is rejected outright by GitHub's own
      # workflow validator (confirmed on run 36650454348, "failed because
      # of a workflow file issue") -- gating has to be per-step, not per-job.
      - name: Pre-download snapshot (${{ matrix.model.hf }})
        if: matrix.model.id != 'bitnet2b' || github.event.inputs.include_bitnet2b == 'true'
        run: |
          python -m pip install --quiet huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('${{ matrix.model.hf }}')"
      - name: Run model-level lifecycle corpus (${{ matrix.model.id }})
        if: matrix.model.id != 'bitnet2b' || github.event.inputs.include_bitnet2b == 'true'
        run: |
          mkdir -p out
          LARQL_BIN=./bin/larql \
          MODEL_ID="${{ matrix.model.hf }}" \
          TMPROOT="$(mktemp -d)" \
          CELL_TIMEOUT=900 \
          scripts/lql_matrix/run_matrix.sh \
            "${{ matrix.model.id }}-lifecycle" "unused.vindex" \
            scripts/lql_matrix/commands-model.jsonl "out/lifecycle-${{ matrix.model.id }}.jsonl"
      - name: Upload lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.model.id }}
          retention-days: 1
          path: |
            out/lifecycle-${{ matrix.model.id }}.jsonl
            out/cells/

  aggregate:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build matrix report
        run: |
          cp artifacts/results-*/descriptor-*.json . 2>/dev/null || true
          cp artifacts/results-*/produce-*.json . 2>/dev/null || true
          python3 scripts/lql_matrix/aggregate.py "artifacts/results-*/results-*.jsonl" lql-matrix.md
          cat lql-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined matrix
        uses: actions/upload-artifact@v4
        with:
          name: lql-matrix
          retention-days: 1
          path: lql-matrix.md

  conformance:
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Run conformance oracle
        env:
          STRICT_INPUT: ${{ github.event.inputs.strict }}
        run: |
          STRICT=""
          [ "$STRICT_INPUT" = "true" ] && STRICT="--strict"
          python3 scripts/lql_matrix/conformance.py \
            "artifacts/results-*/results-*.jsonl" conformance.md conformance.json $STRICT
          echo "=== conformance.md ==="; cat conformance.md
          cat conformance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          retention-days: 1
          path: |
            conformance.md
            conformance.json

  inventory:
    needs: [matrix, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Tensor-presence + Q8 resolution
        run: |
          python3 scripts/lql_matrix/tensor_presence.py \
            "artifacts/results-*/manifest-*/listing.json" presence.json
          python3 - <<'PY'
          import json, glob, sys
          sys.path.insert(0, "scripts/lql_matrix")
          import tensor_presence as T
          pres = json.load(open("presence.json"))
          cj = glob.glob("artifacts/conformance/conformance.json")
          violations = json.load(open(cj[0]))["violations"] if cj else None
          res = T.render_q8(pres, violations, native_only=True)
          json.dump(res, open("q8.json", "w"), indent=2)
          md = T.q8_markdown(res)
          open("q8.md", "w", encoding="utf-8").write(md)
          print(md)
          PY
          cat q8.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory
          retention-days: 1
          path: |
            presence.json
            q8.json
            q8.md

  # #[ignore]d tests that need a real artifact, run against the SmolLM2-135M
  # (Apache-2.0) vindexes this workflow just produced:
  #   - self-consistency tests: each compares two computations on the SAME
  #     artifact, so any admissible model qualifies and a failure is a defect;
  #   - a negative control: the Mistral-7B-v0.1 goldens pointed at SmolLM2.
  #     A golden that a mismatched model passes cannot discriminate, so this
  #     must fail — and on the golden's own assertion, not on loading.
  # Release profile: the test profile is unoptimised and these run real
  # forward passes. Paths are absolute because cargo runs each test binary
  # from its crate's directory.
  real-artifact-tests:
    needs: matrix
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ART: ${{ github.workspace }}/art
      CARGO_TEST: cargo test --release --no-default-features
    steps:
      - uses: actions/checkout@v6
      - name: Install BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Cache cargo deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-realart-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-realart-release-
      - uses: actions/download-artifact@v4
        with: { name: vindex-smol135base.v3, path: art/smol135base.v3 }
      - uses: actions/download-artifact@v4
        with: { name: vindex-smol135base.native.all, path: art/smol135base.native.all }
      - uses: actions/download-artifact@v4
        with: { name: vindex-smol135base.xform.q4k, path: art/smol135base.xform.q4k }
      - name: Build test binaries
        run: $CARGO_TEST -p larql-vindex -p larql-inference --no-run

      - name: V3 — batched and stepped attention bit-identical (LARQL_V3_CONTAINER)
        id: v3_kv
        continue-on-error: true
        env: { LARQL_V3_CONTAINER: "${{ github.workspace }}/art/smol135base.v3" }
        run: $CARGO_TEST -p larql-vindex --lib -- --ignored --exact --nocapture format::vindex3::opplan::exec::tests::attention_kv_parity::real_container_batched_and_stepped_attention_agree_per_position
      - name: V3 — production and reference backends agree (LARQL_V3_CONTAINER)
        id: v3_carrier
        continue-on-error: true
        env: { LARQL_V3_CONTAINER: "${{ github.workspace }}/art/smol135base.v3" }
        run: $CARGO_TEST -p larql-vindex --lib -- --ignored --exact --nocapture format::vindex3::opplan::exec::tests::carrier_write_real::real_container_witnesses_and_capture_cost
      - name: V3 — recording does not change logits (LARQL_V3_CONTAINER)
        id: v3_record
        continue-on-error: true
        env: { LARQL_V3_CONTAINER: "${{ github.workspace }}/art/smol135base.v3" }
        run: $CARGO_TEST -p larql-inference --lib -- --ignored --exact --nocapture vindex3::tests::record::record_basics::s8_real_container_record_writes_and_replays
      - name: V3 — calibration matches direct recomputation (CAL1_CONTAINER)
        id: v3_cal
        continue-on-error: true
        env: { CAL1_CONTAINER: "${{ github.workspace }}/art/smol135base.v3" }
        run: $CARGO_TEST -p larql-vindex --lib -- --ignored --exact --nocapture format::vindex3::represent::calibration::tests::tests_basics::calibration_real_layer_inputs_match_independent_decode_observation
      - name: V2 — MEMIT single fact (LARQL_VINDEX_PATH, float weights)
        id: v2_memit
        continue-on-error: true
        env: { LARQL_VINDEX_PATH: "${{ github.workspace }}/art/smol135base.native.all" }
        run: $CARGO_TEST -p larql-inference --lib -- --ignored --exact --nocapture forward::memit::tests::run_memit_single_fact_produces_delta
      - name: V2 — generate (LARQL_VINDEX_PATH, Q4K)
        id: v2_generate
        continue-on-error: true
        env: { LARQL_VINDEX_PATH: "${{ github.workspace }}/art/smol135base.xform.q4k" }
        run: $CARGO_TEST -p larql-inference --lib -- --ignored --nocapture layer_graph::generate::tests::generate_

      - name: Negative control — Mistral-7B goldens against SmolLM2 must fail on the assertion
        id: negative
        continue-on-error: true
        run: |
          # The golden looks its vindex up by name; the variable name keeps the
          # dot from `mistral-7b-v0.1-q4k`, so it is set through env(1).
          expect_mismatch() {
            label=$1; marker=$2; shift 2
            set +e
            out=$(env "LARQL_VINDEX_MISTRAL_7B_V0.1_Q4K=$ART/smol135base.xform.q4k" \
                      LARQL_ARCH_STRICT=1 "$@" 2>&1)
            ec=$?
            set -e
            echo "$out"
            if [ "$ec" -eq 0 ]; then
              echo "::error::$label: SmolLM2 PASSED a Mistral golden — the golden does not discriminate"
              return 1
            fi
            if echo "$out" | grep -qE "$marker"; then
              echo "$label: failed on the golden's assertion, as a negative control must"
              { echo "### $label (SmolLM2 against the Mistral pin)"; echo '```'
                echo "$out" | grep -E -A4 "$marker"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "::error::$label: failed, but not on the golden's assertion (a load or run failure)"
            return 1
          }
          rc=0
          expect_mismatch logits_golden_mistral_7b_cpu "top-5 set mismatch|top-1 logit drift" \
            $CARGO_TEST -p larql-inference --test test_logits_goldens -- --ignored --exact --nocapture logits_golden_mistral_7b_cpu || rc=1
          expect_mismatch arch_mistral_7b_cpu "does not contain expected substring" \
            $CARGO_TEST -p larql-inference --test test_arch_golden -- --ignored --exact --nocapture arch_mistral_7b_cpu || rc=1
          exit $rc

      - name: Report + fail loud if any check failed
        if: always()
        run: |
          {
            echo "## Real-artifact tests (SmolLM2-135M vindexes from this run)"
            echo "| check | outcome |"
            echo "|---|---|"
            echo "| V3 attention batched = stepped | ${{ steps.v3_kv.outcome }} |"
            echo "| V3 production = reference backend | ${{ steps.v3_carrier.outcome }} |"
            echo "| V3 recording leaves logits unchanged | ${{ steps.v3_record.outcome }} |"
            echo "| V3 calibration = direct recomputation | ${{ steps.v3_cal.outcome }} |"
            echo "| V2 MEMIT single fact | ${{ steps.v2_memit.outcome }} |"
            echo "| V2 generate (Q4K) | ${{ steps.v2_generate.outcome }} |"
            echo "| negative control: Mistral goldens reject SmolLM2 | ${{ steps.negative.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          for o in "${{ steps.v3_kv.outcome }}" "${{ steps.v3_carrier.outcome }}" \
                   "${{ steps.v3_record.outcome }}" "${{ steps.v3_cal.outcome }}" \
                   "${{ steps.v2_memit.outcome }}" "${{ steps.v2_generate.outcome }}" \
                   "${{ steps.negative.outcome }}"; do
            [ "$o" = success ] || exit 1
          done

  # The expected-model arm of the Mistral goldens: the same two tests against
  # the real mistralai/Mistral-7B-v0.1 (Apache-2.0), so the pass here and the
  # SmolLM2 failure above can be compared. Opt-in: the checkpoint is ~14.5 GB
  # on a runner with ~14 GB free, so the preinstalled SDKs are removed first.
  # The file notes the non-gemma3 pins may predate an lm_head path change; a
  # failure here may be a stale pin, and its text says which kind it is.
  mistral-expected-goldens:
    needs: build
    if: github.event.inputs.include_mistral7b == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VINDEX: ${{ github.workspace }}/mistral-7b-v0.1-q4k.vindex
      CARGO_TEST: cargo test --release --no-default-features
    steps:
      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: larql-bin
          path: bin
      - name: Prep
        run: |
          chmod +x bin/larql
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download mistralai/Mistral-7B-v0.1 (safetensors only)
        run: |
          python -m pip install --quiet huggingface_hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('mistralai/Mistral-7B-v0.1', allow_patterns=['*.safetensors','*.json','tokenizer.model'])"
          df -h /
      - name: Extract mistral-7b-v0.1-q4k
        run: |
          /usr/bin/time -v ./bin/larql extract mistralai/Mistral-7B-v0.1 -o "$VINDEX" --quant q4k
          du -sh "$VINDEX"
      - name: Drop the checkpoint before building tests
        run: |
          rm -rf ~/.cache/huggingface
          df -h /
      - name: Mistral goldens against the real model (must pass)
        run: |
          rc=0
          env "LARQL_VINDEX_MISTRAL_7B_V0.1_Q4K=$VINDEX" LARQL_ARCH_STRICT=1 \
            $CARGO_TEST -p larql-inference --test test_logits_goldens -- --ignored --exact --nocapture logits_golden_mistral_7b_cpu || rc=1
          env "LARQL_VINDEX_MISTRAL_7B_V0.1_Q4K=$VINDEX" LARQL_ARCH_STRICT=1 \
            $CARGO_TEST -p larql-inference --test test_arch_golden -- --ignored --exact --nocapture arch_mistral_7b_cpu || rc=1
          exit $rc
