# Smoke test for the goose-larql VM-boundary HARNESS ITSELF — validates the
# CI-specific plumbing (virt-customize baking, cloud-init instance-id
# semantics, QEMU/KVM boot, serial-console marker capture) using STUB
# `larql`/`goose` binaries, so it needs no real Rust build and no real model.
# Runs in a few minutes. Mirrors the pure-path-filter (not branch-name)
# convention this repo actually uses elsewhere (shannon-verify.yml): trigger
# on push/PR to main scoped by path, plus workflow_dispatch for manual runs.
# All work for this project lives on one branch (feat/larql-goose-selfplay)
# with one PR, not one branch per workflow.
name: goose-larql-vm-smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goose-larql-vm-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/goose-larql-vm-smoke.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Confirm KVM acceleration (prerequisite for everything below)
        run: |
          ls -la /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker
          sudo kvm-ok
          # /dev/kvm is root:kvm 660 by default; the runner's own user isn't
          # necessarily in the kvm group even though the device exists --
          # confirmed empirically ("Permission denied" initializing kvm).
          sudo chmod 666 /dev/kvm

      - name: Install VM toolchain
        run: |
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils libguestfs-tools
          # NOT installing passt: confirmed empirically it fails at runtime
          # on this exact runner regardless ("passt exited with status 1"
          # even with the package present) -- worked around via
          # virt-customize --no-network below instead of chasing that bug.

      - name: Build stub larql + stub goose
        run: |
          mkdir -p stub
          cat > stub/larql <<'STUB'
          #!/usr/bin/env bash
          if [ "$1" = "chat" ]; then
            echo "larql chat -- stub-vindex (Ctrl-D to exit)" >&2
            printf '> ' >&2
            read -r prompt
            echo " stub continuation for: ${prompt}"
          fi
          STUB
          chmod +x stub/larql

          cat > stub/goose <<'STUB'
          #!/usr/bin/env bash
          # Minimal stand-in: just proves the smoke workflow's bake+boot+run
          # plumbing works end to end, independent of a real goose build.
          if [ "$1" = "--version" ]; then echo "goose 0.0.0-smoke"; exit 0; fi
          if [ "$1" = "run" ]; then
            echo "stub goose ran with provider=${GOOSE_PROVIDER:-unset} model=${GOOSE_MODEL:-unset}"
            exit 0
          fi
          STUB
          chmod +x stub/goose

      - name: Download base cloud image
        run: |
          curl -fL -o /tmp/base.qcow2 https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2

      - name: Bake stub binaries into an overlay
        run: |
          qemu-img create -f qcow2 -b /tmp/base.qcow2 -F qcow2 overlay.qcow2 4G
          # --no-network: this bake needs no guest network at all
          # (copy-in/mkdir/chmod/ln are all local filesystem ops), and
          # libguestfs's passt-based appliance networking fails outright
          # on this runner regardless of whether passt is installed
          # (confirmed empirically: "passt exited with status 1" even
          # with the package present) -- sidestep it rather than debug
          # passt itself, since nothing here actually needs it.
          sudo virt-customize --no-network -a overlay.qcow2 \
            --mkdir /opt/stub-data \
            --copy-in stub/larql:/opt/stub-data \
            --copy-in stub/goose:/opt/stub-data \
            --chmod 0755:/opt/stub-data/larql \
            --chmod 0755:/opt/stub-data/goose \
            --run-command 'ln -sf /opt/stub-data/larql /usr/local/bin/larql' \
            --run-command 'ln -sf /opt/stub-data/goose /usr/local/bin/goose'

      - name: Write cloud-init seed
        run: |
          cat > user-data <<'EOF'
          #cloud-config
          write_files:
            - path: /root/run_smoke.sh
              permissions: '0755'
              content: |
                #!/bin/bash
                set -u
                out=$(GOOSE_PROVIDER=local GOOSE_MODEL=smoke-model /usr/local/bin/goose run --text "hello")
                echo "=== SMOKE OUTPUT ===" > /dev/console
                echo "$out" > /dev/console
                echo "=== SMOKE DONE ===" > /dev/console
                echo "SMOKE_TEST_DONE_MARKER" > /dev/console
                poweroff
          runcmd:
            - /root/run_smoke.sh
          EOF
          cat > meta-data <<'EOF'
          instance-id: smoke-01
          local-hostname: smoke-vm
          EOF
          cloud-localds seed.iso user-data meta-data

      - name: Boot and run
        run: |
          timeout 180 qemu-system-x86_64 \
            -enable-kvm -m 1024M -smp 1 -cpu host \
            -drive file=overlay.qcow2,if=virtio \
            -drive file=seed.iso,if=virtio,format=raw \
            -display none -serial file:console.log -no-reboot

      - name: Assert the marker and expected stub output appear
        run: |
          echo "=== console.log (tail) ==="
          tail -100 console.log
          grep -q "SMOKE_TEST_DONE_MARKER" console.log
          grep -q "stub goose ran with provider=local model=smoke-model" console.log
          echo "SMOKE PASSED"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goose-larql-vm-smoke
          retention-days: 1
          path: |
            console.log
            user-data
            meta-data
