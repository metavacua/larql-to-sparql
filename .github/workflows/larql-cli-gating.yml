name: larql-cli-gating

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `larql-cli` runs as its own job below (`wasm32v1-none-cli`), gated
  # on this one via `needs:`. It's the root of the whole dependency
  # graph -- every other crate here is one of its transitive deps -- so
  # there is no scenario where its own (slowest, 2-5 minute) legs tell
  # you anything a dependency's failure wouldn't already tell you
  # faster. Running it unconditionally alongside everything else (the
  # old flat matrix) meant every round paid its full wall-clock cost
  # even when a leaf/branch crate had already failed and made the round
  # moot. `needs:` + GitHub's default skip-on-fail is the whole
  # mechanism: no `if:`, no custom logic.
  #
  # `larql-cli` stays IN the `crate:` list (rather than being omitted)
  # and is removed via `exclude:` instead -- `exclude` matches
  # partially, on whichever keys it specifies (confirmed against
  # GitHub's own docs: a 2-of-3-axis exclude entry there matches both
  # values of the omitted third axis), so `- crate: larql-cli` alone
  # removes it across every os/features combination. This is the
  # pattern that has to survive into the dynamic-tier design (task #33,
  # see the plan doc): once `crate:` comes from
  # `fromJSON(needs.discover.outputs.crates)` instead of a hand-edited
  # array, there's no line to delete -- `exclude:` is the only
  # declarative way to carve one crate out of a dynamically-populated
  # list.
  wasm32v1-none:
    name: wasm32v1-none / ${{ matrix.crate }} / ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        crate:
          - larql-cli
          - larql-core
          - larql-compute
          - larql-compute-metal
          - larql-inference
          - larql-kv
          - larql-models
          - larql-lql
          - larql-vindex
          - larql-vindex-spec
          - larql-factory
          # Discovered mid-campaign via pattern 8 (sibling-path-
          # dependency-not-yet-gated): these are transitive deps of
          # larql-kv/larql-vindex/larql-inference/larql-cli that weren't
          # in the original matrix. Without a direct leg, a green
          # larql-kv leg would be the only signal that these three are
          # actually correct -- adding them here gives each an isolated
          # result instead of an inferred one.
          - larql-boundary
          - larql-execution
          - larql-router-protocol
        features: [default, no-default-features]
        exclude:
          - crate: larql-cli
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # No OpenBLAS install here (unlike forbid-unsafe below): every BLAS
      # dependency in this workspace is gated behind
      # cfg(target_os = "linux"/"macos"/"windows"), and wasm32v1-none's
      # target_os is "none" -- confirmed via `cargo tree --target
      # wasm32v1-none -e normal,build -p <crate>` showing no openblas-src
      # in the graph for any of the 11 matrixed crates. Installing it here
      # would be pure dead time on every one of the 66 legs.

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p ${{ matrix.crate }} --no-default-features
          else
            cargo build --target wasm32v1-none -p ${{ matrix.crate }}
          fi

  # larql-cli's own wasm32 leg, split out of the matrix above and gated
  # behind it -- see the comment on `wasm32v1-none` for why.
  wasm32v1-none-cli:
    name: wasm32v1-none / larql-cli / ${{ matrix.os }} / ${{ matrix.features }}
    needs: wasm32v1-none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p larql-cli --no-default-features
          else
            cargo build --target wasm32v1-none -p larql-cli
          fi

  forbid-unsafe:
    name: forbid-unsafe / larql-cli / ${{ matrix.os }} / ${{ matrix.features }}
    needs: wasm32v1-none-cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install openblas:x64-windows

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-forbid-unsafe-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-forbid-unsafe-

      - name: cargo build (forbid unsafe_code)
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build -p larql-cli --no-default-features
          else
            cargo build -p larql-cli
          fi
