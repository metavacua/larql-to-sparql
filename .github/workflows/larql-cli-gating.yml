name: larql-cli-gating

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OS is the outer ordering axis, crate-dependency is the inner one --
  # ubuntu + wasm32v1-none is the absolute first thing that runs, for
  # everything. Only once the entire ubuntu wave clears does anything
  # on windows/macos start; only once windows/macos clear for the
  # dependencies does larql-cli (the root) get its turn; forbid-unsafe
  # is last. Every hop below is a plain `needs:` -- GitHub's default
  # skip-on-fail does all the pruning, no `if:` anywhere.
  #
  # `larql-compute-metal` has no ubuntu (or windows) leg at all -- Metal
  # doesn't exist off macOS -- so it gets its own job (`wasm32v1-none-metal`)
  # rather than a `crate:` entry here. It still `needs:` the ubuntu wave
  # below rather than running concurrently with it: ubuntu+wasm32v1-none
  # is meant to be a single global checkpoint everything else funnels
  # through, not a per-crate-only gate.
  wasm32v1-none-ubuntu:
    name: wasm32v1-none / ${{ matrix.crate }} / ubuntu-latest / ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        crate:
          - larql-core
          - larql-compute
          - larql-inference
          - larql-kv
          - larql-models
          - larql-lql
          - larql-vindex
          - larql-vindex-spec
          - larql-factory
          # Discovered mid-campaign via pattern 8 (sibling-path-
          # dependency-not-yet-gated): these are transitive deps of
          # larql-kv/larql-vindex/larql-inference/larql-cli that weren't
          # in the original matrix. Without a direct leg, a green
          # larql-kv leg would be the only signal that these three are
          # actually correct -- adding them here gives each an isolated
          # result instead of an inferred one.
          - larql-boundary
          - larql-execution
          - larql-router-protocol
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      # No OpenBLAS install here (unlike forbid-unsafe below): every BLAS
      # dependency in this workspace is gated behind
      # cfg(target_os = "linux"/"macos"/"windows"), and wasm32v1-none's
      # target_os is "none" -- confirmed via `cargo tree --target
      # wasm32v1-none -e normal,build -p <crate>` showing no openblas-src
      # in the graph for any of the matrixed crates. Installing it here
      # would be pure dead time on every leg.

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p ${{ matrix.crate }} --no-default-features
          else
            cargo build --target wasm32v1-none -p ${{ matrix.crate }}
          fi

  # Same 12 crates, windows + macos -- gated on the ubuntu wave above
  # clearing in full.
  wasm32v1-none-others:
    name: wasm32v1-none / ${{ matrix.crate }} / ${{ matrix.os }} / ${{ matrix.features }}
    needs: wasm32v1-none-ubuntu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        crate:
          - larql-core
          - larql-compute
          - larql-inference
          - larql-kv
          - larql-models
          - larql-lql
          - larql-vindex
          - larql-vindex-spec
          - larql-factory
          - larql-boundary
          - larql-execution
          - larql-router-protocol
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p ${{ matrix.crate }} --no-default-features
          else
            cargo build --target wasm32v1-none -p ${{ matrix.crate }}
          fi

  # larql-compute-metal: macOS-only, no ubuntu/windows leg exists for
  # it. Still gated on the ubuntu wave (see the top-level comment) even
  # though it has no ubuntu leg of its own.
  wasm32v1-none-metal:
    name: wasm32v1-none / larql-compute-metal / macos-14 / ${{ matrix.features }}
    needs: wasm32v1-none-ubuntu
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p larql-compute-metal --no-default-features
          else
            cargo build --target wasm32v1-none -p larql-compute-metal
          fi

  # larql-cli (the root) on ubuntu -- gated on every dependency's
  # windows/macos legs AND the metal leg, since larql-cli's default
  # feature set (`gpu`) pulls in larql-compute-metal.
  wasm32v1-none-cli-ubuntu:
    name: wasm32v1-none / larql-cli / ubuntu-latest / ${{ matrix.features }}
    needs: [wasm32v1-none-others, wasm32v1-none-metal]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p larql-cli --no-default-features
          else
            cargo build --target wasm32v1-none -p larql-cli
          fi

  # larql-cli on windows + macos -- gated on its own ubuntu leg above.
  wasm32v1-none-cli-others:
    name: wasm32v1-none / larql-cli / ${{ matrix.os }} / ${{ matrix.features }}
    needs: wasm32v1-none-cli-ubuntu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32v1-none-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm32v1-none-

      - name: cargo build --target wasm32v1-none
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build --target wasm32v1-none -p larql-cli --no-default-features
          else
            cargo build --target wasm32v1-none -p larql-cli
          fi

  forbid-unsafe:
    name: forbid-unsafe / larql-cli / ${{ matrix.os }} / ${{ matrix.features }}
    needs: wasm32v1-none-cli-others
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        features: [default, no-default-features]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install openblas:x64-windows

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-forbid-unsafe-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-forbid-unsafe-

      - name: cargo build (forbid unsafe_code)
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-default-features" ]; then
            cargo build -p larql-cli --no-default-features
          else
            cargo build -p larql-cli
          fi
