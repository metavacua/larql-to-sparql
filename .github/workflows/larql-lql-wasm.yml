# larql-lql WASM CI
#
# Tests the parser and lexer on wasm32-unknown-unknown via wasm-pack.
# The parser and lexer are pure text-to-AST transformations with no I/O;
# they run on wasm32 without modification.
#
# Executor, REPL, HTTP-backend, and stats tests are already gated with
# #[cfg(not(target_arch = "wasm32"))] in source and are excluded automatically.
#
# mockito and criterion dev-dependencies are gated to non-wasm32 in
# Cargo.toml to avoid pulling tokio/mio into the wasm32 dep graph.

name: larql-lql-wasm

on:
#  push:
#    branches: [main]
#    paths:
#      - 'crates/larql-lql/**'
#      - 'crates/larql-inference/**'
#      - 'crates/larql-vindex/**'
#      - 'crates/larql-compute/**'
#      - 'Cargo.toml'
#      - 'Cargo.lock'
#      - '.github/workflows/larql-lql-wasm.yml'
#  pull_request:
#    types: [opened, synchronize, reopened, ready_for_review]
#    branches: [main]
#    paths:
#      - 'crates/larql-lql/**'
#      - 'crates/larql-inference/**'
#      - 'crates/larql-vindex/**'
#      - 'crates/larql-compute/**'
#      - 'Cargo.toml'
#      - 'Cargo.lock'
#      - '.github/workflows/larql-lql-wasm.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: wasm · ${{ matrix.mode.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: serial
            toolchain: stable
            rustflags: ''
          - name: parallel
            toolchain: nightly
            rustflags: '-C target-feature=+atomics,+bulk-memory,+mutable-globals'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (${{ matrix.mode.toolchain }}) + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.mode.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install geckodriver
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/mozilla/geckodriver/releases/latest \
            | grep '"tag_name"' | head -1 | sed -E 's/.*"(v[^"]+)".*/\1/')
          curl -fsSL "https://github.com/mozilla/geckodriver/releases/download/${VER}/geckodriver-${VER}-linux64.tar.gz" \
            | sudo tar xz -C /usr/local/bin/

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm32-cargo-lql-${{ matrix.mode.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm32-cargo-lql-${{ matrix.mode.name }}-

      - name: Format check
        run: cargo fmt -p larql-lql -- --check

      - name: Check
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo check -p larql-lql --target wasm32-unknown-unknown --no-default-features

      - name: Clippy
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo clippy -p larql-lql --target wasm32-unknown-unknown --no-default-features -- -D warnings

      - name: cargo test · wasm32 (dynamic)
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo test -p larql-lql --target wasm32-unknown-unknown

      - name: cargo test · wasm32 · firefox (static)
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo test -p larql-lql --target wasm32-unknown-unknown --features browser-tests
