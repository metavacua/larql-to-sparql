# Experiment: can any of larql-cli's dependency-tree crates be made to
# actually compile against nvptx64-nvidia-cuda, given std itself is
# categorically unavailable there (confirmed: -Zbuild-std=std fails with 15
# errors, no Os::Cuda branch in libstd's sys layer -- see
# experiment-cuda-nvptx.yml)?
#
# Scoped to the 5 crates in larql-cli's dependency tree confirmed to have
# ZERO real native-link blockers (openssl-sys/protobuf-src/onig_sys/ring),
# via source-verified build.rs inspection, not `links`-field presence alone
# -- see deny-nvptx.toml: larql-models, larql-compute, larql-boundary,
# larql-vindex-spec, larql-execution. The other 8 in-scope crates have at
# least one confirmed-real native-toolchain wall that no source change could
# ever address, so attempting a no_std conversion on them would just hit a
# permanent, unrelated blocker -- not informative for this question.
#
# Three-stage pipeline per crate, run entirely within one ephemeral CI
# checkout (nothing committed or pushed -- ${{ matrix.crate }}'s lib.rs gets
# mutated on the runner's own disposable copy only):
#
#   Stage A (host target): mechanical `std::X` -> `core::X`/`alloc::X`
#   rewrite via `cargo clippy --fix` with std_instead_of_core /
#   std_instead_of_alloc / alloc_instead_of_core. Has to run on the HOST
#   target: rustc can't resolve a `std::` path at all once the sysroot is
#   core+alloc-only, so clippy never gets far enough to suggest a rewrite
#   under -Zbuild-std=core,alloc -- the crate has to type-check against real
#   std first for the fixer to have anything to work with.
#
#   Stage B: scaffold `#![no_std]` + `extern crate alloc;` onto the now
#   mechanically-rewritten lib.rs. Cannot be skipped: without it, the crate
#   still implicitly pulls in the std prelude regardless of how many
#   explicit std:: paths got rewritten, and would fail identically to the
#   plain std wall.
#
#   Stage C (nvptx64-nvidia-cuda target, -Zbuild-std=core,alloc): the ONLY
#   stage that can produce honest dead_code / unused_imports /
#   unused_variables / unsafe_code / improper_ctypes signals for this
#   target. Those lints are per-compilation, not per-source-text -- what's
#   dead or requires unsafe on host is not necessarily the same as on
#   nvptx, and a host-target lint pass is blind to both directions of that
#   difference. Deliberately does NOT reuse Stage A's host lint results for
#   these categories.
#
# Two fix profiles per crate (10 jobs total), fail-fast disabled:
#   mechanical-only        -- Stage A + B + C, nothing else.
#   mechanical-plus-hygiene -- adds a host-side, pre-nvptx deny check for
#     print_stdout/print_stderr/exit/dbg_macro: none of these have a
#     core/alloc replacement (there's no such thing as "core stdout"), so
#     they can't be mechanically fixed by Stage A. Catching them as denied
#     errors on host is cheap and immediate, rather than waiting to
#     rediscover them as opaque unresolved-item errors in Stage C.
#
# GitHub-hosted runner time costs nothing at this project's tier -- nothing
# here is scoped down for speed.
#
# One known gap this pipeline does NOT close, by design: std::collections::
# HashMap/HashSet have no core equivalent at all (no lint fires -- there's
# no "use core instead" to suggest, alloc doesn't have a hasher without an
# OS randomness source either), so any crate using them will still fail in
# Stage C even after a clean Stage A/B -- confirmed present in 3 of the 5
# candidate crates by direct grep before this workflow was written. That
# failure IS the informative signal Stage C exists to produce, not a bug in
# the pipeline.

name: experiment-cuda-nvptx-nostd-fix

on:
  workflow_dispatch: {}
  push:
    branches: [experiment/cuda-nvptx-lint-build]

jobs:
  nostd-fix-attempt:
    name: no_std fix attempt (${{ matrix.crate }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - larql-models
          - larql-compute
          - larql-boundary
          - larql-vindex-spec
          - larql-execution
        profile: [mechanical-only, mechanical-plus-hygiene]
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools

      - name: Install llvm-bitcode-linker
        run: rustup component add llvm-bitcode-linker --toolchain nightly

      # Stage A -- host target, mechanical rewrite only.
      - name: "Stage A: mechanical std->core/alloc rewrite (host target)"
        run: |
          cargo +nightly clippy -p ${{ matrix.crate }} --lib --fix --allow-dirty --allow-staged -- \
            -W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core

      # mechanical-plus-hygiene profile only: cheap host-side check for the
      # std APIs that have no core/alloc replacement to mechanically fix to.
      - name: "Stage A2: hygiene deny check (host target, mechanical-plus-hygiene only)"
        if: matrix.profile == 'mechanical-plus-hygiene'
        id: hygiene
        continue-on-error: true
        run: |
          cargo +nightly clippy -p ${{ matrix.crate }} --lib --message-format=json -- \
            -D clippy::print_stdout -D clippy::print_stderr -D clippy::exit -D clippy::dbg_macro > hygiene.json

      - name: "Stage B: inject #![no_std] scaffold"
        run: |
          LIB="crates/${{ matrix.crate }}/src/lib.rs"
          printf '#![no_std]\nextern crate alloc;\n%s\n' "$(cat "$LIB")" > "$LIB.new"
          mv "$LIB.new" "$LIB"

      # Stage C -- the only stage whose dead_code/unused_*/unsafe_code
      # signal is honest for this target. -D on the mechanical lints too:
      # anything Stage A's fixer couldn't rewrite becomes a visible, named
      # error here instead of an opaque unresolved-path error.
      - name: "Stage C: target-relative check against nvptx64-nvidia-cuda"
        id: nostd_check
        continue-on-error: true
        run: |
          RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly clippy -p ${{ matrix.crate }} --lib \
            --target nvptx64-nvidia-cuda -Zbuild-std=core,alloc --keep-going --message-format=json -- \
            -W dead_code -W unused_imports -W unused_variables -W unsafe_code \
            -W improper_ctypes -W improper_ctypes_definitions \
            -D clippy::std_instead_of_core -D clippy::std_instead_of_alloc > nostd_check.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.crate }} / ${{ matrix.profile }}"
            if [ -f hygiene.json ]; then
              echo "#### Stage A2 (host hygiene) findings"
              echo '```'
              jq -r 'select(.reason=="compiler-message") | .message.rendered' hygiene.json 2>/dev/null
              echo '```'
            fi
            echo "#### Stage C (nvptx64-nvidia-cuda, core+alloc) result"
            echo '```'
            jq -r 'select(.reason=="compiler-message" and .message.level=="error") | .message.message' nostd_check.json 2>/dev/null \
              | sort | uniq -c | sort -rn
            echo '```'
            echo "<details><summary>Stage C rendered diagnostics</summary>"
            echo ''
            echo '```'
            jq -r 'select(.reason=="compiler-message") | .message.rendered' nostd_check.json 2>/dev/null
            echo '```'
            echo '</details>'
          } | tee -a "$GITHUB_STEP_SUMMARY"
