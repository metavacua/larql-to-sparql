# Experiment: clippy + build + test pipeline for larql-cli on nvptx64-nvidia-cuda.
#
# Same pattern as every other target job in this project: run clippy, build,
# and test against larql-cli itself, on the real target, and let it break --
# the breakage is the analysis data, not something to avoid or route around.
#
# Toolchain requirement, confirmed via doc.rust-lang.org and a local test
# build: nightly + `rust-src` + `llvm-tools` + `llvm-bitcode-linker`
# components, `-Zbuild-std` (this target ships no prebuilt std at all, for
# any crate).
#
# GPU execution is not available for free anywhere in GitHub Actions today
# (GitHub's GPU larger runners are billed per-minute, gated to paid
# Team/Enterprise org plans, no public-repo exemption; third-party services
# only make the orchestration free, not the GPU compute itself) -- so
# whatever the Test step actually reports (build failure, missing runner,
# or something else) is itself real signal about what a wasmtime-style
# cargo-test runner entry would need for this target, same spirit as the
# wasm jobs' `.cargo/config.toml` runner entries.

name: experiment-cuda-nvptx

on:
  workflow_dispatch: {}
  push:
    branches: [feat/larql-cli-target-sampling]

jobs:
  nvptx64-nvidia-cuda:
    name: nvptx64-nvidia-cuda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools

      - name: Install llvm-bitcode-linker
        run: rustup component add llvm-bitcode-linker --toolchain nightly

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly clippy -p larql-cli --bins --tests --no-default-features --no-deps --target nvptx64-nvidia-cuda -Zbuild-std=std -- -D warnings

      - name: Build
        id: build
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly build -p larql-cli --bins --no-default-features --target nvptx64-nvidia-cuda -Zbuild-std=std

      - name: Test
        id: test
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly test -p larql-cli --no-default-features --target nvptx64-nvidia-cuda -Zbuild-std=std
