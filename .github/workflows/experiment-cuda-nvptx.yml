# Experiment: exhaustive clippy + build attempt, across every crate in
# larql-cli's own dependency tree, on nvptx64-nvidia-cuda -- same pattern as
# every other target job in this project -- run it and let it break, the
# breakage is the analysis data. Test/execution is deferred pending a
# separate decision on GPU/CUDA emulation for free-tier runners.
#
# Scoped to the crates actually reachable from larql-cli's own dependency
# graph -- confirmed against the real `cargo tree -p larql-cli` output from
# an actual CI run, not guessed: larql-boundary, larql-cli, larql-compute,
# larql-core, larql-execution, larql-factory, larql-inference, larql-kv,
# larql-lql, larql-models, larql-router-protocol, larql-vindex,
# larql-vindex-spec. The rest of the workspace (larql-server, larql-router,
# larql-python, larql-demos, larql-compute-metal, model-compute) is not part
# of larql-cli's dependency tree and is out of scope for this experiment.
#
# One job per feature-set (default / no-default), NOT one job per crate.
# An earlier iteration of this workflow matrixed per-crate too, spinning up
# 13 (or worse, 19 before scoping) separate jobs each repeating toolchain
# install + checkout + dependency resolution from scratch. That was
# duplicated effort for no real signal gain: `cargo build/clippy` already
# accepts multiple `-p` flags in one invocation, `--keep-going` already
# continues past one crate's failure to attempt every other independent
# crate in the same graph, and `--message-format=json` already tags every
# diagnostic with the exact package it came from. One combined invocation
# per feature-set gets the identical per-crate-attributable, exhaustive
# result as the 13-way fan-out, without repeating setup 13x.
#
# No job-level continue-on-error. An earlier iteration had it, which made
# every job report green regardless of whether Clippy/Build actually
# failed -- and coding agents are trained hard on green meaning "nothing to
# see here" and red meaning "look closer." A job that's always green
# regardless of real outcome trains exactly the wrong lesson, and a target
# that categorically doesn't build yet (this one) SHOULD read as red, since
# that's the true, correct, currently-expected state -- not something to be
# smoothed over into a checkmark. Clippy/Build keep step-level
# continue-on-error so both still run even if one fails outright, but the
# final "Assert honest result" step below has none, checks each step's real
# `outcome`, and deliberately fails the job if either genuinely failed --
# so the job's own conclusion tells the truth instead of being masked.
#
# GitHub-hosted runner time costs nothing at this project's tier, so nothing
# here is scoped down for speed; it's scoped down only to remove actual
# duplication (repeated setup) and actual irrelevance (crates outside
# larql-cli's own tree).
#
# Toolchain requirement, confirmed via doc.rust-lang.org and a local test
# build: nightly + `rust-src` + `llvm-tools` + `llvm-bitcode-linker`
# components, `-Zbuild-std` (this target ships no prebuilt std at all, for
# any crate).
#
# On its own branch, not feat/larql-cli-target-sampling: that branch backs
# open PR #293, so any push to it triggers pull_request:synchronize on
# every other CI workflow in the repo (larql-compute, larql-core, quality,
# shannon-verify, etc.), not just this one. Iterating here avoids that
# cascade entirely -- this branch has no open PR.

name: experiment-cuda-nvptx

on:
  workflow_dispatch: {}
  push:
    branches: [experiment/cuda-nvptx-lint-build]

jobs:
  nvptx64-nvidia-cuda:
    name: nvptx64-nvidia-cuda (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default]
    env:
      # Every crate actually reachable from larql-cli's own dependency
      # graph -- see header comment for how this list was derived.
      PKGS: >-
        -p larql-boundary -p larql-cli -p larql-compute -p larql-core
        -p larql-execution -p larql-factory -p larql-inference -p larql-kv
        -p larql-lql -p larql-models -p larql-router-protocol -p larql-vindex
        -p larql-vindex-spec
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools

      - name: Install llvm-bitcode-linker
        run: rustup component add llvm-bitcode-linker --toolchain nightly

      - name: Set feature flag
        id: feat
        run: |
          if [ "${{ matrix.features }}" = "no-default" ]; then
            echo "flag=--no-default-features" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Dependency resolution doesn't require a successful compile, so this
      # runs unconditionally and captures *why* each crate is in the graph
      # for this target -- e.g. reqwest's default `default-tls` feature
      # pulling in native-tls -> openssl-sys, which then fails to
      # cross-compile for a target with no host OpenSSL to link against.
      # Scoped from larql-cli's own root: its tree already contains every
      # other in-scope crate, so one dump covers the whole set.
      - name: Dependency graph for this target
        run: |
          {
            echo '```'
            cargo +nightly tree -p larql-cli ${{ steps.feat.outputs.flag }} --target nvptx64-nvidia-cuda -e normal,build,features
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Single invocation per tool, --message-format=json only: the JSON
      # stream's per-message "rendered" field already carries the exact same
      # human-readable text `--message-format=human` would print, and each
      # message carries the package_id it came from. Re-running the same
      # build a second time just to get human-formatted output would double
      # real compute for a rendering that's already sitting in the JSON.
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly clippy $PKGS --all-targets ${{ steps.feat.outputs.flag }} --target nvptx64-nvidia-cuda -Zbuild-std=std --keep-going --message-format=json -- -D warnings > clippy.json

      - name: Build
        id: build
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly build $PKGS --all-targets ${{ steps.feat.outputs.flag }} --target nvptx64-nvidia-cuda -Zbuild-std=std --keep-going --message-format=json > build.json

      # Per-crate pass/fail plus the rendered diagnostic text, both derived
      # from the same JSON stream captured above -- no second build needed.
      - name: Per-crate summary
        if: always()
        run: |
          {
            echo "### Per-crate result (${{ matrix.features }} features)"
            for f in clippy.json build.json; do
              [ -f "$f" ] || continue
              echo "#### $f -- error count by crate"
              echo '```'
              jq -r 'select(.reason=="compiler-message" and .message.level=="error") | .target.name' "$f" 2>/dev/null \
                | sort | uniq -c | sort -rn
              echo '```'
              echo "<details><summary>$f -- rendered diagnostics</summary>"
              echo ''
              echo '```'
              jq -r 'select(.reason=="compiler-message") | .message.rendered' "$f" 2>/dev/null
              echo '```'
              echo '</details>'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # No continue-on-error on this one: it's the only step allowed to
      # decide the job's real conclusion. Clippy/Build's own `outcome` (not
      # `conclusion` -- outcome is the pre-mask, honest result, and it's
      # only readable live within this same job, not after the fact via the
      # REST API) tells us whether either genuinely failed; if so, this step
      # fails for real and the job goes honestly red instead of being
      # smoothed over.
      - name: Assert honest result
        if: always()
        run: |
          if [ "${{ steps.clippy.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error::Clippy and/or Build genuinely failed for nvptx64-nvidia-cuda (${{ matrix.features }} features) -- see the per-crate summary above. This job is reporting that honestly, not masking it."
            exit 1
          fi
          echo "Clippy and Build both genuinely succeeded for nvptx64-nvidia-cuda (${{ matrix.features }} features)."
