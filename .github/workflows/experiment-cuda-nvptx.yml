# Experiment: exhaustive clippy + build attempt, across every crate in
# larql-cli's own dependency tree, on nvptx64-nvidia-cuda -- same pattern as
# every other target job in this project -- run it and let it break, the
# breakage is the analysis data. Test/execution is deferred pending a
# separate decision on GPU/CUDA emulation for free-tier runners.
#
# Scoped to the crates actually reachable from larql-cli's own dependency
# graph -- confirmed against the real `cargo tree -p larql-cli` output from
# an actual CI run, not guessed: larql-boundary, larql-cli, larql-compute,
# larql-core, larql-execution, larql-factory, larql-inference, larql-kv,
# larql-lql, larql-models, larql-router-protocol, larql-vindex,
# larql-vindex-spec. The rest of the workspace (larql-server, larql-router,
# larql-python, larql-demos, larql-compute-metal, model-compute) is not part
# of larql-cli's dependency tree and is out of scope for this experiment.
#
# One job per feature-set (default / no-default), NOT one job per crate.
# An earlier iteration of this workflow matrixed per-crate too, spinning up
# 13 (or worse, 19 before scoping) separate jobs each repeating toolchain
# install + checkout + dependency resolution from scratch. That was
# duplicated effort for no real signal gain: `cargo build/clippy` already
# accepts multiple `-p` flags in one invocation, `--keep-going` already
# continues past one crate's failure to attempt every other independent
# crate in the same graph, and `--message-format=json` already tags every
# diagnostic with the exact package it came from. One combined invocation
# per feature-set gets the identical per-crate-attributable, exhaustive
# result as the 13-way fan-out, without repeating setup 13x.
#
# No job-level continue-on-error. An earlier iteration had it, which made
# every job report green regardless of whether Clippy/Build actually
# failed -- and coding agents are trained hard on green meaning "nothing to
# see here" and red meaning "look closer." A job that's always green
# regardless of real outcome trains exactly the wrong lesson, and a target
# that categorically doesn't build yet (this one) SHOULD read as red, since
# that's the true, correct, currently-expected state -- not something to be
# smoothed over into a checkmark. Clippy/Build keep step-level
# continue-on-error so both still run even if one fails outright, but the
# final "Assert honest result" step below has none, checks each step's real
# `outcome`, and deliberately fails the job if either genuinely failed --
# so the job's own conclusion tells the truth instead of being masked.
#
# GitHub-hosted runner time costs nothing at this project's tier, so nothing
# here is scoped down for speed; it's scoped down only to remove actual
# duplication (repeated setup) and actual irrelevance (crates outside
# larql-cli's own tree).
#
# Toolchain requirement, confirmed via doc.rust-lang.org and a local test
# build: nightly + `rust-src` + `llvm-tools` + `llvm-bitcode-linker`
# components, `-Zbuild-std` (this target ships no prebuilt std at all, for
# any crate).
#
# On its own branch, not feat/larql-cli-target-sampling: that branch backs
# open PR #293, so any push to it triggers pull_request:synchronize on
# every other CI workflow in the repo (larql-compute, larql-core, quality,
# shannon-verify, etc.), not just this one. Iterating here avoids that
# cascade entirely -- this branch has no open PR.

name: experiment-cuda-nvptx

on:
  workflow_dispatch: {}
  push:
    branches: [experiment/cuda-nvptx-lint-build]

jobs:
  # Narrow, isolated question: does ANY serde feature combination compile
  # cleanly against nvptx64-nvidia-cuda under -Zbuild-std=core,alloc? Found
  # by tracing the real Stage C error for larql-boundary (a single-serde-
  # dependency crate) to its actual source location: serde_core-1.0.228's
  # own de::value.rs references bare Result/Option without importing them
  # -- not larql-boundary's own code, and not fixed by the
  # default-features=false + ["derive","alloc"] combo already tried
  # (Stage B2). Isolated in a throwaway probe crate rather than tested via
  # larql-boundary/vindex-spec/models/compute directly, specifically to
  # separate "does serde itself support this target" from "does our own
  # scaffold/patch pipeline work" -- those are different questions, and
  # conflating them was exactly what made the first diagnosis (this
  # session's serde-default-features theory) only half right.
  serde-nostd-probe:
    name: "serde no_std probe (features: ${{ matrix.serde_features }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        serde_features: ['alloc', 'derive,alloc']
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools

      - name: Install llvm-bitcode-linker
        run: rustup component add llvm-bitcode-linker --toolchain nightly

      - name: Scaffold probe crate
        run: |
          mkdir -p /tmp/serde-probe/src
          IFS=',' read -ra FEATS <<< "${{ matrix.serde_features }}"
          QUOTED=$(printf '"%s", ' "${FEATS[@]}")
          QUOTED="${QUOTED%, }"
          cat > /tmp/serde-probe/Cargo.toml << EOF
          [package]
          name = "serde-probe"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [lib]

          [dependencies]
          serde = { version = "1", default-features = false, features = [$QUOTED] }
          EOF
          # References serde::de::value directly rather than going through
          # #[derive] -- that's the exact module the real larql-boundary
          # failure traced back to (serde_core-1.0.228/src/de/value.rs),
          # so this tests the same code path regardless of whether the
          # "derive" feature is even present in this matrix cell.
          # A bare type reference is enough to force serde_core's de::value
          # module to actually compile -- deliberately not calling any
          # methods on it, since their exact signatures can't be verified
          # without a local compile, and a typo there would be
          # indistinguishable from a real target failure in the result.
          cat > /tmp/serde-probe/src/lib.rs << 'EOF'
          #![no_std]
          extern crate alloc;
          use serde::de::value::Error as ValueError;

          pub fn probe(e: ValueError) -> ValueError {
              e
          }
          EOF
          cat /tmp/serde-probe/Cargo.toml

      - name: Probe build against nvptx64-nvidia-cuda (core+alloc)
        id: probe
        continue-on-error: true
        working-directory: /tmp/serde-probe
        run: |
          RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly build --target nvptx64-nvidia-cuda -Zbuild-std=core,alloc --keep-going --message-format=json > probe.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### serde probe: features = [${{ matrix.serde_features }}]"
            echo '```'
            jq -r 'select(.reason=="compiler-message" and .message.level=="error") | .message.message' /tmp/serde-probe/probe.json 2>/dev/null \
              | sort | uniq -c | sort -rn
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert honest result
        if: always()
        run: |
          if [ "${{ steps.probe.outcome }}" = "failure" ]; then
            echo "::error::serde with features=[${{ matrix.serde_features }}] does not compile cleanly against nvptx64-nvidia-cuda under -Zbuild-std=core,alloc."
            exit 1
          fi
          echo "serde with features=[${{ matrix.serde_features }}] compiles cleanly against nvptx64-nvidia-cuda under -Zbuild-std=core,alloc."

  # Fast, pre-compile precondition checks: does the target-resolved
  # dependency graph contain anything already known to be a hard,
  # native-toolchain wall, and has anything NEW shown up that hasn't been
  # manually vetted yet? Runs once (not matrixed on features -- deny-nvptx.
  # toml uses all-features = true, and the native-link scan's results don't
  # meaningfully differ between default/no-default here, so running it
  # twice would just duplicate identical work, the same mistake fixed
  # earlier in this workflow for the human/JSON build output).
  nvptx-preconditions:
    name: nvptx64-nvidia-cuda preconditions (deny + native-link scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # deny-nvptx.toml explicitly bans openssl-sys, protobuf-src,
      # onig_sys, and ring for this target -- each confirmed as a real
      # native-compile/native-link dependency by reading its actual
      # build.rs (see deny-nvptx.toml's own header for why `links`
      # presence alone isn't trusted: rayon-core and prettyplease both
      # carry it with zero native compilation behind them). This is
      # expected to fail for as long as those crates remain in the graph --
      # that's the honest, correct signal, not a masked one.
      - name: cargo-deny bans check (nvptx-specific)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --config deny-nvptx.toml
          command: check
          command-arguments: bans

      - name: Install nightly Rust
        if: always()
        uses: dtolnay/rust-toolchain@nightly

      # Informational, not a hard gate: surfaces every crate in larql-cli's
      # resolved graph for this target that declares a `links` key, cross-
      # referenced against deny-nvptx.toml's curated, source-verified list.
      # Anything with `links` set that ISN'T already in that curated list is
      # a real candidate that hasn't been manually checked yet (read its
      # build.rs before trusting it either way -- `links` alone is not
      # sufficient evidence, confirmed the hard way earlier this session).
      #
      # `cargo metadata` has no -p/--package flag at all (confirmed via
      # `cargo metadata --help`) -- it always resolves the whole workspace
      # graph; there is no way to scope the command itself the way
      # build/clippy/tree can be scoped with -p. All scoping here comes
      # from the Python reachability traversal below, which walks real
      # dependency edges starting from the larql-cli root -- that's what
      # correctly excludes aws-lc-rs/aws-lc-sys (real dependencies of the
      # out-of-scope larql-python, not of larql-cli) even though they're
      # present in this same whole-workspace metadata dump.
      - name: Native-link dependency scan (candidates for manual verification)
        if: always()
        run: |
          cargo +nightly metadata --format-version=1 --filter-platform nvptx64-nvidia-cuda > meta.json
          {
            echo '### Native-link (`links` field) reachability from larql-cli'
            echo '```'
            python3 - << 'PYEOF'
          import json
          d = json.load(open("meta.json"))
          by_id = {n["id"]: n for n in d["resolve"]["nodes"]}
          pkgs = {p["id"]: p for p in d["packages"]}
          root = next(i for i in d["workspace_members"] if pkgs[i]["name"] == "larql-cli")
          confirmed_real = {"openssl-sys", "protobuf-src", "onig_sys", "ring"}
          confirmed_false_positive = {"rayon-core", "prettyplease"}
          seen, stack = set(), [root]
          while stack:
              cur = stack.pop()
              if cur in seen:
                  continue
              seen.add(cur)
              stack.extend(dep["pkg"] for dep in by_id[cur]["deps"])
          for i in sorted(seen, key=lambda i: pkgs[i]["name"]):
              p = pkgs[i]
              if not p.get("links"):
                  continue
              if p["name"] in confirmed_real:
                  tag = "banned in deny-nvptx.toml (build.rs verified: real native compile/link)"
              elif p["name"] in confirmed_false_positive:
                  tag = "NOT banned (build.rs verified: no real native compilation, links used only as a version-uniqueness guard)"
              else:
                  tag = "UNVETTED -- links field present, build.rs not yet manually checked. Read it before assuming either way."
              print(f"{p['name']} {p['version']} -> links: {p['links']}  [{tag}]")
          PYEOF
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  nvptx64-nvidia-cuda:
    name: nvptx64-nvidia-cuda (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: [default, no-default]
    env:
      # Every crate actually reachable from larql-cli's own dependency
      # graph -- see header comment for how this list was derived.
      PKGS: >-
        -p larql-boundary -p larql-cli -p larql-compute -p larql-core
        -p larql-execution -p larql-factory -p larql-inference -p larql-kv
        -p larql-lql -p larql-models -p larql-router-protocol -p larql-vindex
        -p larql-vindex-spec
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools

      - name: Install llvm-bitcode-linker
        run: rustup component add llvm-bitcode-linker --toolchain nightly

      - name: Set feature flag
        id: feat
        run: |
          if [ "${{ matrix.features }}" = "no-default" ]; then
            echo "flag=--no-default-features" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Dependency resolution doesn't require a successful compile, so this
      # runs unconditionally and captures *why* each crate is in the graph
      # for this target -- e.g. reqwest's default `default-tls` feature
      # pulling in native-tls -> openssl-sys, which then fails to
      # cross-compile for a target with no host OpenSSL to link against.
      #
      # Scoped with $PKGS, matching Clippy/Build exactly -- NOT `-p
      # larql-cli` alone. Those differ for the no-default case: cargo
      # applies --no-default-features to every explicitly-selected package
      # when multiple -p flags are given together, so the real Build/Clippy
      # invocation (13x -p) also strips larql-core's own default `http`
      # feature on the no-default run, while `-p larql-cli` alone only ever
      # strips larql-cli's own default `gpu` feature. A tree scoped to just
      # larql-cli would show a graph that doesn't match what Build/Clippy
      # actually attempted in the same job.
      - name: Dependency graph for this target
        run: |
          {
            echo '```'
            cargo +nightly tree $PKGS ${{ steps.feat.outputs.flag }} --target nvptx64-nvidia-cuda -e normal,build,features
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Single invocation per tool, --message-format=json only: the JSON
      # stream's per-message "rendered" field already carries the exact same
      # human-readable text `--message-format=human` would print, and each
      # message carries the package_id it came from. Re-running the same
      # build a second time just to get human-formatted output would double
      # real compute for a rendering that's already sitting in the JSON.
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly clippy $PKGS --all-targets ${{ steps.feat.outputs.flag }} --target nvptx64-nvidia-cuda -Zbuild-std=std --keep-going --message-format=json -- -D warnings > clippy.json

      - name: Build
        id: build
        continue-on-error: true
        run: RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly build $PKGS --all-targets ${{ steps.feat.outputs.flag }} --target nvptx64-nvidia-cuda -Zbuild-std=std --keep-going --message-format=json > build.json

      # Per-crate pass/fail plus the rendered diagnostic text, both derived
      # from the same JSON stream captured above -- no second build needed.
      #
      # Rendered-diagnostics dump capped at 200KB: GitHub's step summary has
      # a hard 1024KB limit and silently drops the ENTIRE summary if
      # exceeded (confirmed the hard way -- a later job in this same
      # workflow tried to upload ~5995KB and lost its whole summary, not
      # just the overflow). The full, untruncated JSON is uploaded as a
      # real artifact below specifically so nothing is actually lost to
      # this cap -- only the inline convenience view is capped.
      - name: Per-crate summary
        if: always()
        run: |
          {
            echo "### Per-crate result (${{ matrix.features }} features)"
            for f in clippy.json build.json; do
              [ -f "$f" ] || continue
              echo "#### $f -- error count by crate"
              echo '```'
              jq -r 'select(.reason=="compiler-message" and .message.level=="error") | .target.name' "$f" 2>/dev/null \
                | sort | uniq -c | sort -rn
              echo '```'
              echo "<details><summary>$f -- rendered diagnostics (capped at 200KB; full data in the uploaded artifact)</summary>"
              echo ''
              echo '```'
              jq -r 'select(.reason=="compiler-message") | .message.rendered' "$f" 2>/dev/null | head -c 200000
              echo '```'
              echo '</details>'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvptx-${{ matrix.features }}-diagnostics
          path: |
            clippy.json
            build.json
          if-no-files-found: ignore

      # No continue-on-error on this one: it's the only step allowed to
      # decide the job's real conclusion. Clippy/Build's own `outcome` (not
      # `conclusion` -- outcome is the pre-mask, honest result, and it's
      # only readable live within this same job, not after the fact via the
      # REST API) tells us whether either genuinely failed; if so, this step
      # fails for real and the job goes honestly red instead of being
      # smoothed over.
      - name: Assert honest result
        if: always()
        run: |
          if [ "${{ steps.clippy.outcome }}" = "failure" ] || [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error::Clippy and/or Build genuinely failed for nvptx64-nvidia-cuda (${{ matrix.features }} features) -- see the per-crate summary above. This job is reporting that honestly, not masking it."
            exit 1
          fi
          echo "Clippy and Build both genuinely succeeded for nvptx64-nvidia-cuda (${{ matrix.features }} features)."

  # Answers a narrower, answerable question given the std wall above: of
  # the 5 crates in larql-cli's tree with zero real native-link blockers
  # (larql-models, larql-compute, larql-boundary, larql-vindex-spec,
  # larql-execution -- see deny-nvptx.toml for how those were
  # source-verified), how far does each get toward actually compiling
  # under -Zbuild-std=core,alloc once mechanically rewritten and scaffolded
  # as no_std? The other 8 in-scope crates have a confirmed-real
  # native-toolchain wall no source change could ever address, so they're
  # excluded here -- not informative for this question.
  #
  # Kept as a job in this same workflow, not a separate file: no principled
  # reason exists to split it out (same trigger, same branch, same overall
  # investigation), and GitHub Actions job-to-job coordination (needs:,
  # one shared run view) only works within a single workflow file, not
  # across separate ones.
  #
  # Three-stage pipeline per crate, run entirely within one ephemeral CI
  # checkout (nothing committed or pushed -- ${{ matrix.crate }}'s lib.rs
  # gets mutated on the runner's own disposable copy only):
  #
  #   Stage A (host target): mechanical `std::X` -> `core::X`/`alloc::X`
  #   rewrite via `cargo clippy --fix` with std_instead_of_core /
  #   std_instead_of_alloc / alloc_instead_of_core. Has to run on the HOST
  #   target: rustc can't resolve a `std::` path at all once the sysroot is
  #   core+alloc-only, so clippy never gets far enough to suggest a rewrite
  #   under -Zbuild-std=core,alloc -- the crate has to type-check against
  #   real std first for the fixer to have anything to work with.
  #
  #   Stage B: scaffold `#![no_std]` + `extern crate alloc;` onto the now
  #   mechanically-rewritten lib.rs. Cannot be skipped: without it, the
  #   crate still implicitly pulls in the std prelude regardless of how
  #   many explicit std:: paths got rewritten, and would fail identically
  #   to the plain std wall.
  #
  #   Stage C (nvptx64-nvidia-cuda target, -Zbuild-std=core,alloc): the
  #   ONLY stage that can produce honest dead_code / unused_imports /
  #   unused_variables / unsafe_code / improper_ctypes signals for this
  #   target. Those lints are per-compilation, not per-source-text --
  #   what's dead or requires unsafe on host is not necessarily the same
  #   as on nvptx, and a host-target lint pass is blind to both directions
  #   of that difference. Deliberately does NOT reuse Stage A's host lint
  #   results for these categories.
  #
  # Two fix profiles per crate (10 jobs total), fail-fast disabled:
  #   mechanical-only        -- Stage A + B + C, nothing else.
  #   mechanical-plus-hygiene -- adds a host-side, pre-nvptx deny check for
  #     print_stdout/print_stderr/exit/dbg_macro: none of these have a
  #     core/alloc replacement (there's no such thing as "core stdout"), so
  #     they can't be mechanically fixed by Stage A. Catching them as
  #     denied errors on host is cheap and immediate, rather than waiting
  #     to rediscover them as opaque unresolved-item errors in Stage C.
  #
  # One known gap this pipeline does NOT close, by design: std::
  # collections::HashMap/HashSet have no core equivalent at all (no lint
  # fires -- there's no "use core instead" to suggest, alloc doesn't have a
  # hasher without an OS randomness source either), so any crate using them
  # will still fail in Stage C even after a clean Stage A/B -- confirmed
  # present in 3 of the 5 candidate crates by direct grep before this job
  # was written. That failure IS the informative signal Stage C exists to
  # produce, not a bug in the pipeline.
  nostd-fix-attempt:
    name: no_std fix attempt (${{ matrix.crate }}, ${{ matrix.profile }})
    needs: [nvptx-preconditions, nvptx64-nvidia-cuda]
    # needs: implies an implicit success() gate by default -- but
    # nvptx64-nvidia-cuda is EXPECTED to honestly fail (std doesn't build
    # for this target, confirmed, that's the correct current state), so
    # without this override this job would never run at all. !cancelled()
    # (not always()) still lets an actual user-initiated cancellation
    # propagate instead of spinning this job up anyway.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        crate:
          - larql-models
          - larql-compute
          - larql-boundary
          - larql-vindex-spec
          - larql-execution
        profile: [mechanical-only, mechanical-plus-hygiene]
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rust-src, llvm-tools

      - name: Install llvm-bitcode-linker
        run: rustup component add llvm-bitcode-linker --toolchain nightly

      # Stage A -- host target, mechanical rewrite only.
      - name: "Stage A: mechanical std->core/alloc rewrite (host target)"
        run: |
          cargo +nightly clippy -p ${{ matrix.crate }} --lib --fix --allow-dirty --allow-staged -- \
            -W clippy::std_instead_of_core -W clippy::std_instead_of_alloc -W clippy::alloc_instead_of_core

      # mechanical-plus-hygiene profile only: cheap host-side check for the
      # std APIs that have no core/alloc replacement to mechanically fix to.
      - name: "Stage A2: hygiene deny check (host target, mechanical-plus-hygiene only)"
        if: matrix.profile == 'mechanical-plus-hygiene'
        id: hygiene
        continue-on-error: true
        run: |
          cargo +nightly clippy -p ${{ matrix.crate }} --lib --message-format=json -- \
            -D clippy::print_stdout -D clippy::print_stderr -D clippy::exit -D clippy::dbg_macro > hygiene.json

      # Naive prepend broke files that start with their own `//!` module
      # doc comment (larql-execution: 48x "expected outer doc comment") --
      # inner attributes and inner doc comments may interleave freely at
      # the top of a file, but `extern crate alloc;` is a real item, and
      # once a real item appears, no further `//!` may follow it. Confirmed
      # by reading the actual crate sources before writing this fix, not
      # assumed. Inserted after the file's existing leading `//!`/`#![`/
      # blank-line block instead of before it.
      - name: "Stage B: inject #![no_std] scaffold"
        run: |
          LIB="crates/${{ matrix.crate }}/src/lib.rs"
          python3 - "$LIB" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              lines = f.readlines()
          i = 0
          while i < len(lines):
              s = lines[i].strip()
              if s.startswith('//!') or s.startswith('#![') or s == '':
                  i += 1
              else:
                  break
          lines[i:i] = ['#![no_std]\n', 'extern crate alloc;\n']
          with open(path, 'w') as f:
              f.writelines(lines)
          PYEOF

      # Stage B2: the previous run confirmed a REAL blocker distinct from
      # anything Stage A/B address: the workspace's serde dependency
      # (`serde = { version = "1", features = ["derive"] }`, no
      # `default-features = false`) keeps its default `std` feature active.
      # larql-vindex-spec and larql-boundary depend on it directly;
      # larql-models inherits it via larql-vindex-spec; larql-compute
      # inherits it via larql-models. Only larql-execution (zero
      # dependencies, confirmed by reading its Cargo.toml) was unaffected --
      # which is why it was the one crate with a small, real Stage C signal
      # instead of a multi-thousand-line cascade of "cannot find X in this
      # scope" for basically the entire core prelude. No CLI flag fixes
      # this (`--no-default-features` on the crate itself doesn't touch a
      # dependency's own defaults unless the crate's Cargo.toml already
      # opts that dependency out, which none of these do) -- it needs an
      # actual Cargo.toml edit. Patched workspace-wide across every
      # `crates/*/Cargo.toml` in this ephemeral checkout (not just the
      # matrix target), since the dependency chain runs through crates
      # other than whichever one is currently under test.
      # Pattern too narrow the first time: only matched the exact string
      # `serde = { workspace = true }`, missing `serde = { workspace =
      # true, features = ["derive"] }` (used by larql-cli, larql-demos,
      # larql-router, larql-lql, larql-server -- confirmed via grep across
      # every crates/*/Cargo.toml). Cargo unifies a dependency's features
      # across the WHOLE workspace lockfile for any -p-scoped build run
      # from inside the workspace, not just the selected package, so those
      # 5 unpatched crates' still-default serde polluted every other
      # crate's build -- exactly why larql-vindex-spec's own (correctly
      # patched) serde line still produced an identical cascade: the
      # isolated serde-nostd-probe job (fully outside this workspace, no
      # other consumers to unify against) passed cleanly, proving the
      # de::value module itself works fine; only builds run from inside
      # the workspace, where the 5 unpatched crates were still present in
      # the same lockfile, kept failing. `[^}]*` matches any trailing
      # content after `workspace = true` so both variants are caught.
      - name: "Stage B2: patch std-defaulting dependency features"
        run: |
          sed -i -E \
            's/serde = \{ workspace = true[^}]*\}/serde = { version = "1", default-features = false, features = ["derive", "alloc"] }/' \
            crates/*/Cargo.toml
          grep -rn 'default-features = false, features = \["derive", "alloc"\]' crates/*/Cargo.toml || true
          echo "--- remaining unpatched serde lines (should be none, or already std-free) ---"
          grep -rn '^serde = ' crates/*/Cargo.toml | grep -v 'default-features = false' || true

      # Root cause found, not guessed: the diagnostic's first run (before
      # this fix) showed `serde feature "default"` active, pulled in by
      # criterion (a dev-dependency, used for benchmarks) -> ciborium ->
      # serde's own default std feature. Stage C's `--lib` flag limits what
      # gets COMPILED, but Cargo still unifies dev-dependency feature
      # requirements into the same resolution by default, silently merging
      # criterion's std-requiring serde with larql-boundary's own
      # no-std-patched serde and overriding Stage B2's patch entirely.
      # -Z avoid-dev-deps is a real, long-standing nightly flag built
      # specifically for this: skip resolving dev-dependencies when they
      # aren't needed for the requested build. Verified accepted (exit 0,
      # no "unknown -Z flag" error) before adding it here.
      - name: "Diagnostic: serde's actual resolved features for this build"
        if: always()
        run: |
          {
            echo "### serde feature resolution for ${{ matrix.crate }} (${{ matrix.profile }})"
            echo '```'
            cargo +nightly tree -p ${{ matrix.crate }} --target nvptx64-nvidia-cuda -Zbuild-std=core,alloc -Z avoid-dev-deps -e features -i serde 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Stage C -- the only stage whose dead_code/unused_*/unsafe_code
      # signal is honest for this target. -D on the mechanical lints too:
      # anything Stage A's fixer couldn't rewrite becomes a visible, named
      # error here instead of an opaque unresolved-path error. -Z
      # avoid-dev-deps added per the diagnostic above -- single, minimal
      # change, one hypothesis, testing before layering on anything else.
      - name: "Stage C: target-relative check against nvptx64-nvidia-cuda"
        id: nostd_check
        continue-on-error: true
        run: |
          RUSTFLAGS='-Ctarget-cpu=sm_89' cargo +nightly clippy -p ${{ matrix.crate }} --lib \
            --target nvptx64-nvidia-cuda -Zbuild-std=core,alloc -Z avoid-dev-deps --keep-going --message-format=json -- \
            -W dead_code -W unused_imports -W unused_variables -W unsafe_code \
            -W improper_ctypes -W improper_ctypes_definitions \
            -D clippy::std_instead_of_core -D clippy::std_instead_of_alloc > nostd_check.json

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.crate }} / ${{ matrix.profile }}"
            if [ -f hygiene.json ]; then
              echo "#### Stage A2 (host hygiene) findings"
              echo '```'
              jq -r 'select(.reason=="compiler-message") | .message.rendered' hygiene.json 2>/dev/null
              echo '```'
            fi
            echo "#### Stage C (nvptx64-nvidia-cuda, core+alloc) result"
            echo '```'
            jq -r 'select(.reason=="compiler-message" and .message.level=="error") | .message.message' nostd_check.json 2>/dev/null \
              | sort | uniq -c | sort -rn
            echo '```'
            echo "<details><summary>Stage C rendered diagnostics (capped at 200KB; full data in the uploaded artifact)</summary>"
            echo ''
            echo '```'
            jq -r 'select(.reason=="compiler-message") | .message.rendered' nostd_check.json 2>/dev/null | head -c 200000
            echo '```'
            echo '</details>'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload full diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nostd-fix-${{ matrix.crate }}-${{ matrix.profile }}-diagnostics
          path: |
            hygiene.json
            nostd_check.json
          if-no-files-found: ignore

      # Same honest-result discipline as nvptx64-nvidia-cuda's own final
      # step, applied here too -- Stage C used continue-on-error so the
      # summary step above still runs regardless, but nothing had unmasked
      # the job's own conclusion yet, which would have silently repeated
      # the exact green-camouflage bug fixed earlier in this workflow.
      # Green here means something real: this crate, on this profile,
      # currently compiles cleanly against nvptx64-nvidia-cuda under
      # core+alloc. Red means it doesn't yet, which is the true, expected
      # state for most cells right now (3 of 5 candidates are already known
      # to use std::collections::HashMap, a hard, non-mechanical blocker).
      - name: Assert honest result
        if: always()
        run: |
          if [ "${{ steps.nostd_check.outcome }}" = "failure" ]; then
            echo "::error::${{ matrix.crate }} (${{ matrix.profile }}) does not yet compile cleanly against nvptx64-nvidia-cuda under -Zbuild-std=core,alloc -- see Stage C in the summary above."
            exit 1
          fi
          echo "${{ matrix.crate }} (${{ matrix.profile }}) compiles cleanly against nvptx64-nvidia-cuda under -Zbuild-std=core,alloc."
