name: experiment-fmt-check

on:
  workflow_dispatch: {}

jobs:
  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt -p larql-cli -- --check
