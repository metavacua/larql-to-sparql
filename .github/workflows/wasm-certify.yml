# wasm-certify.yml — per-crate wasm32 certification cascade
#
# A `discover` job enumerates every workspace member that carries
# `[package.metadata.wasm-cert]`, then fans out into one `certify` job per
# crate.  Each job runs the full cascade independently:
#
#   Tier 1    — cargo check --target wasm32-unknown-unknown
#   Build     — cargo rustc --crate-type cdylib (production binary)
#   testgen   — structural tests from wasm exports → tests/wasm_generated.rs
#   Closure   — wasmparser + ascent Datalog → partition + Reification check
#   Tier 2    — cargo test --target wasm32-unknown-unknown (Node.js)
#   Coverage  — cargo llvm-cov on host (dual cfg_attr tests)
#   Mutation  — cargo mutants on wasm32-accessible modules
#   Tier 3    — Firefox runtime + Reification (F_defined = F_reachable)
#
# Exit code is non-zero only when a crate regresses below its current-tier.
# fail-fast: false — all crate results remain visible on failure.

name: wasm-certify

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm-certify.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm-certify.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # ── Enumerate crates that carry [package.metadata.wasm-cert] ───────────────
  discover:
    name: discover crates
    runs-on: ubuntu-24.04
    outputs:
      crates: ${{ steps.list.outputs.crates }}
    steps:
      - uses: actions/checkout@v6

      - name: List wasm-certifiable crates
        id: list
        run: |
          CRATES=$(cargo metadata --no-deps --format-version 1 | \
            jq -c '[.packages[] | select(.metadata["wasm-cert"] != null) | .name]')
          echo "crates=$CRATES" >> "$GITHUB_OUTPUT"

  # ── One certification job per crate ────────────────────────────────────────
  certify:
    name: certify · ${{ matrix.crate }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      checks: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable) + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      - name: Install wasm-bindgen-cli, cargo-mutants, cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.121,cargo-mutants,cargo-llvm-cov

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install geckodriver
        run: |
          VER=$(curl -fsSL https://api.github.com/repos/mozilla/geckodriver/releases/latest \
            | grep '"tag_name"' | head -1 | sed -E 's/.*"(v[^"]+)".*/\1/')
          curl -fsSL "https://github.com/mozilla/geckodriver/releases/download/${VER}/geckodriver-${VER}-linux64.tar.gz" \
            | sudo tar xz -C /usr/local/bin/

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-certify-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-certify-${{ matrix.crate }}-

      - name: Certify ${{ matrix.crate }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask wasm-certify --crate-name ${{ matrix.crate }}

  # ── Workspace-wide status table → job summary ──────────────────────────────
  summary:
    name: wasm-status
    needs: certify
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-status-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-status-

      - name: wasm-status → job summary
        run: cargo xtask wasm-status >> "$GITHUB_STEP_SUMMARY"
